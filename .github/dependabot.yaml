version: 2
updates:

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    target-branch: dev
    commit-message:
      prefix: '[dependency]'
    groups:
      actions-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /catbuffer/parser
    schedule:
      interval: weekly
      day: sunday
    target-branch: dev
    labels: [catbuffer-parser]
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: '[dependency]'
    groups:
      catbuffer-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /client/catapult/scripts
    schedule:
      interval: weekly
      day: sunday
    target-branch: dev
    labels: [catapult]
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: '[dependency]'
    groups:
      catapult-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /client/rest
    schedule:
      interval: weekly
      day: sunday
    target-branch: dev
    labels: [rest]
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: '[dependency]'
    groups:
      rest-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /jenkins/catapult
    schedule:
      interval: weekly
      day: sunday
    target-branch: dev
    labels: [jenkins]
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: '[dependency]'
    groups:
      jenkins-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /linters/cpp
    schedule:
      interval: weekly
      day: sunday
    target-branch: dev
    labels: [linters]
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: '[dependency]'
    groups:
      linter-cpp-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /linters/python
    schedule:
      interval: weekly
      day: sunday
    target-branch: dev
    labels: [linters]
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: '[dependency]'
    groups:
      linter-python-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /sdk/java
    schedule:
      interval: weekly
      day: sunday
    target-branch: dev
    labels: [sdk-java]
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: '[dependency]'
    groups:
      sdk-java-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /sdk/javascript
    schedule:
      interval: weekly
      day: sunday
    target-branch: dev
    labels: [sdk-javascript]
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: '[dependency]'
    groups:
      sdk-javascript-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /sdk/javascript/generator
    schedule:
      interval: weekly
      day: sunday
    target-branch: dev
    labels: [sdk-javascript]
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: '[dependency]'
    groups:
      sdk-javascript-generator-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    schedule:
      interval: weekly
      day: sunday
    labels: [dependencies]
    commit-message:
      prefix: '[dependency]'
    target-branch: dev
    directory: /sdk/javascript/wasm
    versioning-strategy: auto
    groups:
      cargo-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    schedule:
      interval: weekly
      day: sunday
    labels: [dependencies]
    commit-message:
      prefix: '[dependency]'
    target-branch: dev
    directory: /
    groups:
      github-actions-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    schedule:
      interval: weekly
      day: sunday
    labels: [dependencies]
    commit-message:
      prefix: '[dependency]'
    target-branch: dev
    versioning-strategy: increase-if-necessary
    groups:
      npm-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    directories:
      - /client/rest
      - /sdk/javascript
      - /mkdocs

  - package-ecosystem: pip
    schedule:
      interval: weekly
      day: sunday
    labels: [dependencies]
    commit-message:
      prefix: '[dependency]'
    target-branch: dev
    versioning-strategy: increase-if-necessary
    groups:
      pip-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    directories:
      - /catbuffer/parser
      - /client/catapult/scripts
      - /jenkins/catapult
      - /linters/cpp
      - /linters/python
      - /sdk/javascript/generator
      - /sdk/python
      - /mkdocs
