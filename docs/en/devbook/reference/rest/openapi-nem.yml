    get:
      tags:
        - Node
      summary: Return reachable (active) nodes in neighborhood
      description: |
        Gets a list of all nodes currently known by the running node that have status **ACTIVE**.
        Only nodes that are reachable and respond in a timely manner are returned.
      operationId: getReachableNodePeerList
      responses:
        '200':
          description: Successfully retrieved reachable nodes.
          content:
            application/json:
              schema:
