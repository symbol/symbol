<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<script>
			const userLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
			const supported = ['en', 'ja'];
			const lang = supported.includes(userLang.slice(0, 2)) ? userLang.slice(0, 2) : 'en';

			window.location.pathname = lang + '/404/';
		</script>
	</head>
	<body>
		Redirecting to your language...
		<br/>
		Use these links if redirection does not work: <a href="en/404/">English</a> <a href="ja/404/">日本語</a>
	</body>
</html>
