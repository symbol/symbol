    MosaicGlobalRestrictionEntryRestrictionDTO:
      type: object
      required:
        - referenceMosaicId
        - restrictionValue
        - restrictionType
      properties:
        referenceMosaicId:
          $ref: '#/components/schemas/MosaicId'
        restrictionValue:
          $ref: '#/components/schemas/RestrictionValue'
        restrictionType:
          $ref: '#/components/schemas/MosaicRestrictionTypeEnum'
    MosaicGlobalRestrictionEntryDTO:
      type: object
      required:
        - key
        - restriction
      properties:
        key:
          $ref: '#/components/schemas/RestrictionKey'
        restriction:
          $ref: '#/components/schemas/MosaicGlobalRestrictionEntryRestrictionDTO'
    MosaicGlobalRestrictionEntryWrapperDTO:
      type: object
      required:
        - version
        - compositeHash
        - entryType
        - mosaicId
        - restrictions
      properties:
        version:
          $ref: '#/components/schemas/StateVersion'
        compositeHash:
          $ref: '#/components/schemas/Hash256'
        entryType:
          $ref: '#/components/schemas/MosaicRestrictionEntryTypeEnum'
        mosaicId:
          $ref: '#/components/schemas/MosaicId'
        restrictions:
          type: array
          items:
            $ref: '#/components/schemas/MosaicGlobalRestrictionEntryDTO'
    MosaicGlobalRestrictionDTO:
      type: object
      required:
        - id
        - mosaicRestrictionEntry
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        mosaicRestrictionEntry:
          $ref: '#/components/schemas/MosaicGlobalRestrictionEntryWrapperDTO'
    MosaicRestrictionsPage:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: Array of mosaic restrictions.
          items:
            anyOf:
              - $ref: '#/components/schemas/MosaicAddressRestrictionDTO'
              - $ref: '#/components/schemas/MosaicGlobalRestrictionDTO'
        pagination:
          $ref: '#/components/schemas/Pagination'
    MosaicRestrictionDTO:
      type: object
      description: Generic Mosaic Restriction
      anyOf:
        - $ref: '#/components/schemas/MosaicAddressRestrictionDTO'
        - $ref: '#/components/schemas/MosaicGlobalRestrictionDTO'
  parameters:
    addressQuery:
      name: address
      in: query
      description: |
        Filter by address. For transaction search: an account's address is considered involved when the account is the sender,
        recipient, or cosigner; this filter cannot be combined with ``recipientAddress`` and ``signerPublicKey``.
        For account, restriction, and lock search: returns entities matching or associated with the address.
      schema:
        $ref: '#/components/schemas/Address'
    pageSizeQuery:
      name: pageSize
      in: query
      description: Select the number of entries to return.
      schema:
        type: integer
        minimum: 10
        maximum: 100
        default: 10
    pageNumberQuery:
      name: pageNumber
      in: query
      description: Filter by page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    offsetQuery:
      name: offset
      in: query
      description: |
        Cursor for pagination. Provide the value of the sort field (`orderBy`) from the
        last entry of the previous page. **The offset type must match `orderBy`:**
        - `orderBy=id`: use the entry's `id` (ObjectId, 24-char hex).
        - `orderBy=height`: use the block height (string, e.g. `"17592"`).
        - `orderBy=balance`: use the mosaic balance amount (string, e.g. `"1000000"`).
        Not all endpoints support all `orderBy` values; see the endpoint's `orderBy` parameter.

        The direction depends on `order`:
        - `order=desc`: returns elements with smaller sort-field values
          (the "next" page when viewing newest-first).
        - `order=asc`: returns elements with larger sort-field values
          (the "next" page when viewing oldest-first).
      schema:
        type: string
    orderQuery:
      name: order
      in: query
      description: |
        Sort responses in ascending or descending order based on the collection property set on the param ``orderBy``.
        If the request does not specify ``orderBy``, REST returns the collection ordered by id.
      schema:
        $ref: '#/components/schemas/Order'
    orderByAccountQuery:
      name: orderBy
      in: query
      description: |
        Sort responses by the property set.
        If ``balance`` option is selected, the request must define the ``mosaicId`` filter.
      schema:
        $ref: '#/components/schemas/AccountOrderByEnum'
        default: id
    mosaicIdQuery:
      name: mosaicId
      in: query
      description: Filter by mosaic identifier.
      schema:
        $ref: '#/components/schemas/MosaicId'
    accountIdPath:
      name: accountId
      in: path
      description: Account identifier. Accepts either a public key or a Base32-encoded address.
      required: true
      schema:
        oneOf:
          - $ref: '#/components/schemas/PublicKey'
          - $ref: '#/components/schemas/Address'
      examples:
        testnetAddress:
          summary: Testnet address (Base32, prefix T)
          value: TADP6C2GVEG654OP5LZI32P2GYJSCMEGQBYB7QY
        mainnetAddress:
          summary: Mainnet address (Base32, prefix N)
          value: NCHEST3QRQS4JZGOO64TH7NFJ2A63YA7TPM5PXI
        publicKey:
          summary: Account public key (hex)
          value: AC1A6E1D8DE5B17D2C6B1293F1CAD3829EEACF38D09311BB3C8E5A880092DE26
    signerPublicKeyQuery:
      name: signerPublicKey
      in: query
      description: Filter by public key of the account signing the entity.
      schema:
        $ref: '#/components/schemas/PublicKey'
    beneficiaryAddressQuery:
      name: beneficiaryAddress
      description: Filter by beneficiary address.
      in: query
      schema:
        $ref: '#/components/schemas/Address'
    orderByBlockQuery:
      name: orderBy
      in: query
      description: |
        Sort responses by the property set. Defaults to ``id`` when not specified.
      schema:
        $ref: '#/components/schemas/BlockOrderByEnum'
    fromTimestampQuery:
      name: fromTimestamp
      in: query
      description: |
        Only blocks with timestamp greater or equal than this one are returned.
      schema:
        $ref: '#/components/schemas/Timestamp'
    toTimestampQuery:
      name: toTimestamp
      in: query
      description: |
        Only blocks with timestamp smaller or equal than this one are returned.
      schema:
        $ref: '#/components/schemas/Timestamp'
    heightPath:
      name: height
      in: path
      description: Filter by block height. Sequential block position in the chain; starts at 1 and increments by one.
      required: true
      schema:
        $ref: '#/components/schemas/Height'
      examples:
        nemesis:
          summary: First block
          value: '1'
        recent:
          summary: Recent block height
          value: '17592'
    transactionHashPath:
      name: hash
      in: path
      description: Transaction hash.
      required: true
      schema:
        $ref: '#/components/schemas/Hash256'
      examples:
        default:
          summary: Transaction hash
          value: C8FC3FB54FDDFBCE0E8C71224990124E4EEC5AD5D30E592EDFA9524669A23810
    receiptHashPath:
      name: hash
      in: path
      description: Receipt statement hash.
      required: true
      schema:
        $ref: '#/components/schemas/Hash256'
      examples:
        default:
          summary: Receipt statement hash
          value: C8FC3FB54FDDFBCE0E8C71224990124E4EEC5AD5D30E592EDFA9524669A23810
    epochPath:
      name: epoch
      in: path
      description: |
        The finalization epoch is a sequential integer. Each epoch groups a set of blocks
        for finalization voting (interval defined by network config, e.g. 1440 blocks for mainnet).
      required: true
      schema:
        $ref: '#/components/schemas/FinalizationEpoch'
    recipientAddressQuery:
      name: recipientAddress
      in: query
      description: Filter by address of the account receiving the transaction.
      schema:
        $ref: '#/components/schemas/Address'
    heightQuery:
      name: height
      in: query
      description: |
        Filter by block height. Sequential block position in the chain; starts at 1 and increments by one.
      schema:
        $ref: '#/components/schemas/Height'
    fromHeightQuery:
      name: fromHeight
      in: query
      description: Only blocks with height greater or equal than this one are returned.
      schema:
        $ref: '#/components/schemas/Height'
    toHeightQuery:
      name: toHeight
      in: query
      description: Only blocks with height smaller or equal than this one are returned.
      schema:
        $ref: '#/components/schemas/Height'
    fromTransferAmountQuery:
      name: fromTransferAmount
      in: query
      description: |
        Requires providing the `transferMosaicId` filter.
        Only transfer transactions with a transfer amount of the provided mosaic id, greater or equal than this amount are returned.
      schema:
        $ref: '#/components/schemas/Amount'
    toTransferAmountQuery:
      name: toTransferAmount
      in: query
      description: |
        Requires providing the `transferMosaicId` filter.
        Only transfer transactions with a transfer amount of the provided mosaic id, lesser or equal than this amount are returned.
      schema:
        $ref: '#/components/schemas/Amount'
    transactionTypesQuery:
      name: type
      in: query
      description: |
        Filter by transaction type.
        To filter by multiple transaction types, add more filter query params like: ``type=16974&type=16718``.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TransactionTypeEnum'
    embeddedQuery:
      name: embedded
      in: query
      description: |
        When true, the endpoint also returns all the embedded aggregate transactions.
        Otherwise, only top-level transactions used to calculate the block transactionsHash are returned.
        **Note:** This field does not work when combined with the ``address`` parameter. This is,
        embedded transactions containing the address specified through the ``address`` parameter
        will not be returned even when used with ``embedded=true``. There is no problem when using
        other parameters like ``recipientAddress`` instead.
      schema:
        type: boolean
        default: false
    transferMosaicIdQuery:
      name: transferMosaicId
      in: query
      description: Filters transactions involving a specific ``mosaicId``.
      schema:
        $ref: '#/components/schemas/MosaicId'
    transactionIdPath:
      name: transactionId
      in: path
      description: Transaction id or hash.
      required: true
      schema:
        type: string
    addressPath:
      name: address
      in: path
      description: Account address.
      required: true
      schema:
        $ref: '#/components/schemas/Address'
    hashPath:
      name: hash
      in: path
      description: Filter by hash.
      required: true
      schema:
        $ref: '#/components/schemas/Hash256'
    secretQuery:
      name: secret
      in: query
      description: Filter by secret.
      schema:
        $ref: '#/components/schemas/Secret'
    compositeHashPath:
      name: compositeHash
      in: path
      description: Filter by composite hash.
      required: true
      schema:
        $ref: '#/components/schemas/Hash256'
    sourceAddressQuery:
      name: sourceAddress
      in: query
      description: Filter by address sending the metadata entry.
      schema:
        $ref: '#/components/schemas/Address'
    targetAddressQuery:
      name: targetAddress
      in: query
      description: Filter by target address.
      schema:
        $ref: '#/components/schemas/Address'
    scopedMetadataKeyQuery:
      name: scopedMetadataKey
      in: query
      description: Filter by metadata key.
      schema:
        $ref: '#/components/schemas/MetadataKey'
    targetIdQuery:
      name: targetId
      in: query
      description: Filter by namespace or mosaic id.
      schema:
        type: string
        format: hex
        example: 0DC67FBE1CAD29E3
    metadataTypeQuery:
      name: metadataType
      in: query
      description: Filter by metadata type.
      schema:
        $ref: '#/components/schemas/MetadataTypeEnum'
    metalIdPath:
      name: metalId
      in: path
      description: |
        Metal identifier: Base58-encoded composite hash of the first metadata chunk.
      required: true
      schema:
        type: string
    mosaicIdPath:
      name: mosaicId
      in: path
      description: Mosaic identifier encoded as a 16-character hexadecimal string.
      required: true
      schema:
        $ref: '#/components/schemas/MosaicId'
    ownerAddressQuery:
      name: ownerAddress
      in: query
      description: Filter by owner address in Base32 format.
      schema:
        $ref: '#/components/schemas/Address'
    registrationTypeQuery:
      name: registrationType
      in: query
      description: |
        Filter by namespace registration type.
        - 0: Root namespace.
        - 1: Subnamespace.
      schema:
        $ref: '#/components/schemas/NamespaceRegistrationTypeEnum'
    level0Query:
      name: level0
      in: query
      description: Filter by the root namespace identifier.
      schema:
        $ref: '#/components/schemas/NamespaceId'
    aliasTypeQuery:
      name: aliasType
      in: query
      description: |
        Filter by alias type.
        - 0: Namespace has no alias.
        - 1: Namespace is linked to a mosaic id.
        - 2: Namespace is linked to an address.
      schema:
        $ref: '#/components/schemas/AliasTypeEnum'
    namespaceIdPath:
      name: namespaceId
      in: path
      description: Namespace identifier encoded as a 16-character hexadecimal string.
      required: true
      schema:
        $ref: '#/components/schemas/NamespaceId'
    receiptTypesQuery:
      name: receiptType
      in: query
      description: |
        Filter by receipt type.
        To filter by multiple receipt types, add more filter query params like: ``receiptType=8515&receiptType=20803``.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ReceiptTypeEnum'
    senderAddressQuery:
      name: senderAddress
      in: query
      description: Filter by address sending mosaics.
      schema:
        $ref: '#/components/schemas/Address'
    artifactIdQuery:
      name: artifactId
      in: query
      description: Mosaic or namespace identifier
      schema:
        type: string
    entryTypeQuery:
      name: entryType
      in: query
      description: Filter by entry type.
      schema:
        $ref: '#/components/schemas/MosaicRestrictionEntryTypeEnum'
  responses:
    InvalidArgument:
      description: |
        The required arguments were missing or unacceptable for the request.
        Returned with HTTP status 409.
        The response body contains `code` (e.g. `InvalidArgument`) and `message` with a human-readable description.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ModelError'
          examples:
            invalidAccountId:
              value:
                code: InvalidArgument
                message: accountId has an invalid format
            invalidArrayElement:
              value:
                code: InvalidArgument
                message: element in array addresses has an invalid format
    InvalidContent:
      description: |
        The provided argument was not an acceptable input.
        Returned with HTTP status 400.
        Typically indicates malformed request body (e.g. invalid JSON) or content that cannot be parsed.
        The response body contains `code` (e.g. `InvalidContent`) and `message` with a human-readable description.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ModelError'
          examples:
            invalidJson:
              value:
                code: InvalidContent
                message: 'Invalid JSON: Unexpected token ''i'', "invalid json" is not valid JSON'
    ResourceNotFound:
      description: |
        The requested resource does not exist.
        Returned with HTTP status 404.
        The response body contains `code` (e.g. `ResourceNotFound`) and `message` with the missing resource identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ModelError'
          examples:
            accountNotFound:
              value:
                code: ResourceNotFound
                message: no resource exists with id 'NCHEST3QRQS4JZGOO64TH7NFJ2A63YA7TPM5PXI'
            blockNotFound:
              value:
                code: ResourceNotFound
                message: no resource exists with id '999999999999'
  requestBodies:
    accountIds:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/accountIds'
          examples:
            byPublicKeys:
              summary: Lookup by public keys
              value:
                publicKeys:
                  - AC1A6E1D8DE5B17D2C6B1293F1CAD3829EEACF38D09311BB3C8E5A880092DE26
            byAddresses:
              summary: Lookup by addresses (Base32)
              value:
                addresses:
                  - TADP6C2GVEG654OP5LZI32P2GYJSCMEGQBYB7QY
      required: false
    transactionPayload:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/transactionPayload'
      required: true
    transactionIds:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/transactionIds'
      required: true
    transactionHashes:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/transactionHashes'
      required: true
    cosignature:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cosignature'
      required: true
    hashes:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/hashes'
      required: true
    compositeHashes:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/compositeHashes'
      required: true
    mosaicIds:
      description: Request body containing mosaic identifiers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/mosaicIds'
      required: true
    namespaceIds:
      description: Request body containing namespace identifiers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/namespaceIds'
      required: true
    addresses:
      description: Request body containing account addresses in Base32 format.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/addresses'
      required: true
