      description: |
        Validation or processing result associated with a transaction status.
        This enum includes generic results (`Success`, `Neutral`, `Failure`) and detailed validation failure codes
        that can be returned when a node accepts, tracks, or rejects a transaction:
        - `Success`
        - `Neutral`
        - `Failure`
        - `Failure_Core_Past_Deadline`: Validation failed because the deadline passed.
        - `Failure_Core_Future_Deadline`: Validation failed because the deadline is too far in the future.
        - `Failure_Core_Insufficient_Balance`: Validation failed because the account has an insufficient balance.
        - `Failure_Core_Too_Many_Transactions`: Validation failed because there are too many transactions in a block.
        - `Failure_Core_Nemesis_Account_Signed_After_Nemesis_Block`: Validation failed
          because an entity originated from the nemesis account after the nemesis (first) block.
        - `Failure_Core_Wrong_Network`: Validation failed because the entity has the wrong network specified.
        - `Failure_Core_Invalid_Address`: Validation failed because an address is invalid.
        - `Failure_Core_Invalid_Version`: Validation failed because entity version is invalid.
        - `Failure_Core_Invalid_Transaction_Fee`: Validation failed because a transaction fee is invalid.
        - `Failure_Core_Block_Harvester_Ineligible`: Validation failed because a block was harvested by an ineligible harvester.
        - `Failure_Core_Zero_Address`: Validation failed because an address is zero.
        - `Failure_Core_Zero_Public_Key`: Validation failed because a public key is zero.
        - `Failure_Core_Nonzero_Internal_Padding`: Validation failed because internal padding is nonzero.
        - `Failure_Core_Address_Collision`: Validation failed because an address collision is detected.
        - `Failure_Core_Importance_Block_Mismatch`: Validation failed because the block does not match the schema of an importance block.
        - `Failure_Core_Unexpected_Block_Type`: Validation failed because the block type is unexpected.
        - `Failure_Core_Invalid_Link_Action`: Validation failed because link action is invalid.
        - `Failure_Core_Link_Already_Exists`: Validation failed because main account is already linked to another account.
        - `Failure_Core_Inconsistent_Unlink_Data`: Validation failed because unlink data is not consistent with existing account link.
        - `Failure_Core_Invalid_Link_Range`: Validation failed because link range is invalid.
        - `Failure_Core_Too_Many_Links`: Validation failed because main account has too many links of the specified type.
        - `Failure_Core_Link_Start_Epoch_Invalid`: Validation failed because the start epoch is invalid.
        - `Failure_Hash_Already_Exists`
        - `Failure_Signature_Not_Verifiable`: Validation failed because the verification of the signature failed.
        - `Failure_AccountLink_Link_Already_Exists`: Validation failed because main account is already linked to another account.
        - `Failure_AccountLink_Inconsistent_Unlink_Data`:
          Validation failed because unlink data is not consistent with existing account link.
        - `Failure_AccountLink_Unknown_Link`: Validation failed because main account is not linked to another account.
        - `Failure_AccountLink_Remote_Account_Ineligible`: Validation failed because
          link is attempting to convert ineligible account to remote.
        - `Failure_AccountLink_Remote_Account_Signer_Prohibited`: Validation failed because remote is not allowed to sign a transaction.
        - `Failure_AccountLink_Remote_Account_Participant_Prohibited`: Validation failed
          because remote is not allowed to participate in the transaction.
        - `Failure_Aggregate_Too_Many_Transactions`: Validation failed because aggregate has too many transactions.
        - `Failure_Aggregate_No_Transactions`: Validation failed because aggregate does not have any transactions.
        - `Failure_Aggregate_Too_Many_Cosignatures`: Validation failed because aggregate has too many cosignatures.
        - `Failure_Aggregate_Redundant_Cosignatures`: Validation failed because redundant cosignatures are present.
        - `Failure_Aggregate_Ineligible_Cosignatories`: Validation failed because at least one cosignatory is ineligible.
        - `Failure_Aggregate_Missing_Cosignatures`: Validation failed because at least one required cosignature is missing.
        - `Failure_Aggregate_Transactions_Hash_Mismatch`: Validation failed because the
          aggregate transactions hash does not match the calculated value.
        - `Failure_Aggregate_V1_Prohibited`: Validation failed because aggregate transaction with version 1 is not allowed.
        - `Failure_Aggregate_V2_Prohibited`: Validation failed because aggregate transaction with version 2 is not allowed.
        - `Failure_Aggregate_V3_Prohibited`: Validation failed because aggregate transaction with version 3 is not allowed.
        - `Failure_LockHash_Invalid_Mosaic_Id`: Validation failed because lock does not allow the specified mosaic.
        - `Failure_LockHash_Invalid_Mosaic_Amount`: Validation failed because lock does not allow the specified amount.
        - `Failure_LockHash_Hash_Already_Exists`: Validation failed because hash is already present in cache.
        - `Failure_LockHash_Unknown_Hash`: Validation failed because hash is not present in cache.
        - `Failure_LockHash_Inactive_Hash`: Validation failed because hash is inactive.
        - `Failure_LockHash_Invalid_Duration`: Validation failed because duration is too long.
        - `Failure_LockSecret_Invalid_Hash_Algorithm`: Validation failed because hash algorithm for lock type secret is invalid.
        - `Failure_LockSecret_Hash_Already_Exists`: Validation failed because hash is already present in cache.
        - `Failure_LockSecret_Proof_Size_Out_Of_Bounds`: Validation failed because proof is too small or too large.
        - `Failure_LockSecret_Secret_Mismatch`: Validation failed because secret does not match proof.
        - `Failure_LockSecret_Unknown_Composite_Key`: Validation failed because composite key is unknown.
        - `Failure_LockSecret_Inactive_Secret`: Validation failed because secret is inactive.
        - `Failure_LockSecret_Hash_Algorithm_Mismatch`: Validation failed because hash algorithm does not match.
        - `Failure_LockSecret_Invalid_Duration`: Validation failed because duration is too long.
        - `Failure_Metadata_Value_Too_Small`: Validation failed because the metadata value is too small.
        - `Failure_Metadata_Value_Too_Large`: Validation failed because the metadata value is too large.
        - `Failure_Metadata_Value_Size_Delta_Too_Large`: Validation failed because the
          metadata value size delta is larger in magnitude than the value size.
        - `Failure_Metadata_Value_Size_Delta_Mismatch`: Validation failed because the
          metadata value size delta does not match expected value based on the current state.
        - `Failure_Metadata_Value_Change_Irreversible`: Validation failed because a metadata value change (truncation) is irreversible.
        - `Failure_Mosaic_Invalid_Duration`: Validation failed because the duration has an invalid value.
        - `Failure_Mosaic_Invalid_Name`: Validation failed because the name is invalid.
        - `Failure_Mosaic_Name_Id_Mismatch`: Validation failed because the name and ID don't match.
        - `Failure_Mosaic_Expired`: Validation failed because the parent is expired.
        - `Failure_Mosaic_Owner_Conflict`: Validation failed because the parent owner conflicts with the child owner.
        - `Failure_Mosaic_Id_Mismatch`: Validation failed because the ID is not the expected ID generated from signer and nonce.
        - `Failure_Mosaic_Parent_Id_Conflict`: Validation failed because the existing parent ID does not match the supplied parent ID.
        - `Failure_Mosaic_Invalid_Property`: Validation failed because a mosaic property is invalid.
        - `Failure_Mosaic_Invalid_Flags`: Validation failed because the mosaic flags are invalid.
        - `Failure_Mosaic_Invalid_Divisibility`: Validation failed because the mosaic divisibility is invalid.
        - `Failure_Mosaic_Invalid_Supply_Change_Action`: Validation failed because the mosaic supply change action is invalid.
        - `Failure_Mosaic_Invalid_Supply_Change_Amount`: Validation failed because the mosaic supply change amount is invalid.
        - `Failure_Mosaic_Invalid_Id`: Validation failed because the mosaic ID is invalid.
        - `Failure_Mosaic_Modification_Disallowed`: Validation failed because mosaic modification is not allowed.
        - `Failure_Mosaic_Modification_No_Changes`: Validation failed because mosaic modification would not result in any changes.
        - `Failure_Mosaic_Supply_Immutable`: Validation failed because the mosaic supply is immutable.
        - `Failure_Mosaic_Supply_Negative`: Validation failed because the resulting mosaic supply is negative.
        - `Failure_Mosaic_Supply_Exceeded`: Validation failed because the resulting mosaic supply exceeds the maximum allowed value.
        - `Failure_Mosaic_Non_Transferable`: Validation failed because the mosaic is not transferable.
        - `Failure_Mosaic_Max_Mosaics_Exceeded`: Validation failed because the credit
          of the mosaic would exceed the maximum of different mosaics an account is allowed to own.
        - `Failure_Mosaic_Required_Property_Flag_Unset`: Validation failed because the mosaic has at least one required property flag unset.
        - `Failure_Multisig_Account_In_Both_Sets`: Validation failed because account is specified to be both added and removed.
        - `Failure_Multisig_Multiple_Deletes`: Validation failed because multiple removals are present.
        - `Failure_Multisig_Redundant_Modification`: Validation failed because a modification is redundant.
        - `Failure_Multisig_Unknown_Multisig_Account`: Validation failed because account is not in multisig cache.
        - `Failure_Multisig_Not_A_Cosignatory`: Validation failed because account to be removed is not present.
        - `Failure_Multisig_Already_A_Cosignatory`: Validation failed because account to be added is already a cosignatory.
        - `Failure_Multisig_Min_Setting_Out_Of_Range`: Validation failed because new minimum settings are out of range.
        - `Failure_Multisig_Min_Setting_Larger_Than_Num_Cosignatories`: Validation
          failed because min settings are larger than number of cosignatories.
        - `Failure_Multisig_Invalid_Modification_Action`: Validation failed because the modification action is invalid.
        - `Failure_Multisig_Max_Cosigned_Accounts`:
          Validation failed because the cosignatory already cosigns the maximum number of accounts.
        - `Failure_Multisig_Max_Cosignatories`: Validation failed because the multisig
          account already has the maximum number of cosignatories.
        - `Failure_Multisig_Loop`: Validation failed because a multisig loop is created.
        - `Failure_Multisig_Max_Multisig_Depth`: Validation failed because the max multisig depth is exceeded.
        - `Failure_Multisig_Operation_Prohibited_By_Account`: Validation failed because an operation is not permitted by a multisig account.
        - `Failure_Namespace_Invalid_Duration`: Validation failed because the duration has an invalid value.
        - `Failure_Namespace_Invalid_Name`: Validation failed because the name is invalid.
        - `Failure_Namespace_Name_Id_Mismatch`: Validation failed because the name and ID don't match.
        - `Failure_Namespace_Expired`: Validation failed because the parent is expired.
        - `Failure_Namespace_Owner_Conflict`: Validation failed because the parent owner conflicts with the child owner.
        - `Failure_Namespace_Id_Mismatch`: Validation failed because the ID is not the expected ID generated from signer and nonce.
        - `Failure_Namespace_Invalid_Registration_Type`: Validation failed because the namespace registration type is invalid.
        - `Failure_Namespace_Root_Name_Reserved`: Validation failed because the root namespace has a reserved name.
        - `Failure_Namespace_Too_Deep`: Validation failed because the resulting namespace would exceed the maximum allowed namespace depth.
        - `Failure_Namespace_Unknown_Parent`: Validation failed because the namespace parent is unknown.
        - `Failure_Namespace_Already_Exists`: Validation failed because the namespace already exists.
        - `Failure_Namespace_Already_Active`: Validation failed because the namespace is already active.
        - `Failure_Namespace_Eternal_After_Nemesis_Block`: Validation failed because an
          eternal namespace was received after the nemesis (first) block.
        - `Failure_Namespace_Max_Children_Exceeded`: Validation failed because the
          maximum number of children for a root namespace was exceeded.
        - `Failure_Namespace_Alias_Invalid_Action`: Validation failed because alias action is invalid.
        - `Failure_Namespace_Unknown`: Validation failed because namespace does not exist.
        - `Failure_Namespace_Alias_Already_Exists`: Validation failed because namespace is already linked to an alias.
        - `Failure_Namespace_Unknown_Alias`: Validation failed because namespace is not linked to an alias.
        - `Failure_Namespace_Alias_Inconsistent_Unlink_Type`: Validation failed because unlink type is not consistent with existing alias.
        - `Failure_Namespace_Alias_Inconsistent_Unlink_Data`: Validation failed because unlink data is not consistent with existing alias.
        - `Failure_Namespace_Alias_Invalid_Address`: Validation failed because aliased address is invalid.
        - `Failure_RestrictionAccount_Invalid_Restriction_Flags`: Validation failed because the account restriction flags are invalid.
        - `Failure_RestrictionAccount_Invalid_Modification_Action`: Validation failed because a modification action is invalid.
        - `Failure_RestrictionAccount_Invalid_Modification_Address`: Validation failed because a modification address is invalid.
        - `Failure_RestrictionAccount_Modification_Operation_Type_Incompatible`: Validation failed because the operation type is
          incompatible. *Note*: This indicates that the existing restrictions have a different
          operation type than that specified in the notification.
        - `Failure_RestrictionAccount_Redundant_Modification`: Validation failed because a modification is redundant.
        - `Failure_RestrictionAccount_Invalid_Modification`: Validation failed because a value is not in the container.
        - `Failure_RestrictionAccount_Modification_Count_Exceeded`: Validation failed because the transaction has too many modifications.
        - `Failure_RestrictionAccount_No_Modifications`: Validation failed because the transaction has no modifications.
        - `Failure_RestrictionAccount_Values_Count_Exceeded`: Validation failed because
          the resulting account restriction has too many values.
        - `Failure_RestrictionAccount_Invalid_Value`: Validation failed because the account restriction value is invalid.
        - `Failure_RestrictionAccount_Address_Interaction_Prohibited`: Validation
          failed because the addresses involved in the transaction are not allowed to interact.
        - `Failure_RestrictionAccount_Mosaic_Transfer_Prohibited`: Validation failed
          because the mosaic transfer is prohibited by the recipient.
        - `Failure_RestrictionAccount_Operation_Type_Prohibited`: Validation failed
          because the operation type is not allowed to be initiated by the signer.
        - `Failure_RestrictionMosaic_Invalid_Restriction_Type`: Validation failed because the mosaic restriction type is invalid.
        - `Failure_RestrictionMosaic_Previous_Value_Mismatch`: Validation failed
          because specified previous value does not match current value.
        - `Failure_RestrictionMosaic_Previous_Value_Must_Be_Zero`: Validation failed
          because specified previous value is nonzero.
        - `Failure_RestrictionMosaic_Max_Restrictions_Exceeded`: Validation failed
          because the maximum number of restrictions would be exceeded.
        - `Failure_RestrictionMosaic_Cannot_Delete_Nonexistent_Restriction` - Validation failed
          because nonexistent restriction cannot be deleted.
        - `Failure_RestrictionMosaic_Unknown_Global_Restriction`: Validation failed because required global restriction does not exist.
        - `Failure_RestrictionMosaic_Invalid_Global_Restriction`: Validation failed because mosaic has invalid global restriction.
        - `Failure_RestrictionMosaic_Account_Unauthorized`: Validation failed because account lacks proper permissions to move mosaic.
        - `Failure_Transfer_Message_Too_Large`: Validation failed because the message is too large.
        - `Failure_Transfer_Out_Of_Order_Mosaics`: Validation failed because mosaics are out of order.
        - `Failure_Chain_Unlinked`: Validation failed because a block was received that did not link with the existing chain.
        - `Failure_Chain_Block_Not_Hit`: Validation failed because a block was received that is not a hit.
        - `Failure_Chain_Block_Inconsistent_State_Hash`: Validation failed because a block was received that has an inconsistent state hash.
        - `Failure_Chain_Block_Inconsistent_Receipts_Hash`: Validation failed because a
          block was received that has an inconsistent receipts hash.
        - `Failure_Chain_Block_Invalid_Vrf_Proof`: Validation failed because the Vrf proof is invalid.
        - `Failure_Chain_Block_Unknown_Signer`: Validation failed because the block signer is unknown.
        - `Failure_Chain_Unconfirmed_Cache_Too_Full`: Validation failed because the unconfirmed cache is too full.
        - `Failure_Consumer_Empty_Input`: Validation failed because the consumer input is empty.
        - `Failure_Consumer_Block_Transactions_Hash_Mismatch`: Validation failed
          because the block transactions hash does not match the calculated value.
        - `Neutral_Consumer_Hash_In_Recency_Cache`: Validation failed because an entity hash is present in the recency cache.
        - `Failure_Consumer_Remote_Chain_Improper_Link`: Validation failed because the chain is internally improperly linked.
        - `Failure_Consumer_Remote_Chain_Duplicate_Transactions`: Validation failed because the chain part contains duplicate transactions.
        - `Failure_Consumer_Remote_Chain_Unlinked`: Validation failed because the chain part does not link to the current chain.
        - `Failure_Consumer_Remote_Chain_Difficulties_Mismatch`: Validation failed
          because the remote chain difficulties do not match the calculated difficulties.
        - `Failure_Consumer_Remote_Chain_Score_Not_Better`: Validation failed because the remote chain score is not better.
        - `Failure_Consumer_Remote_Chain_Too_Far_Behind`: Validation failed because the remote chain is too far behind.
        - `Failure_Consumer_Remote_Chain_Too_Far_In_Future`: Validation failed because the remote chain timestamp is too far in the future.
        - `Failure_Consumer_Batch_Signature_Not_Verifiable`: Validation failed because
          the verification of the signature failed during a batch operation.
        - `Failure_Consumer_Remote_Chain_Improper_Importance_Link`: Validation failed
          because the remote chain has an improper importance link.
        - `Failure_Extension_Partial_Transaction_Cache_Prune`: Validation failed
          because the partial transaction was pruned from the temporal cache.
        - `Failure_Extension_Partial_Transaction_Dependency_Removed`: Validation failed
          because the partial transaction was pruned from the temporal cache due to its dependency being removed.
        - `Failure_Extension_Read_Rate_Limit_Exceeded`: Validation failed because socket read rate limit was exceeded.
    TransactionStatusDTO:
      type: object
      description: Current processing status of a transaction identified by its hash.
      required:
        - group
        - deadline
        - hash
      properties:
        group:
          $ref: '#/components/schemas/TransactionGroupEnum'
        code:
          $ref: '#/components/schemas/TransactionStatusEnum'
        hash:
          $ref: '#/components/schemas/Hash256'
          description: Hash of the transaction.
        deadline:
          $ref: '#/components/schemas/Timestamp'
          description: Deadline specified by the transaction, expressed in milliseconds since the creation of the nemesis (first) block.
        height:
          $ref: '#/components/schemas/Height'
          description: Block height at which the transaction was confirmed, when available.
    cosignature:
      type: object
      description: Wrapper object containing the detached cosignature fields required to cosign an aggregate bonded transaction.
      required:
        - parentHash
        - signature
        - signerPublicKey
        - version
      properties:
        parentHash:
          $ref: '#/components/schemas/Hash256'
          description: Hash of the parent aggregate bonded transaction being cosigned.
        signature:
          $ref: '#/components/schemas/Signature'
        signerPublicKey:
          $ref: '#/components/schemas/PublicKey'
          description: Public key of the cosigner creating the cosignature.
        version:
          $ref: '#/components/schemas/CosignatureVersion'
    LockStatus:
      type: integer
      enum:
        - 0
        - 1
      description: |
        Status of a hash lock or secret lock.
        - `0` (`UNUSED`): the lock is active and has not been consumed yet.
        - `1` (`USED`): the lock has already been consumed and is no longer active.
    HashLockEntryDTO:
      type: object
      description: |
        Locked funds deposited before announcing an aggregate bonded transaction.
        If the aggregate bonded transaction is not completed before the lock expires,
        the locked funds are credited to the block harvester.
      required:
        - version
        - ownerAddress
        - mosaicId
        - amount
        - endHeight
        - status
        - hash
      properties:
        version:
          $ref: '#/components/schemas/StateVersion'
        ownerAddress:
          $ref: '#/components/schemas/AddressHex'
          description: Address of the account that created the hash lock.
        mosaicId:
          $ref: '#/components/schemas/MosaicId'
          description: Identifier of the locked mosaic.
        amount:
          $ref: '#/components/schemas/Amount'
          description: Amount of locked mosaic units, expressed in the mosaic's smallest (atomic) unit.
        endHeight:
          $ref: '#/components/schemas/Height'
          description: Block height at which the hash lock expires if it is not completed earlier.
        status:
          $ref: '#/components/schemas/LockStatus'
        hash:
          $ref: '#/components/schemas/Hash256'
          description: Hash of the aggregate bonded transaction associated with the lock.
    HashLockInfoDTO:
      type: object
      description: Wrapper object containing one hash lock entry and its identifier.
      required:
        - id
        - lock
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        lock:
          $ref: '#/components/schemas/HashLockEntryDTO'
    HashLockPage:
      type: object
      description: Paginated response containing hash lock entries.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: Hash lock entries matching the requested filters.
          items:
            $ref: '#/components/schemas/HashLockInfoDTO'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Secret:
      type: string
      description: |
        256-bit hashed secret derived from the proof using the selected `LockHashAlgorithm`.
        In secret lock and secret proof transactions, the revealed proof must hash to this value.
      pattern: ^[0-9a-fA-F]+$
      minLength: 64
      maxLength: 64
      examples:
        - FB8558E82C1968A3536CD77ACD7F9BC65E8B8F346714C9F91B42D6C2177BEDC1
    SecretLockEntryDTO:
      type: object
      description: |
        Locked mosaic funds that can be claimed by the recipient only after revealing a valid proof.
        If the proof is not revealed before the lock expires, the locked funds are returned to the sender.
      required:
        - version
        - ownerAddress
        - mosaicId
        - amount
        - endHeight
        - status
        - hashAlgorithm
        - secret
        - recipientAddress
        - compositeHash
      properties:
        version:
          $ref: '#/components/schemas/StateVersion'
        ownerAddress:
          $ref: '#/components/schemas/AddressHex'
          description: Address of the account that created the secret lock.
        mosaicId:
          $ref: '#/components/schemas/MosaicId'
          description: Identifier of the locked mosaic.
        amount:
          $ref: '#/components/schemas/Amount'
          description: Amount of locked mosaic units, expressed in the mosaic's smallest (atomic) unit.
        endHeight:
          $ref: '#/components/schemas/Height'
          description: Block height at which the secret lock expires if no valid proof is announced earlier.
        status:
          $ref: '#/components/schemas/LockStatus'
        hashAlgorithm:
          $ref: '#/components/schemas/LockHashAlgorithmEnum'
        secret:
          $ref: '#/components/schemas/Secret'
        recipientAddress:
          $ref: '#/components/schemas/AddressHex'
          description: Address of the account that can unlock the funds by announcing the matching proof.
        compositeHash:
          $ref: '#/components/schemas/Hash256'
          description: |
            Composite SHA3-256 hash derived from `secret` and `recipientAddress`.
            It uniquely identifies the secret lock entry and is computed automatically by the protocol;
            it is not supplied as a standalone field when announcing the secret lock transaction.
    SecretLockInfoDTO:
      type: object
      description: Wrapper object containing one secret lock entry and its identifier.
      required:
        - id
        - lock
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        lock:
          $ref: '#/components/schemas/SecretLockEntryDTO'
    SecretLockPage:
      type: object
      description: Paginated response containing secret lock entries.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: Secret lock entries matching the requested filters.
          items:
            $ref: '#/components/schemas/SecretLockInfoDTO'
        pagination:
          $ref: '#/components/schemas/Pagination'
    compositeHashes:
      type: object
      properties:
        compositeHashes:
          type: array
          description: Array of composite hashes.
          items:
            $ref: '#/components/schemas/Hash256'
    MetadataTypeEnum:
      type: integer
      enum:
        - 0
        - 1
        - 2
      description: |
        Type of resource targeted by the metadata entry:
        - `0`: Account metadata
        - `1`: Mosaic metadata
        - `2`: Namespace metadata
    MetadataEntryDTO:
      type: object
      description: Full on-chain metadata entry identified by a composite hash.
      required:
        - version
        - compositeHash
        - sourceAddress
        - targetAddress
        - scopedMetadataKey
        - metadataType
        - valueSize
        - value
      properties:
        version:
          $ref: '#/components/schemas/StateVersion'
        compositeHash:
          description: |
            Composite hash derived from sourceAddress, targetAddress, scopedMetadataKey, targetId, and metadataType.
            It uniquely identifies the metadata entry.
          $ref: '#/components/schemas/Hash256'
        sourceAddress:
          description: Hex-encoded address of the account that created the metadata entry.
          $ref: '#/components/schemas/AddressHex'
        targetAddress:
          description: |
            Hex-encoded address of the target account.
            For mosaic metadata and namespace metadata, this is the address of the resource owner.
          $ref: '#/components/schemas/AddressHex'
        scopedMetadataKey:
          $ref: '#/components/schemas/MetadataKey'
        targetId:
          description: Mosaic or namespace identifier for mosaic metadata or namespace metadata. For account metadata, this value is 0.
          anyOf:
            - $ref: '#/components/schemas/MosaicId'
            - $ref: '#/components/schemas/NamespaceId'
        metadataType:
          $ref: '#/components/schemas/MetadataTypeEnum'
        valueSize:
          $ref: '#/components/schemas/MetadataValueSize'
        value:
          $ref: '#/components/schemas/MetadataValue'
    MetadataInfoDTO:
      type: object
      description: Metadata information including an internal resource identifier and the full metadata entry state.
      required:
        - id
        - metadataEntry
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        metadataEntry:
          $ref: '#/components/schemas/MetadataEntryDTO'
    MetadataPage:
      type: object
      description: Paginated response containing metadata entries.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: Array of metadata entries.
          items:
            $ref: '#/components/schemas/MetadataInfoDTO'
        pagination:
          $ref: '#/components/schemas/Pagination'
    MosaicDTO:
      type: object
      description: State information describing a mosaic definition.
      required:
        - version
        - id
        - supply
        - startHeight
        - ownerAddress
        - revision
        - flags
        - divisibility
        - duration
      properties:
        version:
          $ref: '#/components/schemas/StateVersion'
        id:
          $ref: '#/components/schemas/MosaicId'
        supply:
          $ref: '#/components/schemas/Amount'
          description: Current total supply of the mosaic, expressed in the smallest (atomic) unit.
        startHeight:
          $ref: '#/components/schemas/Height'
          description: Block height at which the mosaic became active.
        ownerAddress:
          $ref: '#/components/schemas/AddressHex'
          description: Address of the account that created the mosaic.
        revision:
          $ref: '#/components/schemas/UInt32'
          description: |
            Revision number of the mosaic definition.
            Starts at 1 when the mosaic is created and increments each time the same mosaic definition is modified.
          examples:
            - 1
        flags:
          $ref: '#/components/schemas/MosaicFlagsEnum'
        divisibility:
          $ref: '#/components/schemas/Divisibility'
        duration:
          $ref: '#/components/schemas/BlockDuration'
          description: Duration of the mosaic in blocks. A value of 0 indicates a non-expiring mosaic.
    MosaicInfoDTO:
      type: object
      description: Mosaic information including an internal resource identifier and the full mosaic state.
      required:
        - id
        - mosaic
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        mosaic:
          $ref: '#/components/schemas/MosaicDTO'
    MosaicPage:
      type: object
      description: Paginated list of mosaic information objects.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: Array of mosaic information objects.
          items:
            $ref: '#/components/schemas/MosaicInfoDTO'
        pagination:
          $ref: '#/components/schemas/Pagination'
    mosaicIds:
      type: object
      description: Array payload used to submit mosaic identifiers.
      properties:
        mosaicIds:
          type: array
          description: Array of mosaic identifiers.
          items:
            $ref: '#/components/schemas/MosaicId'
    MultisigDTO:
      type: object
      description: Current multisig state of an account.
      required:
        - version
        - accountAddress
        - minApproval
        - minRemoval
        - cosignatoryAddresses
        - multisigAddresses
      properties:
        version:
          $ref: '#/components/schemas/StateVersion'
        accountAddress:
          $ref: '#/components/schemas/AddressHex'
        minApproval:
          $ref: '#/components/schemas/UInt32'
          description: Minimum number of cosignatory approvals required to approve a transaction for the multisig account.
          examples:
            - 2
        minRemoval:
          $ref: '#/components/schemas/UInt32'
          description: Minimum number of cosignatory approvals required to remove a cosignatory from the multisig account.
          examples:
            - 1
        cosignatoryAddresses:
          type: array
          description: Direct cosignatory addresses that manage this multisig account.
          items:
            $ref: '#/components/schemas/AddressHex'
        multisigAddresses:
          type: array
          description: Multisig account addresses where this account acts as a cosignatory.
          examples:
            - []
          items:
            $ref: '#/components/schemas/AddressHex'
    MultisigAccountInfoDTO:
      type: object
      description: Multisig account information with the full multisig state.
      required:
        - multisig
      properties:
        multisig:
          $ref: '#/components/schemas/MultisigDTO'
          description: Full multisig state for the requested account.
    MultisigAccountGraphInfoDTO:
      type: object
      description: Multisig graph entries grouped by distance from the requested account.
      required:
        - level
        - multisigEntries
      properties:
        level:
          type: integer
          description: |
            Relative graph level.
            `0` is the requested account, negative levels are multisig accounts for which the requested
            account acts as a cosignatory, and positive levels are multisig relationships reached through
            cosignatories.
          examples:
            - 0
        multisigEntries:
          type: array
          description: Multisig state entries discovered at this graph level.
          items:
            $ref: '#/components/schemas/MultisigAccountInfoDTO'
    AliasTypeEnum:
      type: integer
      enum:
        - 0
        - 1
        - 2
      description: |
        Type of alias currently linked to the namespace.
        A namespace can either have no alias assigned, point to a mosaic ID, or point to
        an account address.

        - 0: No alias is linked to the namespace.
        - 1: The namespace is linked to a mosaic ID and can be used as a mosaic alias.
        - 2: The namespace is linked to an account address and can be used as an address alias.
      examples:
        - 0
    NamespaceMetaDTO:
      type: object
      description: |
        Metadata about the namespace entry.
        Includes whether the namespace is currently active and its internal ordering index.
      required:
        - active
        - index
      properties:
        active:
          type: boolean
          description: Indicates whether the namespace is currently active at the chain height used to serve the request.
        index:
          type: integer
          minimum: 0
          description: |
            Internal namespace index used by the backend and Mongo storage to identify and order historical
            namespace entries. This value is returned for informational purposes only.
            API clients should not use it as a pagination cursor; use the standard pagination query parameters (`pageSize`,
            `pageNumber`, `offset`, `order`) instead.
    AliasDTO:
      type: object
      description: |
        Alias currently linked to the namespace.
        Depending on `type`, the namespace either has no alias, points to a mosaic ID, or points to an account address.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/AliasTypeEnum'
        mosaicId:
          $ref: '#/components/schemas/MosaicId'
          description: Mosaic identifier linked by the namespace when `type` is `1`.
        address:
          $ref: '#/components/schemas/AddressHex'
          description: Account address linked by the namespace when `type` is `2`.
    NamespaceDTO:
      type: object
      description: State information describing a namespace and its alias configuration.
      required:
        - version
        - registrationType
        - depth
        - level0
        - alias
        - parentId
        - ownerAddress
        - startHeight
        - endHeight
      properties:
        version:
          $ref: '#/components/schemas/StateVersion'
        registrationType:
          $ref: '#/components/schemas/NamespaceRegistrationTypeEnum'
        depth:
          type: integer
          description: |
            Number of levels present in the namespace path.
            This matches how many namespace IDs are defined across `level0`, `level1`, and `level2`.
          examples:
            - 1
        level0:
          $ref: '#/components/schemas/NamespaceId'
          description: Namespace identifier of the root namespace.
        level1:
          $ref: '#/components/schemas/NamespaceId'
          description: Namespace identifier of the first subnamespace level, when present.
        level2:
          $ref: '#/components/schemas/NamespaceId'
          description: Namespace identifier of the second subnamespace level, when present.
        alias:
          $ref: '#/components/schemas/AliasDTO'
        parentId:
          $ref: '#/components/schemas/NamespaceId'
          description: Parent namespace identifier for a subnamespace.
        ownerAddress:
          $ref: '#/components/schemas/AddressHex'
          description: Address of the account that owns the namespace.
        startHeight:
          $ref: '#/components/schemas/Height'
          description: Block height at which the namespace became active.
        endHeight:
          $ref: '#/components/schemas/Height'
          description: Block height at which the namespace expires.
    NamespaceInfoDTO:
      type: object
      description: Namespace information including an internal resource identifier, metadata, and the full namespace state.
      required:
        - id
        - meta
        - namespace
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        meta:
          $ref: '#/components/schemas/NamespaceMetaDTO'
        namespace:
          $ref: '#/components/schemas/NamespaceDTO'
    NamespacePage:
      type: object
      description: Paginated list of namespace information entries.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: Array of namespace information entries.
          items:
            $ref: '#/components/schemas/NamespaceInfoDTO'
        pagination:
          $ref: '#/components/schemas/Pagination'
    namespaceIds:
      type: object
      description: Array payload used to submit namespace identifiers.
      properties:
        namespaceIds:
          type: array
          description: Array of namespace identifiers.
          items:
            $ref: '#/components/schemas/NamespaceId'
    NamespaceNameDTO:
      type: object
      description: Resolved human-readable name for a namespace identifier.
      required:
        - id
        - name
      properties:
        parentId:
          $ref: '#/components/schemas/NamespaceId'
          description: Parent namespace identifier when the resolved namespace is a subnamespace.
        id:
          $ref: '#/components/schemas/NamespaceId'
          description: Namespace identifier that was resolved.
        name:
          type: string
          description: Human-readable namespace name.
          examples:
            - cat
    addresses:
      type: object
      description: Array payload used to submit account addresses in Base32 format.
      properties:
        addresses:
          type: array
          description: Array of addresses.
          items:
            $ref: '#/components/schemas/Address'
    AccountNamesDTO:
      type: object
      description: Resolved namespace names linked to a specific account address.
      required:
        - address
        - names
      properties:
        address:
          $ref: '#/components/schemas/AddressHex'
          description: Account address for which namespace names were resolved.
        names:
          type: array
          description: Namespace names currently linked to the account.
          examples:
            - nononon
            - maromaro1989
          items:
            type: string
    AccountsNamesDTO:
      type: object
      description: Collection of namespace name resolution results for account addresses.
      required:
        - accountNames
      properties:
        accountNames:
          type: array
          description: Array of namespace name entries resolved for the requested account addresses.
          items:
            $ref: '#/components/schemas/AccountNamesDTO'
    MosaicNamesDTO:
      type: object
      description: |
        Resolved namespace names linked to a specific mosaic identifier.
        An empty `names` array means no namespace aliases were resolved for that
        identifier.
      required:
        - mosaicId
        - names
      properties:
        mosaicId:
          $ref: '#/components/schemas/MosaicId'
          description: Mosaic identifier for which namespace names were resolved.
        names:
          type: array
          description: Namespace names currently linked to the mosaic identifier.
          examples:
            - symbol.xym
          items:
            type: string
    MosaicsNamesDTO:
      type: object
      description: |
        Collection of namespace name resolution results for mosaic identifiers.
        The response contains one entry per requested mosaic identifier and preserves the
        request order.
      required:
        - mosaicNames
      properties:
        mosaicNames:
          type: array
          description: Array of namespace name entries resolved for the requested mosaic identifiers in request order.
          items:
            $ref: '#/components/schemas/MosaicNamesDTO'
    ReceiptTypeEnum:
      type: integer
      enum:
        - 4685
        - 4942
        - 8515
        - 8776
        - 9032
        - 8786
        - 9042
        - 12616
        - 12626
        - 16717
        - 16718
        - 16974
        - 20803
        - 57667
        - 61763
        - 62019
      description: |
        Numeric code identifying the receipt type.
        Supported values:
        - `0x124D` (`4685`): Mosaic_Rental_Fee.
        - `0x134E` (`4942`): Namespace_Rental_Fee.
        - `0x2143` (`8515`): Harvest_Fee.
        - `0x2248` (`8776`): LockHash_Completed.
        - `0x2348` (`9032`): LockHash_Expired.
        - `0x2252` (`8786`): LockSecret_Completed.
        - `0x2352` (`9042`): LockSecret_Expired.
        - `0x3148` (`12616`): LockHash_Created.
        - `0x3152` (`12626`): LockSecret_Created.
        - `0x414D` (`16717`): Mosaic_Expired.
        - `0x414E` (`16718`): Namespace_Expired.
        - `0x424E` (`16974`): Namespace_Deleted.
        - `0x5143` (`20803`): Inflation.
        - `0xE143` (`57667`): Transaction_Group.
        - `0xF143` (`61763`): Address_Alias_Resolution.
        - `0xF243` (`62019`): Mosaic_Alias_Resolution.
    StatementMetaDTO:
      type: object
      required:
        - timestamp
      description: Metadata for a statement containing the block timestamp when it was recorded.
      properties:
        timestamp:
          $ref: '#/components/schemas/Timestamp'
          description: Block timestamp in milliseconds since nemesis block when the statement was recorded.
    SourceDTO:
      type: object
      description: Identifies the transaction source that produced the receipt or resolution entry.
      required:
        - primaryId
        - secondaryId
      properties:
        primaryId:
          $ref: '#/components/schemas/UInt32'
          description: |
            Index of the top-level transaction within the block.
            A top-level transaction is a transaction that appears directly in the block,
            not one that is embedded inside an aggregate transaction.
            Indexing is `1`-based, so the first top-level transaction in the block has `primaryId = 1`.
            This value can be `0` when the statement does not refer to a specific transaction source.
            Use this value to locate the block transaction that produced the receipt or resolution entry.
          examples:
            - 1
        secondaryId:
          $ref: '#/components/schemas/UInt32'
          description: |
            Index of the embedded transaction within the aggregate transaction.
            Indexing is `1`-based, so the first embedded transaction has `secondaryId = 1`.
            If the source is not an embedded transaction, this value is `0`.
            Use this together with `primaryId` to pinpoint the exact embedded transaction inside an aggregate.
          examples:
            - 0
    ReceiptDTO:
      type: object
      description: Base fields shared by all receipt types.
      required:
        - version
        - type
      properties:
        version:
          type: integer
          description: Version of the receipt format.
        type:
          $ref: '#/components/schemas/ReceiptTypeEnum'
    BalanceTransferReceiptDTO:
      type: object
      description: |
        Receipt emitted when transaction execution transfers a mosaic balance between accounts.
        For example, this receipt is emitted when mosaic or namespace rental fees are paid.
        In that case, the sender address is the account registering the mosaic or namespace, and the
        recipient address is the configured rental fee sink address.
      allOf:
        - $ref: '#/components/schemas/ReceiptDTO'
        - type: object
          required:
            - mosaicId
            - amount
            - senderAddress
            - recipientAddress
          properties:
            mosaicId:
              $ref: '#/components/schemas/MosaicId'
              description: Identifier of the transferred mosaic.
            amount:
              $ref: '#/components/schemas/Amount'
              description: Amount of mosaic units transferred, expressed in the mosaic's smallest (atomic) unit.
            senderAddress:
              $ref: '#/components/schemas/AddressHex'
              description: Address from which the mosaic balance was transferred.
            recipientAddress:
              $ref: '#/components/schemas/AddressHex'
              description: Address that received the mosaic balance.
    BalanceChangeReceiptDTO:
      type: object
      description: |
        Receipt emitted when transaction execution changes an account mosaic balance.
        For example, this receipt is emitted when harvesting rewards are credited to the harvester or
        beneficiary account.
      allOf:
        - $ref: '#/components/schemas/ReceiptDTO'
        - type: object
          required:
            - mosaicId
            - amount
            - targetAddress
          properties:
            mosaicId:
              $ref: '#/components/schemas/MosaicId'
              description: Identifier of the mosaic whose balance changed.
            amount:
              $ref: '#/components/schemas/Amount'
              description: Amount of mosaic units added to or removed from the balance, expressed in the mosaic's smallest (atomic) unit.
            targetAddress:
              $ref: '#/components/schemas/AddressHex'
              description: Address whose balance was affected.
    NamespaceExpiryReceiptDTO:
      type: object
      description: Receipt emitted when a namespace reaches the end of its lifetime and expires.
      allOf:
        - $ref: '#/components/schemas/ReceiptDTO'
        - type: object
          required:
            - artifactId
          properties:
            artifactId:
              $ref: '#/components/schemas/NamespaceId'
              description: Identifier of the expired namespace.
    MosaicExpiryReceiptDTO:
      type: object
      description: Receipt emitted when a mosaic reaches the end of its lifetime and expires.
      allOf:
        - $ref: '#/components/schemas/ReceiptDTO'
        - type: object
          required:
            - artifactId
          properties:
            artifactId:
              $ref: '#/components/schemas/MosaicId'
              description: Identifier of the expired mosaic.
    InflationReceiptDTO:
      type: object
      description: Receipt emitted when new network currency mosaic units are created by inflation.
      allOf:
        - $ref: '#/components/schemas/ReceiptDTO'
        - type: object
          required:
            - mosaicId
            - amount
          properties:
            mosaicId:
              $ref: '#/components/schemas/MosaicId'
              description: Identifier of the network currency mosaic created by inflation.
            amount:
              $ref: '#/components/schemas/Amount'
              description: Amount of mosaic units created by inflation, expressed in the mosaic's smallest (atomic) unit.
    TransactionStatementDTO:
      type: object
      description: Transaction statement containing receipts emitted by a transaction source at a given block height.
      required:
        - height
        - source
        - receipts
      properties:
        height:
          $ref: '#/components/schemas/Height'
          description: Height of the block that contains the statement.
        source:
          $ref: '#/components/schemas/SourceDTO'
        receipts:
          type: array
          description: Receipts emitted by the transaction source.
          items:
            anyOf:
              - $ref: '#/components/schemas/BalanceTransferReceiptDTO'
              - $ref: '#/components/schemas/BalanceChangeReceiptDTO'
              - $ref: '#/components/schemas/NamespaceExpiryReceiptDTO'
              - $ref: '#/components/schemas/MosaicExpiryReceiptDTO'
              - $ref: '#/components/schemas/InflationReceiptDTO'
    TransactionStatementInfoDTO:
      type: object
      required:
        - id
        - meta
        - statement
      description: Wrapper object containing one transaction statement and its metadata.
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        meta:
          $ref: '#/components/schemas/StatementMetaDTO'
        statement:
          $ref: '#/components/schemas/TransactionStatementDTO'
    TransactionStatementPage:
      type: object
      description: Paginated response containing transaction statements.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: Transaction statements matching the requested filters.
          items:
            $ref: '#/components/schemas/TransactionStatementInfoDTO'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ResolutionEntryDTO:
      type: object
      description: One resolved value for an unresolved alias and transaction source.
      required:
        - source
        - resolved
      properties:
        source:
          $ref: '#/components/schemas/SourceDTO'
          description: Transaction source for which the unresolved alias resolved to this value.
        resolved:
          anyOf:
            - $ref: '#/components/schemas/AddressHex'
            - $ref: '#/components/schemas/MosaicId'
          description: Concrete address or mosaic ID resolved from the alias for this source.
    ResolutionStatementDTO:
      type: object
      description: Resolution statement describing how one unresolved alias was resolved at a given block height.
      required:
        - height
        - unresolved
        - resolutionEntries
      properties:
        height:
          $ref: '#/components/schemas/Height'
          description: Height of the block that contains the resolution statement.
        unresolved:
          anyOf:
            - $ref: '#/components/schemas/UnresolvedMosaicId'
            - $ref: '#/components/schemas/UnresolvedAddress'
          description: Unresolved alias value used in the transaction before resolution.
        resolutionEntries:
          type: array
          description: |
            Resolution entries linked to the unresolved alias.
            Multiple entries can be present because the resolved value can change within the same block.
            This can happen when alias-related transactions in the same block change which address or mosaic id
            the alias points to, so different transaction sources observe different resolved values.
          items:
            $ref: '#/components/schemas/ResolutionEntryDTO'
    ResolutionStatementInfoDTO:
      type: object
      required:
        - id
        - meta
        - statement
      description: |
        Wrapper object containing one resolution statement and its metadata.
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        meta:
          $ref: '#/components/schemas/StatementMetaDTO'
        statement:
          $ref: '#/components/schemas/ResolutionStatementDTO'
    ResolutionStatementPage:
      type: object
      description: Paginated response containing resolution statements.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: Resolution statements matching the requested filters.
          items:
            $ref: '#/components/schemas/ResolutionStatementInfoDTO'
        pagination:
          $ref: '#/components/schemas/Pagination'
    AccountRestrictionDTO:
      type: object
      description: One account restriction rule consisting of restriction flags and the restricted values.
      required:
        - restrictionFlags
        - values
      properties:
        restrictionFlags:
          $ref: '#/components/schemas/AccountRestrictionFlagsEnum'
        values:
          type: array
          description: |
            Restricted values matched by this rule.
            The value type depends on `restrictionFlags` and can be an address, mosaic ID, or transaction type.
          items:
            anyOf:
              - $ref: '#/components/schemas/UnresolvedAddress'
              - $ref: '#/components/schemas/UnresolvedMosaicId'
              - $ref: '#/components/schemas/TransactionTypeEnum'
    AccountRestrictionsDTO:
      type: object
      required:
        - version
        - address
        - restrictions
      properties:
        version:
          $ref: '#/components/schemas/StateVersion'
        address:
          $ref: '#/components/schemas/AddressHex'
        restrictions:
          type: array
          items:
            $ref: '#/components/schemas/AccountRestrictionDTO'
    AccountRestrictionsInfoDTO:
      type: object
      description: Wrapper object containing one account restriction entry.
      required:
        - accountRestrictions
      properties:
        accountRestrictions:
          $ref: '#/components/schemas/AccountRestrictionsDTO'
    AccountRestrictionsPage:
      type: object
      description: Paginated response containing account restriction entries.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: Account restriction entries matching the requested filters.
          items:
            $ref: '#/components/schemas/AccountRestrictionsInfoDTO'
        pagination:
          $ref: '#/components/schemas/Pagination'
    MosaicRestrictionEntryTypeEnum:
      type: integer
      enum:
        - 0
        - 1
      description: |
        Mosaic restriction entry type:
        - `0`: address restriction entry for a specific target account
        - `1`: global restriction entry defining the rule for the mosaic
    RestrictionKey:
      type: string
      description: |
        Creator-defined 64-bit numeric identifier of a mosaic restriction, scoped to a mosaic.
        It can be derived from a human-readable name by hashing it, and is represented as a decimal string in stored restriction entries.
      examples:
        - '790526'
    MosaicAddressRestrictionEntryDTO:
      type: object
      description: Address-specific mosaic restriction value associated with a restriction key.
      required:
        - key
        - value
      properties:
        key:
          $ref: '#/components/schemas/RestrictionKey'
        value:
          $ref: '#/components/schemas/RestrictionValue'
    MosaicAddressRestrictionEntryWrapperDTO:
      type: object
      description: Wrapper object containing one mosaic address restriction entry.
      required:
        - version
        - compositeHash
        - entryType
        - mosaicId
        - targetAddress
        - restrictions
      properties:
        version:
          $ref: '#/components/schemas/StateVersion'
        compositeHash:
          description: Composite hash uniquely identifying the mosaic restriction entry.
          $ref: '#/components/schemas/Hash256'
        entryType:
          $ref: '#/components/schemas/MosaicRestrictionEntryTypeEnum'
        mosaicId:
          description: Mosaic identifier for which the restrictions are defined.
          $ref: '#/components/schemas/MosaicId'
        targetAddress:
          description: Hex-encoded address to which the restrictions apply.
          $ref: '#/components/schemas/AddressHex'
        restrictions:
          description: Address-specific restriction values associated with the mosaic and target address.
          type: array
          items:
            $ref: '#/components/schemas/MosaicAddressRestrictionEntryDTO'
    MosaicAddressRestrictionDTO:
      type: object
      required:
        - id
        - mosaicRestrictionEntry
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        mosaicRestrictionEntry:
          $ref: '#/components/schemas/MosaicAddressRestrictionEntryWrapperDTO'
    MosaicGlobalRestrictionEntryRestrictionDTO:
      type: object
      description: Rule definition for a global mosaic restriction key.
      required:
        - referenceMosaicId
        - restrictionValue
        - restrictionType
      properties:
        referenceMosaicId:
          description: |
            Mosaic identifier providing the restriction key used by this global restriction rule.
            The global restriction for the requested mosaic depends on the rule defined on this reference mosaic.
            This value is `0` when the restriction key is defined on the same mosaic.
          $ref: '#/components/schemas/MosaicId'
        restrictionValue:
          $ref: '#/components/schemas/RestrictionValue'
        restrictionType:
          $ref: '#/components/schemas/MosaicRestrictionTypeEnum'
    MosaicGlobalRestrictionEntryDTO:
      type: object
      description: Global mosaic restriction rule associated with a restriction key.
      required:
        - key
        - restriction
      properties:
        key:
          $ref: '#/components/schemas/RestrictionKey'
        restriction:
          $ref: '#/components/schemas/MosaicGlobalRestrictionEntryRestrictionDTO'
    MosaicGlobalRestrictionEntryWrapperDTO:
      type: object
      description: Wrapper object containing one mosaic global restriction entry.
      required:
        - version
        - compositeHash
        - entryType
        - mosaicId
        - restrictions
      properties:
        version:
          $ref: '#/components/schemas/StateVersion'
        compositeHash:
          description: Composite hash uniquely identifying the mosaic restriction entry.
          $ref: '#/components/schemas/Hash256'
        entryType:
          $ref: '#/components/schemas/MosaicRestrictionEntryTypeEnum'
        mosaicId:
          description: Mosaic identifier for which the restrictions are defined.
          $ref: '#/components/schemas/MosaicId'
        restrictions:
          description: Global restriction rules associated with the mosaic.
          type: array
          items:
            $ref: '#/components/schemas/MosaicGlobalRestrictionEntryDTO'
    MosaicGlobalRestrictionDTO:
      type: object
      description: Wrapper object containing one mosaic global restriction entry and its identifier.
      required:
        - id
        - mosaicRestrictionEntry
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        mosaicRestrictionEntry:
          $ref: '#/components/schemas/MosaicGlobalRestrictionEntryWrapperDTO'
    MosaicRestrictionsPage:
      type: object
      description: Paginated list of mosaic restriction entries.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: Array of mosaic restrictions.
          items:
            anyOf:
              - $ref: '#/components/schemas/MosaicAddressRestrictionDTO'
              - $ref: '#/components/schemas/MosaicGlobalRestrictionDTO'
        pagination:
          $ref: '#/components/schemas/Pagination'
    MosaicRestrictionDTO:
      type: object
      description: Wrapper object containing one mosaic restriction entry, either a global restriction or an address restriction.
      anyOf:
        - $ref: '#/components/schemas/MosaicAddressRestrictionDTO'
        - $ref: '#/components/schemas/MosaicGlobalRestrictionDTO'
  parameters:
    addressQuery:
      name: address
      in: query
      description: |
        Filter by address (include), in Base32 format.

        The exact meaning depends on the endpoint:
        - transaction search: returns transactions where the address appears as the sender, recipient, or cosigner
        - account search: matches the account address
        - account restriction search: matches the restricted account address
        - hash lock and secret lock search: matches the lock owner address

        On transaction search endpoints, this filter cannot be combined with `recipientAddress` and
        `signerPublicKey`.
      schema:
        $ref: '#/components/schemas/Address'
    pageSizeQuery:
      name: pageSize
      in: query
      description: |
        Select the number of entries to return per page.
        Values outside the allowed range are clamped to the schema minimum or maximum.
      schema:
        type: integer
        minimum: 10
        maximum: 100
        default: 10
    pageNumberQuery:
      name: pageNumber
      in: query
      description: |
        Page number for numbered pagination (1-based).

        Numbered and cursor pagination can be combined, but this is not recommended because the semantics
        are harder to reason about. For cursor-style flows, keep `pageNumber=1` and advance pages by
        updating only `offset`. For numbered pagination flows, omit `offset` and advance pages by
        incrementing `pageNumber`.
      schema:
        type: integer
        minimum: 1
        default: 1
    offsetQuery:
      name: offset
      in: query
      description: |
        Cursor for pagination. Provide the value of the sort field (`orderBy`) from the
        last entry of the previous page. **The offset type must match `orderBy`:**
        - `orderBy=id`: use the entry's `id` (ObjectId, 24-char hex).
        - `orderBy=height`: use the block height (string, e.g. `"17592"`).
        - `orderBy=balance`: use the mosaic balance amount (string, e.g. `"1000000"`).

        Allowed `orderBy` values depend on the endpoint. If `orderBy` is omitted, `id` is used by default.

        Set `offset` to the sort-field value of the last entry from the previous page. Across pages,
        this value decreases with `order=desc` and increases with `order=asc`.

        Numbered and cursor pagination can be combined, but this is not recommended because the semantics
        are harder to reason about. For cursor-style flows, keep `pageNumber=1` and advance pages by
        updating only `offset`. For numbered pagination flows, omit `offset` and advance pages by
        incrementing `pageNumber`.
      schema:
        type: string
    orderQuery:
      name: order
      in: query
      description: |
        Sort responses in ascending or descending order based on the collection property set on the param `orderBy`.
        If the request does not specify `orderBy`, REST returns the collection ordered by id.
        The default sort direction depends on the endpoint implementation.
      schema:
        $ref: '#/components/schemas/Order'
    orderByAccountQuery:
      name: orderBy
      in: query
      description: |
        Sort responses by the property set.
        If `balance` option is selected, the request must define the `mosaicId` filter.
      schema:
        $ref: '#/components/schemas/AccountOrderByEnum'
        default: id
    mosaicIdQuery:
      name: mosaicId
      in: query
      description: Filter by mosaic identifier (include).
      schema:
        $ref: '#/components/schemas/MosaicId'
    accountIdPath:
      name: accountId
      in: path
      description: Account identifier. Accepts either a public key or a Base32-encoded address.
      required: true
      schema:
        oneOf:
          - $ref: '#/components/schemas/PublicKey'
          - $ref: '#/components/schemas/Address'
      examples:
        testnetAddress:
          summary: Testnet address (Base32, prefix T)
          value: TADP6C2GVEG654OP5LZI32P2GYJSCMEGQBYB7QY
        mainnetAddress:
          summary: Mainnet address (Base32, prefix N)
          value: NCHEST3QRQS4JZGOO64TH7NFJ2A63YA7TPM5PXI
        publicKey:
          summary: Account public key (hex)
          value: AC1A6E1D8DE5B17D2C6B1293F1CAD3829EEACF38D09311BB3C8E5A880092DE26
    signerPublicKeyQuery:
      name: signerPublicKey
      in: query
      description: Filter transactions by the public key of the signing account (include).
      schema:
        $ref: '#/components/schemas/PublicKey'
    beneficiaryAddressQuery:
      name: beneficiaryAddress
      description: Filter by beneficiary address (include).
      in: query
      schema:
        $ref: '#/components/schemas/Address'
    orderByBlockQuery:
      name: orderBy
      in: query
      description: |
        Sort responses by the property set. Defaults to `id` when not specified.
      schema:
        $ref: '#/components/schemas/BlockOrderByEnum'
    fromTimestampQuery:
      name: fromTimestamp
      in: query
      description: |
        Only blocks with timestamp greater or equal than this one are returned. The timestamp is
        expressed in milliseconds since the nemesis block.
      schema:
        $ref: '#/components/schemas/Timestamp'
    toTimestampQuery:
      name: toTimestamp
      in: query
      description: |
        Only blocks with timestamp smaller or equal than this one are returned. The timestamp is
        expressed in milliseconds since the nemesis block.
      schema:
        $ref: '#/components/schemas/Timestamp'
    heightPath:
      name: height
      in: path
      description: Filter by block height (include). Sequential block position in the chain; starts at 1 and increments by one.
      required: true
      schema:
        $ref: '#/components/schemas/Height'
      examples:
        nemesis:
          summary: First block
          value: '1'
        recent:
          summary: Recent block height
          value: '17592'
    transactionHashPath:
      name: hash
      in: path
      description: Transaction hash encoded as a 64-character hexadecimal string.
      required: true
      schema:
        $ref: '#/components/schemas/Hash256'
      examples:
        default:
          value: C8FC3FB54FDDFBCE0E8C71224990124E4EEC5AD5D30E592EDFA9524669A23810
    receiptHashPath:
      name: hash
      in: path
      description: Receipt statement hash.
      required: true
      schema:
        $ref: '#/components/schemas/Hash256'
      examples:
        default:
          summary: Receipt statement hash
          value: C8FC3FB54FDDFBCE0E8C71224990124E4EEC5AD5D30E592EDFA9524669A23810
    epochPath:
      name: epoch
      in: path
      description: |
        The finalization epoch is a sequential integer. Each epoch groups a set of blocks
        for finalization voting (interval defined by network config, e.g. 1440 blocks for mainnet).
      required: true
      schema:
        $ref: '#/components/schemas/FinalizationEpoch'
    recipientAddressQuery:
      name: recipientAddress
      in: query
      description: Filter transactions by recipient address in Base32 format (include).
      schema:
        $ref: '#/components/schemas/Address'
    heightQuery:
      name: height
      in: query
      description: |
        Filter by height (include).
        The exact meaning depends on the endpoint, for example block height for blocks or inclusion height for
        confirmed transactions.
      schema:
        $ref: '#/components/schemas/Height'
    fromHeightQuery:
      name: fromHeight
      in: query
      description: Only transactions at or above this block height are returned.
      schema:
        $ref: '#/components/schemas/Height'
    toHeightQuery:
      name: toHeight
      in: query
      description: Only transactions at or below this block height are returned.
      schema:
        $ref: '#/components/schemas/Height'
    fromTransferAmountQuery:
      name: fromTransferAmount
      in: query
      description: |
        Requires providing the `transferMosaicId` filter.
        Only transfer transactions with an amount greater than or equal to this value for the specified mosaic ID are returned.
      schema:
        $ref: '#/components/schemas/Amount'
    toTransferAmountQuery:
      name: toTransferAmount
      in: query
      description: |
        Requires providing the `transferMosaicId` filter.
        Only transfer transactions with an amount less than or equal to this value for the specified mosaic ID are returned.
      schema:
        $ref: '#/components/schemas/Amount'
    transactionTypesQuery:
      name: type
      in: query
      description: |
        Filter by transaction type (include).
        To match multiple transaction types, add more query parameters like: `type=16974&type=16718`.
      style: form
      explode: true
      schema:
        type: array
        description: Array of transaction type identifiers to match.
        items:
          $ref: '#/components/schemas/TransactionTypeEnum'
    embeddedQuery:
      name: embedded
      in: query
      description: |
        When `true`, the search also includes transactions embedded inside aggregate transactions.
        Otherwise, only top-level transactions are returned.

        Results are **flattened**. Embedded transactions are returned as separate entries in the same
        `data` array as top-level transactions, not nested under their parent aggregate transaction.
        Sorting, filtering, and pagination are therefore applied to one combined result set containing
        both top-level and embedded transaction records.

        In the database, embedded transactions are stored as separate documents linked to their
        parent aggregate by `meta.aggregateId` and `meta.aggregateHash`. When `embedded=false`, the
        search excludes documents with `meta.aggregateId`. When `embedded=true`, those documents are
        included in the page result alongside regular transactions. In REST responses, embedded entries
        are identified by `meta.aggregateId`, `meta.aggregateHash`, and their inner `meta.index`;
        unlike top-level transactions, they do not carry their own `meta.hash`.

        **Note:** This field does not work as expected with the `address` filter. That filter matches the
        internal `meta.addresses` field used on top-level transaction documents, while embedded
        transaction documents do not carry that field. As a result, embedded transactions involving the
        specified address will not be returned even when `embedded=true`. Filters such as
        `recipientAddress` and `signerPublicKey` do not have this limitation.
      schema:
        type: boolean
        default: false
    transferMosaicIdQuery:
      name: transferMosaicId
      in: query
      description: Filter transfer transactions by the mosaic ID in the transfer payload (include).
      schema:
        $ref: '#/components/schemas/MosaicId'
    transactionIdPath:
      name: transactionId
      in: path
      description: Transaction ID assigned by the node or transaction hash.
      required: true
      schema:
        type: string
    addressPath:
      name: address
      in: path
      description: Account address in Base32-encoded format.
      required: true
      schema:
        $ref: '#/components/schemas/Address'
    hashPath:
      name: hash
      in: path
      description: Filter by hash (include).
      required: true
      schema:
        $ref: '#/components/schemas/Hash256'
    secretQuery:
      name: secret
      in: query
      description: Filter by the 256-bit hashed secret associated with the secret lock (include).
      schema:
        $ref: '#/components/schemas/Secret'
    compositeHashPath:
      name: compositeHash
      in: path
      description: Composite hash encoded as a 64-character hexadecimal string.
      required: true
      schema:
        $ref: '#/components/schemas/Hash256'
    sourceAddressQuery:
      name: sourceAddress
      in: query
      description: Filter by address sending the metadata entry (include).
      schema:
        $ref: '#/components/schemas/Address'
    targetAddressQuery:
      name: targetAddress
      in: query
      description: Filter by target address in Base32 (include).
      schema:
        $ref: '#/components/schemas/Address'
    scopedMetadataKeyQuery:
      name: scopedMetadataKey
      in: query
      description: Filter by metadata key (include).
      schema:
        $ref: '#/components/schemas/MetadataKey'
    targetIdQuery:
      name: targetId
      in: query
      description: Filter by namespace or mosaic ID (include).
      schema:
        type: string
        pattern: ^[0-9a-fA-F]+$
        minLength: 16
        maxLength: 16
      examples:
        mosaicId:
          summary: Mosaic identifier
          value: 0DC67FBE1CAD29E3
        namespaceId:
          summary: Namespace identifier
          value: 85BBEA6CC462B244
    metadataTypeQuery:
      name: metadataType
      in: query
      description: |
        Filter by metadata type (include):
        - `0`: Account metadata
        - `1`: Mosaic metadata
        - `2`: Namespace metadata
      schema:
        $ref: '#/components/schemas/MetadataTypeEnum'
    metalIdPath:
      name: metalId
      in: path
      description: |
        Metal identifier: Base58-encoded composite hash of the first metadata chunk.
      required: true
      schema:
        type: string
        examples:
          - FeJRJjpsiCJ6QZrHhbpD6N3SynhwhPfca6Fczs9qw2mqLN
          - Fe8sqcyyVNKDAg12mhJL3M2E8PRmAqTFwpsYu1hoZAt21T
    mosaicIdPath:
      name: mosaicId
      in: path
      description: Mosaic identifier encoded as a 16-character hexadecimal string.
      required: true
      schema:
        $ref: '#/components/schemas/MosaicId'
    ownerAddressQuery:
      name: ownerAddress
      in: query
      description: Filter by owner address in Base32 format (include).
      schema:
        $ref: '#/components/schemas/Address'
    registrationTypeQuery:
      name: registrationType
      in: query
      description: |
        Filter by namespace registration type (include).
        - 0: Root namespace.
        - 1: Subnamespace.
      schema:
        $ref: '#/components/schemas/NamespaceRegistrationTypeEnum'
    level0Query:
      name: level0
      in: query
      description: Filter by the root namespace identifier (include).
      schema:
        $ref: '#/components/schemas/NamespaceId'
    aliasTypeQuery:
      name: aliasType
      in: query
      description: |
        Filter by alias type (include).
        - 0: Namespace has no alias.
        - 1: Namespace is linked to a mosaic ID.
        - 2: Namespace is linked to an address.
      schema:
        $ref: '#/components/schemas/AliasTypeEnum'
    namespaceIdPath:
      name: namespaceId
      in: path
      description: Namespace identifier encoded as a 16-character hexadecimal string.
      required: true
      schema:
        $ref: '#/components/schemas/NamespaceId'
    receiptTypesQuery:
      name: receiptType
      in: query
      description: |
        Filter by receipt type code (include).
        To match multiple receipt types, repeat the query parameter, for example: `receiptType=8515&receiptType=20803`.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ReceiptTypeEnum'
    senderAddressQuery:
      name: senderAddress
      in: query
      description: Filter by sender address in Base32 (include).
      schema:
        $ref: '#/components/schemas/Address'
    artifactIdQuery:
      name: artifactId
      in: query
      description: Filter by artifact (mosaic or namespace) identifier (include).
      schema:
        type: string
    entryTypeQuery:
      name: entryType
      in: query
      description: Filter by entry type (include).
      schema:
        $ref: '#/components/schemas/MosaicRestrictionEntryTypeEnum'
  responses:
    InvalidArgument:
      description: |
        The required arguments were missing or unacceptable for the request.
        Returned with HTTP status 409.
        The response body contains `code` (e.g. `InvalidArgument`) and `message` with a human-readable description.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ModelError'
          examples:
            invalidAccountId:
              value:
                code: InvalidArgument
                message: accountId has an invalid format
            invalidArrayElement:
              value:
                code: InvalidArgument
                message: element in array addresses has an invalid format
    InvalidContent:
      description: |
        The provided argument was not an acceptable input.
        Returned with HTTP status 400.
        Typically indicates malformed request body (e.g. invalid JSON) or content that cannot be parsed.
        The response body contains `code` (e.g. `InvalidContent`) and `message` with a human-readable description.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ModelError'
          examples:
            invalidJson:
              value:
                code: InvalidContent
                message: 'Invalid JSON: Unexpected token ''i'', "invalid json" is not valid JSON'
    ResourceNotFound:
      description: |
        The requested resource does not exist.
        Returned with HTTP status 404.
        The response body contains `code` (e.g. `ResourceNotFound`) and `message` with the missing resource identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ModelError'
          examples:
            accountNotFound:
              value:
                code: ResourceNotFound
                message: no resource exists with id 'NCHEST3QRQS4JZGOO64TH7NFJ2A63YA7TPM5PXI'
            blockNotFound:
              value:
                code: ResourceNotFound
                message: no resource exists with id '999999999999'
  requestBodies:
    accountIds:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/accountIds'
          examples:
            byPublicKeys:
              summary: Lookup by public keys
              value:
                publicKeys:
                  - AC1A6E1D8DE5B17D2C6B1293F1CAD3829EEACF38D09311BB3C8E5A880092DE26
            byAddresses:
              summary: Lookup by addresses (Base32)
              value:
                addresses:
                  - TADP6C2GVEG654OP5LZI32P2GYJSCMEGQBYB7QY
      required: false
    transactionPayload:
      description: |
        Request body for transaction announcement.

        Contains one signed transaction payload serialized in hexadecimal form.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/transactionPayload'
      required: true
    transactionIds:
      description: Request body containing transaction IDs or hashes to retrieve in batch.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/transactionIds'
      required: true
    transactionHashes:
      description: Request body containing an array of transaction hashes to look up.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/transactionHashes'
      required: true
    cosignature:
      description: Request body for announcing one detached cosignature for an aggregate bonded transaction.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cosignature'
      required: true
    compositeHashes:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/compositeHashes'
      required: true
    mosaicIds:
      description: Request body containing mosaic identifiers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/mosaicIds'
      required: true
    namespaceIds:
      description: Request body containing namespace identifiers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/namespaceIds'
      required: true
    addresses:
      description: Request body containing account addresses in Base32 format.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/addresses'
      required: true
