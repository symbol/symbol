  /blocks/{height}/transactions/{hash}/merkle:
    get:
      tags:
        - Block routes
      summary: Get the Merkle path for a given transaction and block
      description: |
        Returns the [Merkle path](https://docs.symbol.dev/concepts/data-validation.html#merkle-proof)
        for a [transaction](https://docs.symbol.dev/concepts/transaction.html) included in a block.
        The Merkle path is the minimum number of nodes needed to calculate the Merkle root.

        Steps to calculate the Merkle root:
        1. proofHash = hash (leaf).
        2. Concatenate proofHash with the first unprocessed item from the merklePath list as follows:
        - `left`: the item hash is concatenated before the proofHash (proofHash = sha_256(item.hash + proofHash)).
        - `right`: the item hash is concatenated after the proofHash (proofHash = sha_256(proofHash + item.hash)).
        3. Repeat 2. for every item in the merklePath list.
        4. Compare if the calculated proofHash equals the one recorded in the
        [block header](https://docs.symbol.dev/concepts/block.html)
        (`block.transactionsHash`) to verify if the transaction was included in the block.
      operationId: getMerkleTransaction
      parameters:
        - $ref: '#/components/parameters/heightPath'
        - $ref: '#/components/parameters/transactionHashPath'
      responses:
        '200':
          description: Merkle path for the transaction successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerkleProofInfoDTO'
              examples:
                default:
                  value:
                    merklePath:
                      - position: left
                        hash: C8FC3FB54FDDFBCE0E8C71224990124E4EEC5AD5D30E592EDFA9524669A23810
                      - position: right
                        hash: 5E62690AB46E5565E8C0B5B5A1B2C3D4E5F6A7B8C9D0E1F2A3B4C5D6E7F8A9B0
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/InvalidArgument'
  /blocks/{height}/statements/{hash}/merkle:
    get:
      tags:
        - Block routes
      summary: Get the Merkle path for a given receipt statement hash and block
      description: |
        Returns the [Merkle path](https://docs.symbol.dev/concepts/data-validation.html#merkle-proof)
        for a [receipt statement or resolution](https://docs.symbol.dev/concepts/receipt.html) linked to a block.
        The `hash` parameter is the receipt statement hash, not the transaction hash.
        The Merkle path is the minimum number of nodes needed to calculate the Merkle root.

        Steps to calculate the Merkle root:
        1. proofHash = hash (leaf).
        2. Concatenate proofHash with the first unprocessed item from the merklePath list as follows:
        - `left`: the item hash is concatenated before the proofHash (proofHash = sha_256(item.hash + proofHash)).
        - `right`: the item hash is concatenated after the proofHash (proofHash = sha_256(proofHash + item.hash)).
        3. Repeat 2. for every item in the merklePath list.
        4. Compare if the calculated proofHash equals the one recorded in the
        [block header](https://docs.symbol.dev/concepts/block.html)
        (`block.receiptsHash`) to verify if the statement was linked with the block.
      operationId: getMerkleReceipts
      parameters:
        - $ref: '#/components/parameters/heightPath'
        - $ref: '#/components/parameters/receiptHashPath'
      responses:
        '200':
          description: Merkle path for the receipt statement successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerkleProofInfoDTO'
              examples:
                default:
                  value:
                    merklePath:
                      - position: left
                        hash: C8FC3FB54FDDFBCE0E8C71224990124E4EEC5AD5D30E592EDFA9524669A23810
                      - position: right
                        hash: 5E62690AB46E5565E8C0B5B5A1B2C3D4E5F6A7B8C9D0E1F2A3B4C5D6E7F8A9B0
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/InvalidArgument'
