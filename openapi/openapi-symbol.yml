      description: |
        Gets the node metadata information that has been set by the node operator.

        **How to set:** Add a top-level ``nodeMetadata`` object in the REST server JSON configuration
        file. Example:

        ```json
        {
          "nodeMetadata": {
            "deploymentTool": "symbol-bootstrap",
            "version": "1.0.0",
            "customLabel": "my-node"
