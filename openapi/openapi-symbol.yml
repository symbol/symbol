          examples:
            - '1024'
    PluginsPropertiesDTO:
      type: object
      description: Plugin related configuration properties.
      properties:
        accountlink:
          $ref: '#/components/schemas/AccountKeyLinkNetworkPropertiesDTO'
        aggregate:
          $ref: '#/components/schemas/AggregateNetworkPropertiesDTO'
        lockhash:
          $ref: '#/components/schemas/HashLockNetworkPropertiesDTO'
        locksecret:
          $ref: '#/components/schemas/SecretLockNetworkPropertiesDTO'
        metadata:
          $ref: '#/components/schemas/MetadataNetworkPropertiesDTO'
        mosaic:
          $ref: '#/components/schemas/MosaicNetworkPropertiesDTO'
        multisig:
          $ref: '#/components/schemas/MultisigNetworkPropertiesDTO'
        namespace:
          $ref: '#/components/schemas/NamespaceNetworkPropertiesDTO'
        restrictionaccount:
          $ref: '#/components/schemas/AccountRestrictionNetworkPropertiesDTO'
        restrictionmosaic:
          $ref: '#/components/schemas/MosaicRestrictionNetworkPropertiesDTO'
        transfer:
          $ref: '#/components/schemas/TransferNetworkPropertiesDTO'
    ForkHeightsDTO:
      type: object
      description: |
        Block heights at which protocol changes (hard forks) took effect. Used during
        synchronization to apply correct validation rules for each block range.
      properties:
        totalVotingBalanceCalculationFix:
          type: string
          description: |
            The block height from which Symbol correctly calculates the total voting
            balance for finalization by including only the stake of accounts with
            active voting keys registered for the current finalization epoch.
            More: https://hackmd.io/@syndicate/postmortem-140921.
          examples:
            - 528'000
        treasuryReissuance:
          type: string
          description: |
            The block height of the Cyprus hard fork that implemented treasury reissuance according to the governance decision.
            More: https://hackmd.io/@syndicate/governance.
          examples:
            - 689'761
        strictAggregateTransactionHash:
          type: string
          description: |
            The block height from which nodes enforce strict validation of aggregate transaction hashes.
            Hashes must be computed from unpadded embedded transactions using the correct
            Merkle tree algorithm; legacy/buggy hash formats are rejected.
            More: https://hackmd.io/@syndicate/postmortem-251022.
          examples:
            - 1'690'500
        skipSecretLockUniquenessChecks:
          type: string
          description: |
            Comma-separated list of block heights at which secret-lock uniqueness checks must be skipped
            during synchronization to reproduce historical (incorrect) chain behavior.
            More: https://thesymbolsyndicate.notion.site/april-2024-secret-locks-e3afb825d2ac4a029f88f74dfe6f02d8?pvs=74.
          examples:
            - 3'191'538
        skipSecretLockExpirations:
          type: string
          description: |
            Comma-separated list of block heights at which secret-lock expiration processing must
            be skipped during synchronization to reproduce historical (incorrect) chain behavior.
            More: https://thesymbolsyndicate.notion.site/april-2024-secret-locks-e3afb825d2ac4a029f88f74dfe6f02d8?pvs=74.
          examples:
            - 3'197'860, 3'197'866
        forceSecretLockExpirations:
          type: string
          description: |
            Comma-separated list of block heights at which secret-lock expiration processing must
            be forcibly executed during synchronization to reproduce historical (incorrect) chain behavior.
            More: https://thesymbolsyndicate.notion.site/april-2024-secret-locks-e3afb825d2ac4a029f88f74dfe6f02d8?pvs=74.
          examples:
            - 3'197'458, 3'197'781
        uniqueAggregateTransactionHash:
          type: string
          description: |
            The block height from which Aggregate V3 transactions become mandatory and payloadSize is included
            in the aggregate transaction hash calculation, ensuring unique transaction hashes.
            More: https://thesymbolsyndicate.notion.site/post-mortem-october-25.
          examples:
            - 4'759'100
    NetworkConfigurationDTO:
      type: object
      description: |
        Full network configuration: network identity, chain parameters, plugin settings,
        and fork heights. Combines data from catapult-server config files (network, chain, plugins).
      required:
        - network
        - chain
        - plugins
        - forkHeights
      properties:
        network:
          $ref: '#/components/schemas/NetworkPropertiesDTO'
        chain:
          $ref: '#/components/schemas/ChainPropertiesDTO'
        plugins:
          $ref: '#/components/schemas/PluginsPropertiesDTO'
        forkHeights:
          $ref: '#/components/schemas/ForkHeightsDTO'
        treasuryReissuanceTransactionSignatures:
          type: array
          items:
            type: string
          description: |
            Multisignature approvals authorizing the network treasury reissuance event for the specified fork height.
            More: https://hackmd.io/@syndicate/governance.
          examples:
            - - 0BBEADD37539444D75C09A245102D2B883267925398504623835DCD625290DEE4FA2371341050C49C001DEDD1C9FE241EA4A
              - 89447704270E8B2F8EED19526587DB58870D90A02ACEF8AE2A54311DEB95C227201CD39662A0229D5746FFB84074EA6C7DD9
        corruptAggregateTransactionHashes:
          type: array
          items:
            type: string
          description: |
            List of aggregate transaction hashes that were known to be invalid due to a bug and must be remapped to corrected hashes.
            More: https://hackmd.io/@syndicate/postmortem-251022.
          examples:
            - - 26FF5E7174DEEF3147DB25C37C7AE9905157ACBA2D233D40D1F77A65B60D59BC = 3A2F78C2E7B10FF84EB33BF1DD0FD61951F8E3E
              - 30FA71E6D1E34DF1E430A07E1B0817BED9A4ED6B0245B7471B0557380A700E1B = AE377EAB7F1970DEC21FF305C39EBDD3ECE413B
    NetworkInflationDTO:
      type: object
      description: |
        One entry in the inflation schedule: block height from which a reward amount applies, and the reward amount.
      required:
        - startHeight
        - rewardAmount
      properties:
        startHeight:
          $ref: '#/components/schemas/Height'
          description: Block height at which this reward amount becomes active.
          examples:
            - 10
        rewardAmount:
          $ref: '#/components/schemas/Amount'
          description: Inflation reward per block in smallest (atomic) units of the network currency.
          examples:
            - 20500000
    NodeStatusEnum:
      type: string
      description: Operational status of a service (e.g. API node or database).
      enum:
        - up
        - down
    NodeHealthDTO:
      type: object
      description: Status of API node and database services (up/down).
      required:
        - apiNode
        - db
      properties:
        apiNode:
          $ref: '#/components/schemas/NodeStatusEnum'
          description: API node service status.
        db:
          $ref: '#/components/schemas/NodeStatusEnum'
          description: MongoDB service status.
    NodeHealthInfoDTO:
      type: object
      description: |
        Health status of the node: reachability of the API node and database services
        from the REST server.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/NodeHealthDTO'
    RolesTypeEnum:
      type: integer
      description: |
        Bitmask of roles the node provides.
        Individual flags:
        - `0`: No roles.
        - `1`: Peer node.
        - `2`: API node.
        - `4`: Voting node.
        - `64`: IPv4 compatible node.
        - `128`: IPv6 compatible node.

        Flags are combined with bitwise OR. Examples:
        - `1` = Peer only.
        - `2` = API only.
        - `3` = Peer and API.
        - `7` = Peer, API and Voting.
        - `65` = IPv4 and Peer.
      examples:
        - 7
    NodeInfoDTO:
      type: object
      description: |
        Identity and configuration of the connected node: version, public key, network
        generation hash, roles (peer/api/voting), host, port, and friendly name.
      required:
        - version
        - publicKey
        - networkGenerationHashSeed
        - roles
        - port
        - networkIdentifier
        - friendlyName
        - host
      properties:
        version:
          type: integer
          description: Version of the application.
          examples:
            - 16777993
        publicKey:
          $ref: '#/components/schemas/PublicKey'
        networkGenerationHashSeed:
          $ref: '#/components/schemas/Hash256'
        roles:
          $ref: '#/components/schemas/RolesTypeEnum'
        port:
          type: integer
          description: Port used for the communication.
          examples:
            - 7900
        networkIdentifier:
          $ref: '#/components/schemas/NetworkTypeEnum'
        friendlyName:
          type: string
          description: Node friendly name.
          examples:
            - api-node-0
        host:
          type: string
          description: Node IP address.
          examples:
            - 127.0.0.1
        nodePublicKey:
          $ref: '#/components/schemas/PublicKey'
    StorageInfoDTO:
      type: object
      description: |
        Storage statistics: number of blocks, transactions, and accounts stored by the node.
      required:
        - numBlocks
        - numTransactions
        - numAccounts
      properties:
        numBlocks:
          type: integer
          description: |
            Number of blocks stored. Under normal operation, this equals the chain height
            (see chain info). When the node is synchronizing with the network, both values
            are lower than the network chain height.
          examples:
            - 245053
        numTransactions:
          type: integer
          description: |
            Number of confirmed transactions stored, i.e. transactions included in blocks.
            Excludes unconfirmed transactions in the mempool. For aggregate transactions
            (e.g. multisig), each inner transaction counts as a separate document.
          examples:
            - 58590
        numAccounts:
          type: integer
          description: |
            Number of accounts with on-chain state, i.e. addresses that have participated
            in at least one confirmed transaction (e.g. as sender, recipient, or cosigner).
          examples:
            - 177
    CommunicationTimestampsDTO:
      type: object
      description: |
        Timestamps from the node's perspective for round-trip time calculation. Used when computing node time offset and
        transaction deadlines. The difference between them reflects node processing time and can vary with node load.
      properties:
        sendTimestamp:
          $ref: '#/components/schemas/Timestamp'
          description: Node's network time when it sent the response (milliseconds since nemesis block).
        receiveTimestamp:
          $ref: '#/components/schemas/Timestamp'
          description: |
            Node's network time when it received the client's request (milliseconds since nemesis block).
            Typically used when computing transaction deadlines.
      examples:
        - sendTimestamp: '108303181802'
          receiveTimestamp: '108303181850'
    NodeTimeDTO:
      type: object
      description: |
        Node time at request/response. Used to calculate transaction deadlines
        (deadline = node time + desired lifetime).
      required:
        - communicationTimestamps
      properties:
        communicationTimestamps:
          $ref: '#/components/schemas/CommunicationTimestampsDTO'
    DeploymentDTO:
      type: object
      description: |
        Deployment tool and version used to create/maintain the node; date of last upgrade.
      required:
        - deploymentTool
        - deploymentToolVersion
        - lastUpdatedDate
      properties:
        deploymentTool:
          type: string
          description: The tool used to create, maintain and deploy the node.
          examples:
            - symbol-shoestring
        deploymentToolVersion:
          type: string
          examples:
            - 1.0.6
          description: The version of the tool used to create, maintain and deploy the node.
        lastUpdatedDate:
          type: string
          examples:
            - '2025-06-02'
          description: When was the node last upgraded.
    ServerDTO:
      type: object
      description: |
        REST component version and deployment metadata.
      required:
        - restVersion
        - deployment
      properties:
        restVersion:
          type: string
          examples:
            - 1.0.14
          description: catapult-rest component version.
        deployment:
          $ref: '#/components/schemas/DeploymentDTO'
    ServerInfoDTO:
      type: object
      description: |
        Version and deployment information for the catapult-rest component running
        on this node.
      required:
        - serverInfo
      properties:
        serverInfo:
          $ref: '#/components/schemas/ServerDTO'
    UnlockedAccountDTO:
      type: object
      description: |
        Public keys of accounts with [harvesting](https://docs.symbol.dev/concepts/harvesting.html) unlocked.
        **Only accounts harvesting on the node you are querying** are returned. The scope is limited to this node, not the entire network.
      required:
        - unlockedAccount
      properties:
        unlockedAccount:
          type: array
          description: Public keys of accounts harvesting on this node.
          items:
            $ref: '#/components/schemas/PublicKey'
    NodeMetadataDTO:
      type: object
      description: |
        Key-value metadata set by the node operator (e.g. deployment tool, version,
        custom labels). Keys and values are strings.
      additionalProperties:
        type: string
        description: The value of a user-defined metadata key.
      examples:
        - deploymentTool: symbol-shoestring
          version: 1.0.2
          nodeName: api-node-0
    transactionPayload:
      type: object
      description: |
        Wrapper object used to announce one signed transaction payload.
      required:
        - payload
      properties:
        payload:
          type: string
          description: |
            Signed transaction payload encoded as a hexadecimal string.
            To obtain this value, use your SDK's transaction serialization. See the announce endpoint description for more SDK links.
          examples:
            - CE000000000000003CA4BBA1CFF24DEA27FD659AA48334DB71FF2E377F641E52773959C58B8A3F77E1255762A39097716FCA94CD55FFE
    AnnounceTransactionInfoDTO:
      type: object
      description: |
        Informational response returned after a transaction announce request is accepted.

        This object does not contain the announced transaction payload or its final execution result. It
        only carries the node message associated with the announce request.

        Acceptance by a node does not mean the transaction is already part of the blockchain. The
        transaction still needs to be validated and confirmed by the network.

        To verify the final result, query `GET /transactionStatus/{hash}` on the same node that received
        the announce request. If that node drops the transaction before propagation, other nodes may not
        know the transaction at all and can return `404` for the same hash.

        In some cases the transaction can be dropped without any failure status being returned. Common causes include using
        a fee below the minimum accepted by that node or using a generation hash seed that does not match the target network.
        Transaction status availability is not guaranteed indefinitely: failed statuses are stored in a capped collection
        and may be evicted as new entries arrive.
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable message returned by the node for the announce request.
    TransactionTypeEnum:
      type: integer
      enum:
        - 16716
        - 16963
        - 16707
        - 16972
        - 16705
        - 16961
        - 16717
        - 16973
        - 17229
        - 16718
        - 16974
        - 17230
        - 16708
        - 16964
        - 17220
        - 16725
        - 16712
        - 16722
        - 16978
        - 16720
        - 16976
        - 17232
        - 16721
        - 16977
        - 16724
      description: |
        Numeric transaction type identifiers used on transaction payloads and search filters:
        - `0x414C` (`16716`): `AccountKeyLinkTransaction`
        - `0x4243` (`16963`): `VrfKeyLinkTransaction`
        - `0x4143` (`16707`): `VotingKeyLinkTransaction`
        - `0x424C` (`16972`): `NodeKeyLinkTransaction`
        - `0x4141` (`16705`): `AggregateCompleteTransaction`
        - `0x4241` (`16961`): `AggregateBondedTransaction`
        - `0x414D` (`16717`): `MosaicDefinitionTransaction`
        - `0x424D` (`16973`): `MosaicSupplyChangeTransaction`
        - `0x434D` (`17229`): `MosaicSupplyRevocationTransaction`
        - `0x414E` (`16718`): `NamespaceRegistrationTransaction`
        - `0x424E` (`16974`): `AddressAliasTransaction`
        - `0x434E` (`17230`): `MosaicAliasTransaction`
        - `0x4144` (`16708`): `AccountMetadataTransaction`
        - `0x4244` (`16964`): `MosaicMetadataTransaction`
        - `0x4344` (`17220`): `NamespaceMetadataTransaction`
        - `0x4155` (`16725`): `MultisigAccountModificationTransaction`
        - `0x4148` (`16712`): `HashLockTransaction`
        - `0x4152` (`16722`): `SecretLockTransaction`
        - `0x4252` (`16978`): `SecretProofTransaction`
        - `0x4150` (`16720`): `AccountAddressRestrictionTransaction`
        - `0x4250` (`16976`): `AccountMosaicRestrictionTransaction`
        - `0x4350` (`17232`): `AccountOperationRestrictionTransaction`
        - `0x4151` (`16721`): `MosaicGlobalRestrictionTransaction`
        - `0x4251` (`16977`): `MosaicAddressRestrictionTransaction`
        - `0x4154` (`16724`): `TransferTransaction`
    TransactionMetaHeight:
      type: string
      description: |
        Height of the block containing the referenced transaction or parent aggregate transaction.
        Returned as a decimal string. The value is `"0"` when the transaction is not included in a
        block yet, for example for unconfirmed transactions and partial aggregate transactions.
      pattern: ^(0|[1-9][0-9]*)$
      examples:
        - '0'
        - '1'
        - '17592'
    TransactionMetaDTO:
      type: object
      description: |
        Metadata for a top-level (non-embedded) transaction entry returned by the transaction endpoints.
        For confirmed transactions, these fields describe the transaction's position in the block and the
        proof-related hashes associated with that block entry.

        For unconfirmed top-level transactions, REST returns:
        - `height` = `"0"`
        - `index` = `0`
        - `hash` = transaction hash
        - `merkleComponentHash` = transaction hash

        Block-derived fields such as `timestamp` and `feeMultiplier` are not present until the transaction
        is included in a block.
      required:
        - height
        - hash
        - merkleComponentHash
        - index
      properties:
        height:
          $ref: '#/components/schemas/TransactionMetaHeight'
          description: Height of the block that contains the transaction. For unconfirmed top-level transactions, this value is `"0"`.
        hash:
          $ref: '#/components/schemas/Hash256'
          description: Hash of the top-level transaction.
        merkleComponentHash:
          $ref: '#/components/schemas/Hash256'
          description: |
            Merkle component hash of the top-level transaction used in block transaction proofs.
            For unconfirmed top-level transactions, this value matches `hash`.
        index:
          type: integer
          description: |
            Transaction index within the block. For unconfirmed top-level transactions, this value is `0`.
        timestamp:
          $ref: '#/components/schemas/Timestamp'
          description: |
            Timestamp of the block that contains the transaction, in milliseconds since the creation of the
            nemesis (first) block. This field is absent for unconfirmed top-level transactions.
        feeMultiplier:
          $ref: '#/components/schemas/BlockFeeMultiplier'
          description: |
            Fee multiplier of the block that contains the transaction.
            This field is absent for unconfirmed top-level transactions.
    EmbeddedTransactionMetaDTO:
      type: object
      description: |
        Metadata for an embedded transaction entry returned by the transaction endpoints.
        These fields identify the parent aggregate transaction and the embedded transaction's position inside it.
      required:
        - height
        - aggregateHash
        - aggregateId
        - index
      properties:
        height:
          $ref: '#/components/schemas/TransactionMetaHeight'
          description: |
            Height of the block that contains the parent aggregate transaction.
            For embedded transactions returned from partial aggregate transactions, this value is `"0"`.
        aggregateHash:
          $ref: '#/components/schemas/Hash256'
          description: Hash of the parent aggregate transaction.
        aggregateId:
          $ref: '#/components/schemas/ObjectId'
          description: Database record ID of the parent aggregate transaction.
        index:
          type: integer
          description: Embedded transaction index within the parent aggregate transaction.
        timestamp:
          $ref: '#/components/schemas/Timestamp'
          description: |
            Timestamp of the block that contains the parent aggregate transaction,
            in milliseconds since the creation of the nemesis (first) block.
        feeMultiplier:
          $ref: '#/components/schemas/BlockFeeMultiplier'
          description: Fee multiplier of the block that contains the parent aggregate transaction.
    TransactionBodyDTO:
      type: object
      description: Common body fields shared by all top-level transactions.
      required:
        - maxFee
        - deadline
      properties:
        maxFee:
          $ref: '#/components/schemas/Amount'
          description: Maximum fee the signer is willing to pay for this transaction, in smallest (atomic) units.
        deadline:
          $ref: '#/components/schemas/Timestamp'
          description: |
            Latest network time at which the transaction can still be included in a block, expressed in milliseconds
            since the creation of the nemesis (first) block.
    TransactionDTO:
      type: object
      allOf:
        - $ref: '#/components/schemas/SizePrefixedEntityDTO'
        - $ref: '#/components/schemas/VerifiableEntityDTO'
        - $ref: '#/components/schemas/EntityDTO'
        - $ref: '#/components/schemas/TransactionBodyDTO'
    LinkActionEnum:
      type: integer
      enum:
        - 0
        - 1
      description: |
        Link action:
        - `0`: Unlink key.
        - `1`: Link key.
    AccountKeyLinkTransactionBodyDTO:
      type: object
      description: Account key link transaction body that links or unlinks a remote account public key.
      required:
        - linkedPublicKey
        - linkAction
      properties:
        linkedPublicKey:
          $ref: '#/components/schemas/PublicKey'
        linkAction:
          $ref: '#/components/schemas/LinkActionEnum'
    AccountKeyLinkTransactionDTO:
      type: object
      description: |
        Transaction to delegate the account importance score to a proxy account.
        Required for all accounts willing to activate delegated harvesting.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/AccountKeyLinkTransactionBodyDTO'
    EmbeddedTransactionDTO:
      type: object
      description: Transaction payload embedded inside an aggregate transaction.
      allOf:
        - $ref: '#/components/schemas/EntityDTO'
    EmbeddedAccountKeyLinkTransactionDTO:
      type: object
      description: Embedded transaction variant of `AccountKeyLinkTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/AccountKeyLinkTransactionBodyDTO'
    NodeKeyLinkTransactionBodyDTO:
      type: object
      description: Node key link transaction body that links or unlinks a remote node public key.
      required:
        - linkedPublicKey
        - linkAction
      properties:
        linkedPublicKey:
          $ref: '#/components/schemas/PublicKey'
        linkAction:
          $ref: '#/components/schemas/LinkActionEnum'
    NodeKeyLinkTransactionDTO:
      type: object
      description: |
        Transaction to link a public key to an account.
        TLS uses the linked public key to create sessions.
        Required for node operators.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/NodeKeyLinkTransactionBodyDTO'
    EmbeddedNodeKeyLinkTransactionDTO:
      type: object
      description: Embedded transaction variant of `NodeKeyLinkTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/NodeKeyLinkTransactionBodyDTO'
    VrfKeyLinkTransactionBodyDTO:
      type: object
      description: VRF key link transaction body that links or unlinks a VRF public key.
      required:
        - linkedPublicKey
        - linkAction
      properties:
        linkedPublicKey:
          $ref: '#/components/schemas/PublicKey'
        linkAction:
          $ref: '#/components/schemas/LinkActionEnum'
    VrfKeyLinkTransactionDTO:
      type: object
      description: |
        Transaction to link an account with a VRF public key.
        The key is used to randomize block production and leader/participant selection.
        Required for all harvesting eligible accounts.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/VrfKeyLinkTransactionBodyDTO'
    EmbeddedVrfKeyLinkTransactionDTO:
      type: object
      description: Embedded transaction variant of `VrfKeyLinkTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/VrfKeyLinkTransactionBodyDTO'
    VotingKey:
      type: string
      pattern: ^[0-9a-fA-F]+$
      description: 32-byte voting public key used for finalization voting.
      minLength: 64
      maxLength: 64
      examples:
        - 4EDDA97C991A0BF44E0570B0BA0E0F7F1CE821A799726888734F28DDCCE8C591
    VotingKeyLinkTransactionBodyDTO:
      type: object
      description: Voting key link transaction body that links or unlinks a voting key for a finalization epoch range.
      required:
        - linkedPublicKey
        - startEpoch
        - endEpoch
        - linkAction
      properties:
        linkedPublicKey:
          $ref: '#/components/schemas/VotingKey'
        startEpoch:
          $ref: '#/components/schemas/FinalizationEpoch'
        endEpoch:
          $ref: '#/components/schemas/FinalizationEpoch'
        linkAction:
          $ref: '#/components/schemas/LinkActionEnum'
    VotingKeyLinkTransactionDTO:
      type: object
      description: |
        Transaction to associate a BLS public key with an account.
        Required for node operators willing to vote finalized blocks.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/VotingKeyLinkTransactionBodyDTO'
    EmbeddedVotingKeyLinkTransactionDTO:
      type: object
      description: Embedded transaction variant of `VotingKeyLinkTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/VotingKeyLinkTransactionBodyDTO'
    CosignatureVersion:
      type: string
      description: |
        Version of a detached cosignature attached to an aggregate bonded transaction.
        Returned and submitted as a string because the value is encoded as an unsigned integer.
      examples:
        - '0'
    CosignatureDTO:
      type: object
      allOf:
        - $ref: '#/components/schemas/VerifiableEntityDTO'
        - type: object
          required:
            - signerPublicKey
            - version
          properties:
            version:
              $ref: '#/components/schemas/CosignatureVersion'
            signerPublicKey:
              $ref: '#/components/schemas/PublicKey'
    AggregateTransactionBodyDTO:
      type: object
      description: |
        Aggregate transaction body with the hash of embedded transactions and the cosignatures attached to
        the aggregate transaction.
      required:
        - transactionsHash
        - cosignatures
      properties:
        transactionsHash:
          $ref: '#/components/schemas/Hash256'
        cosignatures:
          type: array
          description: Array of transaction cosignatures.
          items:
            $ref: '#/components/schemas/CosignatureDTO'
    AggregateTransactionDTO:
      type: object
      description: Transaction to combine multiple transactions together.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/AggregateTransactionBodyDTO'
    UnresolvedMosaicId:
      type: string
      pattern: ^[0-9a-fA-F]+$
      minLength: 16
      maxLength: 16
      description: |
        Unresolved mosaic identifier.
        If the most significant bit of byte 0 is set, the value contains a namespace ID alias
        instead of a concrete mosaic ID.
      examples:
        - 85BBEA6CC462B244
        - 941299B2B7E1291C
    BlockDuration:
      type: string
      description: Duration expressed in number of blocks.
      examples:
        - '200'
    HashLockTransactionBodyDTO:
      type: object
      description: Hash lock transaction body that locks mosaics as a prerequisite for announcing an aggregate bonded transaction.
      required:
        - mosaicId
        - amount
        - duration
        - hash
      properties:
        mosaicId:
          $ref: '#/components/schemas/UnresolvedMosaicId'
        amount:
          $ref: '#/components/schemas/Amount'
        duration:
          $ref: '#/components/schemas/BlockDuration'
        hash:
          $ref: '#/components/schemas/Hash256'
    EmbeddedHashLockTransactionDTO:
      type: object
      description: Embedded transaction variant of `HashLockTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/HashLockTransactionBodyDTO'
    UnresolvedAddress:
      type: string
      pattern: ^[0-9a-fA-F]+$
      description: |
        Unresolved address encoded as a 48-character hexadecimal string (24 bytes).
        If bit 0 of byte 0 is not set, the value represents a regular address.
        Otherwise, it represents a namespace ID alias encoded as an unresolved address.
      minLength: 48
      maxLength: 48
      examples:
        - 98E0D138EAF2AC342C015FF0B631EC3622E8AFFA04BFCC56
        - 695DAF6B40CF4A79E9000000000000000000000000000000
    LockHashAlgorithmEnum:
      type: integer
      enum:
        - 0
        - 1
        - 2
      description: |
        Hash algorithm used to derive the secret from the revealed proof in secret lock and secret proof transactions:
        - `0` (`SHA3_256`): proof hashed once with SHA3-256.
        - `1` (`HASH_160`): proof hashed with SHA-256 and then with RIPEMD-160, similar to Bitcoin `OP_HASH160`.
        - `2` (`HASH_256`): proof hashed twice with SHA-256, similar to Bitcoin `OP_HASH256`.
    SecretLockTransactionBodyDTO:
      type: object
      description: Secret lock transaction body that locks a mosaic for a recipient until the secret proof is revealed.
      required:
        - recipientAddress
        - secret
        - mosaicId
        - amount
        - duration
        - hashAlgorithm
      properties:
        recipientAddress:
          $ref: '#/components/schemas/UnresolvedAddress'
        secret:
          $ref: '#/components/schemas/Hash256'
        mosaicId:
          $ref: '#/components/schemas/UnresolvedMosaicId'
        amount:
          $ref: '#/components/schemas/Amount'
        duration:
          $ref: '#/components/schemas/BlockDuration'
        hashAlgorithm:
          $ref: '#/components/schemas/LockHashAlgorithmEnum'
    EmbeddedSecretLockTransactionDTO:
      type: object
      description: Embedded transaction variant of `SecretLockTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/SecretLockTransactionBodyDTO'
    SecretProofTransactionBodyDTO:
      type: object
      description: Secret proof transaction body that reveals the proof needed to complete a secret lock.
      required:
        - recipientAddress
        - secret
        - hashAlgorithm
        - proof
      properties:
        recipientAddress:
          $ref: '#/components/schemas/UnresolvedAddress'
        secret:
          $ref: '#/components/schemas/Hash256'
        hashAlgorithm:
          $ref: '#/components/schemas/LockHashAlgorithmEnum'
        proof:
          type: string
          description: Proof data whose hash, using `hashAlgorithm`, must match `secret`.
    EmbeddedSecretProofTransactionDTO:
      type: object
      description: Embedded transaction variant of `SecretProofTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/SecretProofTransactionBodyDTO'
    MetadataKey:
      type: string
      pattern: ^[0-9a-fA-F]+$
      description: 64-bit key assigned by the metadata creator to identify the metadata entry within the source and target context.
      minLength: 16
      maxLength: 16
      examples:
        - 0DC67FBE1CAD29E3
    MetadataValueSizeDelta:
      type: integer
      description: |
        Change in metadata value size, in bytes.
        Positive values increase the stored value size, negative values decrease it.
      minimum: -32768
      maximum: 32767
      examples:
        - 6
        - -2
    MetadataValueSize:
      type: integer
      description: |
        Size of a metadata value or metadata value update payload, in bytes.
        In metadata transactions, when no previous value exists, or when the value grows, this is the new
        value size after applying the update. When the value shrinks, this is the previous stored value size
        before truncation.
      minimum: 0
      maximum: 65535
      examples:
        - 6
    MetadataValue:
      type: string
      pattern: ^[0-9a-fA-F]+$
      description: |
        Metadata value encoded as hex.
        In metadata transactions, this field carries the metadata value update payload.
        When no previous value exists, it contains the new value.
        When updating existing metadata, it contains the byte-wise XOR of the previous value and the new value.
      examples:
        - '333433383334'
        - '3644363137323642373537333230373337393644363236463643323037303631373237343739'
        - '3438363537393245'
    AccountMetadataTransactionBodyDTO:
      type: object
      description: |
        Account metadata transaction body with the target account, metadata key, and metadata value
        update.
      required:
        - targetAddress
        - scopedMetadataKey
        - valueSizeDelta
        - valueSize
        - value
      properties:
        targetAddress:
          $ref: '#/components/schemas/UnresolvedAddress'
        scopedMetadataKey:
          $ref: '#/components/schemas/MetadataKey'
        valueSizeDelta:
          $ref: '#/components/schemas/MetadataValueSizeDelta'
        valueSize:
          $ref: '#/components/schemas/MetadataValueSize'
        value:
          $ref: '#/components/schemas/MetadataValue'
    EmbeddedAccountMetadataTransactionDTO:
      type: object
      description: Embedded transaction variant of `AccountMetadataTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/AccountMetadataTransactionBodyDTO'
    MosaicMetadataTransactionBodyDTO:
      type: object
      description: |
        Mosaic metadata transaction body with the target mosaic, metadata key, and metadata value
        update.
      required:
        - targetAddress
        - scopedMetadataKey
        - targetMosaicId
        - valueSizeDelta
        - valueSize
        - value
      properties:
        targetAddress:
          $ref: '#/components/schemas/UnresolvedAddress'
        scopedMetadataKey:
          $ref: '#/components/schemas/MetadataKey'
        targetMosaicId:
          $ref: '#/components/schemas/UnresolvedMosaicId'
        valueSizeDelta:
          $ref: '#/components/schemas/MetadataValueSizeDelta'
        valueSize:
          $ref: '#/components/schemas/MetadataValueSize'
        value:
          $ref: '#/components/schemas/MetadataValue'
    EmbeddedMosaicMetadataTransactionDTO:
      type: object
      description: Embedded transaction variant of `MosaicMetadataTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/MosaicMetadataTransactionBodyDTO'
    NamespaceId:
      type: string
      pattern: ^[0-9a-fA-F]+$
      description: |
        Unique [namespace](https://docs.symbol.dev/concepts/namespaces.html) identifier.
        A 64-bit unsigned integer derived from the namespace name and its parent namespace ID,
        encoded as a 16-character hexadecimal string.
      minLength: 16
      maxLength: 16
      examples:
        - 85BBEA6CC462B244
    NamespaceMetadataTransactionBodyDTO:
      type: object
      description: |
        Namespace metadata transaction body with the target namespace, metadata key, and metadata value
        update.
      required:
        - targetAddress
        - scopedMetadataKey
        - targetNamespaceId
        - valueSizeDelta
        - valueSize
        - value
      properties:
        targetAddress:
          $ref: '#/components/schemas/UnresolvedAddress'
        scopedMetadataKey:
          $ref: '#/components/schemas/MetadataKey'
        targetNamespaceId:
          $ref: '#/components/schemas/NamespaceId'
        valueSizeDelta:
          $ref: '#/components/schemas/MetadataValueSizeDelta'
        valueSize:
          $ref: '#/components/schemas/MetadataValueSize'
        value:
          $ref: '#/components/schemas/MetadataValue'
    EmbeddedNamespaceMetadataTransactionDTO:
      type: object
      description: Embedded transaction variant of `NamespaceMetadataTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/NamespaceMetadataTransactionBodyDTO'
    MosaicFlagsEnum:
      type: integer
      description: |
        Mosaic flags bitmask. Individual values can be combined.
        - 0x00 (0 decimal): No flags present.
        - 0x01 (1 decimal, `supplyMutable`): Mosaic supply can be increased or decreased later.
        - 0x02 (2 decimal, `transferable`): Mosaic can be transferred between arbitrary accounts.
          When not set, it can only be transferred to and from the mosaic owner.
        - 0x04 (4 decimal, `restrictable`): Mosaic supports custom restrictions configured by the mosaic owner.
        - 0x08 (8 decimal, `revokable`): Mosaic creator can revoke balances from another account.

        Example: `3` means `0x01 + 0x02`, so the mosaic is both `supplyMutable` and `transferable`.
      examples:
        - 0
        - 2
        - 3
        - 12
    Divisibility:
      type: integer
      description: |
        Determines up to what decimal place a mosaic can be divided.
        Divisibility of 3 means that a mosaic can be divided into smallest parts of 0.001 mosaics.
        The divisibility must be in the range of 0 and 6.
      minimum: 0
      maximum: 6
      examples:
        - 0
        - 3
        - 6
    MosaicDefinitionTransactionBodyDTO:
      type: object
      description: Mosaic definition transaction body with the mosaic ID inputs and immutable configuration values.
      required:
        - id
        - duration
        - nonce
        - flags
        - divisibility
      properties:
        id:
          $ref: '#/components/schemas/MosaicId'
        duration:
          $ref: '#/components/schemas/BlockDuration'
        nonce:
          $ref: '#/components/schemas/UInt32'
          description: Random nonce used to generate the mosaic ID.
          examples:
            - 0
        flags:
          $ref: '#/components/schemas/MosaicFlagsEnum'
        divisibility:
          $ref: '#/components/schemas/Divisibility'
    EmbeddedMosaicDefinitionTransactionDTO:
      type: object
      description: Embedded transaction variant of `MosaicDefinitionTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/MosaicDefinitionTransactionBodyDTO'
    MosaicSupplyChangeActionEnum:
      type: integer
      enum:
        - 0
        - 1
      description: |
        Mosaic supply change action:
        - `0`: Decrease the mosaic supply.
        - `1`: Increase the mosaic supply.
      examples:
        - 0
    MosaicSupplyChangeTransactionBodyDTO:
      type: object
      description: Mosaic supply change transaction body with the target mosaic, supply delta, and direction.
      required:
        - mosaicId
        - delta
        - action
      properties:
        mosaicId:
          $ref: '#/components/schemas/UnresolvedMosaicId'
        delta:
          $ref: '#/components/schemas/Amount'
        action:
          $ref: '#/components/schemas/MosaicSupplyChangeActionEnum'
    EmbeddedMosaicSupplyChangeTransactionDTO:
      type: object
      description: Embedded transaction variant of `MosaicSupplyChangeTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/MosaicSupplyChangeTransactionBodyDTO'
    MosaicSupplyRevocationTransactionBodyDTO:
      type: object
      description: Mosaic supply revocation transaction body with the source account, mosaic, and revoked amount.
      required:
        - sourceAddress
        - mosaicId
        - amount
      properties:
        sourceAddress:
          $ref: '#/components/schemas/UnresolvedAddress'
        mosaicId:
          $ref: '#/components/schemas/UnresolvedMosaicId'
        amount:
          $ref: '#/components/schemas/Amount'
    EmbeddedMosaicSupplyRevocationTransactionDTO:
      type: object
      description: Embedded transaction variant of `MosaicSupplyRevocationTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/MosaicSupplyRevocationTransactionBodyDTO'
    NamespaceRegistrationTypeEnum:
      type: integer
      enum:
        - 0
        - 1
      description: |
        Type of namespace registration.
        A namespace can either be registered as a top-level root namespace or as a
        subnamespace under an existing parent namespace.

        - `0`: Root namespace. The namespace has no parent and defines the first level of
          the namespace path.
        - `1`: Subnamespace. The namespace is registered under an existing parent
          namespace and extends the namespace path by one level.
      examples:
        - 0
    NamespaceRegistrationTransactionBodyDTO:
      type: object
      description: Namespace registration transaction body for creating a root namespace or a child namespace.
      required:
        - id
        - registrationType
        - name
      properties:
        duration:
          $ref: '#/components/schemas/BlockDuration'
        parentId:
          $ref: '#/components/schemas/NamespaceId'
        id:
          $ref: '#/components/schemas/NamespaceId'
        registrationType:
          $ref: '#/components/schemas/NamespaceRegistrationTypeEnum'
        name:
          type: string
          description: Namespace name.
    EmbeddedNamespaceRegistrationTransactionDTO:
      type: object
      description: Embedded transaction variant of `NamespaceRegistrationTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/NamespaceRegistrationTransactionBodyDTO'
    AliasActionEnum:
      type: integer
      enum:
        - 0
        - 1
      description: |
        Alias link action:
        - `0`: Unlink the namespace from the current address or mosaic.
        - `1`: Link the namespace to the specified address or mosaic.
      examples:
        - 0
    AddressAliasTransactionBodyDTO:
      type: object
      description: Address alias transaction body that links or unlinks a namespace to an address.
      required:
        - namespaceId
        - address
        - aliasAction
      properties:
        namespaceId:
          $ref: '#/components/schemas/NamespaceId'
        address:
          $ref: '#/components/schemas/AddressHex'
        aliasAction:
          $ref: '#/components/schemas/AliasActionEnum'
    EmbeddedAddressAliasTransactionDTO:
      type: object
      description: Embedded transaction variant of `AddressAliasTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/AddressAliasTransactionBodyDTO'
    MosaicAliasTransactionBodyDTO:
      type: object
      description: Mosaic alias transaction body that links or unlinks a namespace to a mosaic.
      required:
        - namespaceId
        - mosaicId
        - aliasAction
      properties:
        namespaceId:
          $ref: '#/components/schemas/NamespaceId'
        mosaicId:
          $ref: '#/components/schemas/MosaicId'
        aliasAction:
          $ref: '#/components/schemas/AliasActionEnum'
    EmbeddedMosaicAliasTransactionDTO:
      type: object
      description: Embedded transaction variant of `MosaicAliasTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/MosaicAliasTransactionBodyDTO'
    MultisigAccountModificationTransactionBodyDTO:
      type: object
      description: Multisig account modification transaction body with threshold deltas and cosignatory changes.
      required:
        - minRemovalDelta
        - minApprovalDelta
        - addressAdditions
        - addressDeletions
      properties:
        minRemovalDelta:
          type: integer
          description: |
            Relative change applied to the minimum number of cosignatory approvals required to remove a
            cosignatory. When converting a regular account into a multisig account, the initial value is
            derived from this delta because the previous threshold is zero.
          examples:
            - 1
        minApprovalDelta:
          type: integer
          description: |
            Relative change applied to the minimum number of cosignatory approvals required to approve a
            transaction. When converting a regular account into a multisig account, the initial value is
            derived from this delta because the previous threshold is zero.
          examples:
            - 1
        addressAdditions:
          type: array
          description: |
            Cosignatory addresses to add to the multisig account.
            Newly added cosignatories must opt in by cosigning the aggregate transaction.
          items:
            $ref: '#/components/schemas/UnresolvedAddress'
        addressDeletions:
          type: array
          description: Cosignatory addresses to remove from the multisig account.
          items:
            $ref: '#/components/schemas/UnresolvedAddress'
    EmbeddedMultisigAccountModificationTransactionDTO:
      type: object
      description: Embedded transaction variant of `MultisigAccountModificationTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/MultisigAccountModificationTransactionBodyDTO'
    AccountRestrictionFlagsEnum:
      type: integer
      enum:
        - 1
        - 2
        - 16385
        - 16388
        - 32769
        - 32770
        - 49153
        - 49156
      description: |
        The value is a **bitwise OR** of protocol flags (one **restriction type**, then optional modifiers):

        - **Restriction type** (pick one): **Address** `0x0001`, **MosaicId** `0x0002`, **TransactionType** `0x0004`.
        - **Outgoing** `0x4000` (optional): restriction applies to transactions **from** this account; omit it for **incoming**.
        - **Block** `0x8000` (optional): **block** listed values; omit it for **allow** lists.

        **Example:** block outgoing transactions of a given
        type = `Block` + `Outgoing` + `TransactionType` -> `0x8000 | 0x4000 | 0x0004` = `0xC004` = **49156**.

        All values accepted on-chain (other OR combinations are rejected by the node):
        - `0x0001` (`1`): Allow only incoming transactions from a given address.
        - `0x0002` (`2`): Allow only incoming transactions containing a given mosaic ID.
        - `0x4001` (`16385`): Allow only outgoing transactions to a given address.
        - `0x4004` (`16388`): Allow only outgoing transactions with a given transaction type.
        - `0x8001` (`32769`): Block incoming transactions from a given address.
        - `0x8002` (`32770`): Block incoming transactions containing a given mosaic ID.
        - `0xC001` (`49153`): Block outgoing transactions to a given address.
        - `0xC004` (`49156`): Block outgoing transactions with a given transaction type.
      examples:
        - 1
    AccountAddressRestrictionTransactionBodyDTO:
      type: object
      description: Account address restriction transaction body that updates the allowed or blocked address list.
      required:
        - restrictionFlags
        - restrictionAdditions
        - restrictionDeletions
      properties:
        restrictionFlags:
          $ref: '#/components/schemas/AccountRestrictionFlagsEnum'
        restrictionAdditions:
          type: array
          description: Account restriction additions.
          items:
            $ref: '#/components/schemas/UnresolvedAddress'
        restrictionDeletions:
          type: array
          description: Account restriction deletions.
          items:
            $ref: '#/components/schemas/UnresolvedAddress'
    EmbeddedAccountAddressRestrictionTransactionDTO:
      type: object
      description: Embedded transaction variant of `AccountAddressRestrictionTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/AccountAddressRestrictionTransactionBodyDTO'
    AccountMosaicRestrictionTransactionBodyDTO:
      type: object
      description: Account mosaic restriction transaction body that updates the allowed or blocked mosaic ID list.
      required:
        - restrictionFlags
        - restrictionAdditions
        - restrictionDeletions
      properties:
        restrictionFlags:
          $ref: '#/components/schemas/AccountRestrictionFlagsEnum'
        restrictionAdditions:
          type: array
          description: Account restriction additions.
          items:
            $ref: '#/components/schemas/UnresolvedMosaicId'
        restrictionDeletions:
          type: array
          description: Account restriction deletions.
          items:
            $ref: '#/components/schemas/UnresolvedMosaicId'
    EmbeddedAccountMosaicRestrictionTransactionDTO:
      type: object
      description: Embedded transaction variant of `AccountMosaicRestrictionTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/AccountMosaicRestrictionTransactionBodyDTO'
    AccountOperationRestrictionTransactionBodyDTO:
      type: object
      description: Account operation restriction transaction body that updates the allowed or blocked transaction type list.
      required:
        - restrictionFlags
        - restrictionAdditions
        - restrictionDeletions
      properties:
        restrictionFlags:
          $ref: '#/components/schemas/AccountRestrictionFlagsEnum'
        restrictionAdditions:
          type: array
          description: Account restriction additions.
          items:
            $ref: '#/components/schemas/TransactionTypeEnum'
        restrictionDeletions:
          type: array
          description: Account restriction deletions.
          items:
            $ref: '#/components/schemas/TransactionTypeEnum'
    EmbeddedAccountOperationRestrictionTransactionDTO:
      type: object
      description: Embedded transaction variant of `AccountOperationRestrictionTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/AccountOperationRestrictionTransactionBodyDTO'
    RestrictionKeyHex:
      type: string
      pattern: ^[0-9a-fA-F]+$
      minLength: 16
      maxLength: 16
      description: Restriction key represented as a 64-bit hexadecimal value.
      examples:
        - 0DC67FBE1CAD29E3
    RestrictionValue:
      type: string
      description: |
        Unsigned 64-bit value associated with a mosaic restriction key, represented as a decimal string.
        For address restrictions, it is the value assigned to the target address;
        for global restrictions, it is the threshold evaluated with the restriction type.
      examples:
        - '1000'
    MosaicRestrictionTypeEnum:
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
      description: |
        Comparison operator used to evaluate a mosaic global restriction rule.
        - `0` (`NONE`) - Uninitialized value indicating no restriction.
        - `1` (`EQ`) - Allow if the compared value is equal to the restriction value.
        - `2` (`NE`) - Allow if the compared value is not equal to the restriction value.
        - `3` (`LT`) - Allow if the compared value is less than the restriction value.
        - `4` (`LE`) - Allow if the compared value is less than or equal to the restriction value.
        - `5` (`GT`) - Allow if the compared value is greater than the restriction value.
        - `6` (`GE`) - Allow if the compared value is greater than or equal to the restriction value.
    MosaicGlobalRestrictionTransactionBodyDTO:
      type: object
      description: Mosaic global restriction transaction body that defines the rule and reference value for a restriction key.
      required:
        - mosaicId
        - referenceMosaicId
        - restrictionKey
        - previousRestrictionValue
        - newRestrictionValue
        - previousRestrictionType
        - newRestrictionType
      properties:
        mosaicId:
          $ref: '#/components/schemas/UnresolvedMosaicId'
        referenceMosaicId:
          $ref: '#/components/schemas/UnresolvedMosaicId'
        restrictionKey:
          $ref: '#/components/schemas/RestrictionKeyHex'
        previousRestrictionValue:
          $ref: '#/components/schemas/RestrictionValue'
        newRestrictionValue:
          $ref: '#/components/schemas/RestrictionValue'
        previousRestrictionType:
          $ref: '#/components/schemas/MosaicRestrictionTypeEnum'
        newRestrictionType:
          $ref: '#/components/schemas/MosaicRestrictionTypeEnum'
    EmbeddedMosaicGlobalRestrictionTransactionDTO:
      type: object
      description: Embedded transaction variant of `MosaicGlobalRestrictionTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/MosaicGlobalRestrictionTransactionBodyDTO'
    MosaicAddressRestrictionTransactionBodyDTO:
      type: object
      description: Mosaic address restriction transaction body that sets a restriction value for a target address and key.
      required:
        - mosaicId
        - restrictionKey
        - previousRestrictionValue
        - newRestrictionValue
        - targetAddress
      properties:
        mosaicId:
          $ref: '#/components/schemas/UnresolvedMosaicId'
        restrictionKey:
          $ref: '#/components/schemas/RestrictionKeyHex'
        previousRestrictionValue:
          $ref: '#/components/schemas/RestrictionValue'
        newRestrictionValue:
          $ref: '#/components/schemas/RestrictionValue'
        targetAddress:
          $ref: '#/components/schemas/UnresolvedAddress'
    EmbeddedMosaicAddressRestrictionTransactionDTO:
      type: object
      description: Embedded transaction variant of `MosaicAddressRestrictionTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/MosaicAddressRestrictionTransactionBodyDTO'
    UnresolvedMosaic:
      type: object
      required:
        - id
        - amount
      properties:
        id:
          $ref: '#/components/schemas/UnresolvedMosaicId'
        amount:
          $ref: '#/components/schemas/Amount'
    TransferTransactionBodyDTO:
      type: object
      description: Transfer transaction body with the recipient, transferred mosaics, and optional message.
      required:
        - recipientAddress
        - mosaics
      properties:
        recipientAddress:
          $ref: '#/components/schemas/UnresolvedAddress'
        mosaics:
          type: array
          description: |
            Array of mosaics sent to the recipient.
          items:
            $ref: '#/components/schemas/UnresolvedMosaic'
        message:
          type: string
          description: Optional transfer message payload, encoded as a hexadecimal string.
    EmbeddedTransferTransactionDTO:
      type: object
      description: Embedded transaction variant of `TransferTransactionDTO`.
      allOf:
        - $ref: '#/components/schemas/EmbeddedTransactionDTO'
        - $ref: '#/components/schemas/TransferTransactionBodyDTO'
    EmbeddedTransactionInfoDTO:
      type: object
      description: Embedded transaction record returned from aggregate transaction payloads.
      required:
        - id
        - meta
        - transaction
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        meta:
          $ref: '#/components/schemas/EmbeddedTransactionMetaDTO'
        transaction:
          description: Concrete embedded transaction payload represented by one of the listed transaction DTOs.
          anyOf:
            - $ref: '#/components/schemas/EmbeddedAccountKeyLinkTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedNodeKeyLinkTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedVrfKeyLinkTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedVotingKeyLinkTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedHashLockTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedSecretLockTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedSecretProofTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedAccountMetadataTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedMosaicMetadataTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedNamespaceMetadataTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedMosaicDefinitionTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedMosaicSupplyChangeTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedMosaicSupplyRevocationTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedNamespaceRegistrationTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedAddressAliasTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedMosaicAliasTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedMultisigAccountModificationTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedAccountAddressRestrictionTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedAccountMosaicRestrictionTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedAccountOperationRestrictionTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedMosaicGlobalRestrictionTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedMosaicAddressRestrictionTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedTransferTransactionDTO'
    EmbeddedTransactionBodyDTO:
      type: object
      description: Wrapper for embedded transactions carried inside an aggregate transaction.
      required:
        - transactions
      properties:
        transactions:
          type: array
          description: Array of transactions initiated by different accounts.
          items:
            $ref: '#/components/schemas/EmbeddedTransactionInfoDTO'
    AggregateTransactionBodyExtendedDTO:
      type: object
      description: |
        Extended aggregate transaction body that, in addition to aggregate-level fields, also includes the
        embedded transactions contained in the aggregate.
      allOf:
        - $ref: '#/components/schemas/AggregateTransactionBodyDTO'
        - $ref: '#/components/schemas/EmbeddedTransactionBodyDTO'
    AggregateTransactionExtendedDTO:
      type: object
      description: Transaction to combine multiple transactions together.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/AggregateTransactionBodyExtendedDTO'
    HashLockTransactionDTO:
      type: object
      description: Transaction to lock funds before sending an aggregate bonded transaction.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/HashLockTransactionBodyDTO'
    SecretLockTransactionDTO:
      type: object
      description: |
        Transaction to sends mosaics to a recipient if the proof used is revealed.
        If the duration is reached, the locked funds go back to the sender of the transaction.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/SecretLockTransactionBodyDTO'
    SecretProofTransactionDTO:
      type: object
      description: Transaction to reveal a proof.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/SecretProofTransactionBodyDTO'
    AccountMetadataTransactionDTO:
      type: object
      description: Transaction to create or modify metadata attached to an account.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/AccountMetadataTransactionBodyDTO'
    MosaicMetadataTransactionDTO:
      type: object
      description: Transaction to create or modify metadata attached to a mosaic.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/MosaicMetadataTransactionBodyDTO'
    NamespaceMetadataTransactionDTO:
      type: object
      description: Transaction to create or modify metadata attached to a namespace.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/NamespaceMetadataTransactionBodyDTO'
    MosaicDefinitionTransactionDTO:
      type: object
      description: Transaction to create a new mosaic.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/MosaicDefinitionTransactionBodyDTO'
    MosaicSupplyChangeTransactionDTO:
      type: object
      description: Transaction to increase or decrease the supply of a mosaic.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/MosaicSupplyChangeTransactionBodyDTO'
    MosaicSupplyRevocationTransactionDTO:
      type: object
      description: Transaction that allows the mosaic creator to revoke some balance from a user.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/MosaicSupplyRevocationTransactionBodyDTO'
    NamespaceRegistrationTransactionDTO:
      type: object
      description: Transaction to create or renew a namespace.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/NamespaceRegistrationTransactionBodyDTO'
    AddressAliasTransactionDTO:
      type: object
      description: Transaction to link a namespace to an account.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/AddressAliasTransactionBodyDTO'
    MosaicAliasTransactionDTO:
      type: object
      description: Transaction to link a namespace to a mosaic.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/MosaicAliasTransactionBodyDTO'
    MultisigAccountModificationTransactionDTO:
      type: object
      description: |
        Transaction that converts a regular account into a multisig account or modifies an existing
        multisig account's thresholds and cosignatory set.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/MultisigAccountModificationTransactionBodyDTO'
    AccountAddressRestrictionTransactionDTO:
      type: object
      description: Transaction to prevent incoming and outgoing transactions for a given a set of addresses.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/AccountAddressRestrictionTransactionBodyDTO'
    AccountMosaicRestrictionTransactionDTO:
      type: object
      description: Transaction to prevent incoming transactions containing a given set of mosaics.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/AccountMosaicRestrictionTransactionBodyDTO'
    AccountOperationRestrictionTransactionDTO:
      type: object
      description: Transaction to prevent outgoing transactions by transaction type.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/AccountOperationRestrictionTransactionBodyDTO'
    MosaicGlobalRestrictionTransactionDTO:
      type: object
      description: Transaction to set a network-wide restriction rule to a mosaic.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/MosaicGlobalRestrictionTransactionBodyDTO'
    MosaicAddressRestrictionTransactionDTO:
      type: object
      description: Transaction to set a restriction rule to an address.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/MosaicAddressRestrictionTransactionBodyDTO'
    TransferTransactionDTO:
      type: object
      description: Transaction to transfer mosaics and a message to another account.
      allOf:
        - $ref: '#/components/schemas/TransactionDTO'
        - $ref: '#/components/schemas/TransferTransactionBodyDTO'
    TransactionInfoDTO:
      type: object
      description: |
        Transaction record returned by transaction lookup and search endpoints.

        The same wrapper is used for confirmed, unconfirmed, and partial transaction groups. The exact
        `meta` shape depends on whether the returned entry is a top-level transaction or an embedded
        transaction inside an aggregate. When an aggregate transaction is retrieved by ID or hash, REST can
        also expand its embedded transactions under `transaction.transactions`.
      required:
        - id
        - meta
        - transaction
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        meta:
          description: |
            Metadata for the returned transaction entry.
            Top-level entries use `TransactionMetaDTO`. Embedded entries use `EmbeddedTransactionMetaDTO`.
          anyOf:
            - $ref: '#/components/schemas/TransactionMetaDTO'
            - $ref: '#/components/schemas/EmbeddedTransactionMetaDTO'
        transaction:
          description: |
            Concrete transaction payload represented by one of the listed transaction DTOs.
            For aggregate transaction lookups, REST can populate `transaction.transactions` with the
            embedded transaction records linked to that aggregate.
          anyOf:
            - $ref: '#/components/schemas/AccountKeyLinkTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedAccountKeyLinkTransactionDTO'
            - $ref: '#/components/schemas/NodeKeyLinkTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedNodeKeyLinkTransactionDTO'
            - $ref: '#/components/schemas/VrfKeyLinkTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedVrfKeyLinkTransactionDTO'
            - $ref: '#/components/schemas/VotingKeyLinkTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedVotingKeyLinkTransactionDTO'
            - $ref: '#/components/schemas/AggregateTransactionDTO'
            - $ref: '#/components/schemas/AggregateTransactionExtendedDTO'
            - $ref: '#/components/schemas/HashLockTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedHashLockTransactionDTO'
            - $ref: '#/components/schemas/SecretLockTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedSecretLockTransactionDTO'
            - $ref: '#/components/schemas/SecretProofTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedSecretProofTransactionDTO'
            - $ref: '#/components/schemas/AccountMetadataTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedAccountMetadataTransactionDTO'
            - $ref: '#/components/schemas/MosaicMetadataTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedMosaicMetadataTransactionDTO'
            - $ref: '#/components/schemas/NamespaceMetadataTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedNamespaceMetadataTransactionDTO'
            - $ref: '#/components/schemas/MosaicDefinitionTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedMosaicDefinitionTransactionDTO'
            - $ref: '#/components/schemas/MosaicSupplyChangeTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedMosaicSupplyChangeTransactionDTO'
            - $ref: '#/components/schemas/MosaicSupplyRevocationTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedMosaicSupplyRevocationTransactionDTO'
            - $ref: '#/components/schemas/NamespaceRegistrationTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedNamespaceRegistrationTransactionDTO'
            - $ref: '#/components/schemas/AddressAliasTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedAddressAliasTransactionDTO'
            - $ref: '#/components/schemas/MosaicAliasTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedMosaicAliasTransactionDTO'
            - $ref: '#/components/schemas/MultisigAccountModificationTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedMultisigAccountModificationTransactionDTO'
            - $ref: '#/components/schemas/AccountAddressRestrictionTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedAccountAddressRestrictionTransactionDTO'
            - $ref: '#/components/schemas/AccountMosaicRestrictionTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedAccountMosaicRestrictionTransactionDTO'
            - $ref: '#/components/schemas/AccountOperationRestrictionTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedAccountOperationRestrictionTransactionDTO'
            - $ref: '#/components/schemas/MosaicGlobalRestrictionTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedMosaicGlobalRestrictionTransactionDTO'
            - $ref: '#/components/schemas/MosaicAddressRestrictionTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedMosaicAddressRestrictionTransactionDTO'
            - $ref: '#/components/schemas/TransferTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedTransferTransactionDTO'
    TransactionPage:
      type: object
      description: Paginated transaction search result.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: Array of transactions.
          items:
