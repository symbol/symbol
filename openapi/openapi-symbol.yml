  /network/currency/supply/max:
    get:
      tags:
        - Network routes
      summary: Returns max currency supply
      description: |
        Returns the maximum possible supply of the network currency mosaic.

        Data sources:
          - Maximum supply (`chain.maxMosaicAtomicUnits`) defined in the network properties file
          - Network currency divisibility from blockchain state

        This represents the protocol-level supply cap configured for the network currency.
      operationId: getMaxCurrencySupply
      responses:
        '200':
          description: |
            Successful response containing the max currency supply.

            The value is expressed in whole units with a fractional part
            determined by the mosaic divisibility and returned as a fixed-decimal string.
          content:
            text/plain:
              schema:
                type: string
                pattern: ^\d+\.\d+$
                examples:
                  - '8999999999.000000'
  /network/currency/supply/total:
    get:
      tags:
        - Network routes
      summary: Returns total currency supply
      description: |
        Returns the total current on-chain supply of the network currency mosaic.

        Data sources:
          - Mosaic supply and divisibility from blockchain state

        This value includes both circulating and uncirculating balances and represents
        the full issued supply currently recorded on-chain.
      operationId: getTotalCurrencySupply
      responses:
        '200':
          description: |
            Successful response containing the total currency supply.

            The value is expressed in whole units with a fractional part
            determined by the mosaic divisibility and returned as a fixed-decimal string.
          content:
            text/plain:
              schema:
                type: string
                pattern: ^\d+\.\d+$
                examples:
                  - '7842928625.000000'
  /network/currency/supply/circulating:
    get:
      tags:
        - Network routes
      summary: Returns circulating currency supply
      description: |
        Returns the current circulating supply of the network currency mosaic.

        Circulating supply represents the portion of total on-chain supply that is not held in
        designated uncirculating or reserved accounts (e.g. nemesis or treasury accounts).

        Data sources:
          - Mosaic supply and divisibility from blockchain state
          - Nemesis signer public key from network properties file
          - Uncirculating account public keys defined in rest.json (`uncirculatingAccountPublicKeys`)
      operationId: getCirculatingCurrencySupply
      responses:
        '200':
          description: |
            Successful response containing the circulating currency supply.

            The value is expressed in whole units with a fractional part
            determined by the mosaic divisibility and returned as a fixed-decimal string.
          content:
            text/plain:
              schema:
                type: string
                pattern: ^\d+\.\d+$
                examples:
                  - '6351335211.744781'
