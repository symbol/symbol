          examples:
            - 2d
    SecretLockNetworkPropertiesDTO:
      type: object
      properties:
        maxSecretLockDuration:
          type: string
          description: Maximum number of blocks for which a secret lock can exist.
          examples:
            - 365d
        minProofSize:
          type: string
          description: Minimum size of a proof in bytes.
          examples:
            - '0'
        maxProofSize:
          type: string
          description: Maximum size of a proof in bytes.
          examples:
            - '1024'
    MetadataNetworkPropertiesDTO:
      type: object
      properties:
        maxValueSize:
          type: string
          description: Maximum metadata value size.
          examples:
            - '1024'
    MosaicNetworkPropertiesDTO:
      type: object
      description: |
        Mosaic plugin settings from network configuration (`/network/properties`).
        Values from Symbol mainnet.
      properties:
        maxMosaicsPerAccount:
          type: string
          description: Maximum number of mosaics that an account can own.
          examples:
            - 1'000
        maxMosaicDuration:
          type: string
          description: Maximum mosaic duration (BlockSpan format, e.g. `3650d` for 3650 days).
          examples:
            - 3650d
        maxMosaicDivisibility:
          type: string
          description: Maximum mosaic divisibility.
          examples:
            - '6'
        mosaicRentalFeeSinkAddressV1:
          $ref: '#/components/schemas/Address'
          description: |
            Legacy address (in Base32 format) of the mosaic rental fee sink.
            Used before treasury reissuance fork. May be absent on newer networks.
          examples:
            - NC733XE7DF46Q7QYLIIZBBSCJN2BEEP5FQ6PAYA
        mosaicRentalFeeSinkAddress:
          $ref: '#/components/schemas/Address'
          description: Address of the mosaic rental fee sink account (receives fees for mosaic creation).
          examples:
            - NCVORTEX4XD5IQASZQEHDWUXT33XBOTBMKFDCLI
        mosaicRentalFee:
          $ref: '#/components/schemas/Amount'
          description: Mosaic rental fee in atomic units (paid to create a new mosaic).
          examples:
            - '500000'
    MultisigNetworkPropertiesDTO:
      type: object
      description: Network-level limits that constrain multisig account structure.
      properties:
        maxMultisigDepth:
          type: string
          description: |
            Maximum multisig depth allowed by the network, measured as the longest cosignatory chain.
            A regular multisig account with only non-multisig cosignatories has depth `1`.
            If one of its cosignatories is itself a multisig account, the depth becomes `2`; one more
            nested multisig level makes it `3`.
          examples:
            - '3'
        maxCosignatoriesPerAccount:
          type: string
          description: Maximum number of cosignatories that can directly manage a single multisig account.
          examples:
            - '25'
        maxCosignedAccountsPerAccount:
          type: string
          description: Maximum number of multisig accounts that a single account can cosign.
          examples:
            - '25'
    NamespaceNetworkPropertiesDTO:
      type: object
      description: Namespace plugin configuration.
      properties:
        maxNameSize:
          type: string
          description: Maximum namespace name size.
          examples:
            - '64'
        maxChildNamespaces:
          type: string
          description: Maximum number of children for a root namespace.
          examples:
            - '100'
        maxNamespaceDepth:
          type: string
          description: Maximum namespace depth.
          examples:
            - '3'
        minNamespaceDuration:
          type: string
          description: Minimum namespace duration.
          examples:
            - 30d
        maxNamespaceDuration:
          type: string
          description: Maximum namespace duration.
          examples:
            - 1825d
        namespaceGracePeriodDuration:
          type: string
          description: Grace period during which time only the previous owner can renew an expired namespace.
          examples:
            - 30d
        reservedRootNamespaceNames:
          type: string
          description: Comma-separated list of reserved root namespace names that cannot be claimed.
          examples:
            - symbol, symbl, xym, xem, nem, user, account, org, com, biz, net, edu, mil, gov, info
        namespaceRentalFeeSinkAddressV1:
          $ref: '#/components/schemas/Address'
          description: Legacy (V1) address (in Base32 format) of the namespace rental fee sink. May be absent on newer networks.
        namespaceRentalFeeSinkAddress:
          $ref: '#/components/schemas/Address'
          description: Address of the namespace rental fee sink account.
          examples:
            - NCVORTEX4XD5IQASZQEHDWUXT33XBOTBMKFDCLI
        rootNamespaceRentalFeePerBlock:
          $ref: '#/components/schemas/Amount'
          description: Root namespace rental fee per block in atomic units.
          examples:
            - '2'
        childNamespaceRentalFee:
          $ref: '#/components/schemas/Amount'
          description: Child namespace rental fee in atomic units.
          examples:
            - '100000'
    AccountRestrictionNetworkPropertiesDTO:
