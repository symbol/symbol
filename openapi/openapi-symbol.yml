            - $ref: '#/components/schemas/EmbeddedMosaicAddressRestrictionTransactionDTO'
            - $ref: '#/components/schemas/TransferTransactionDTO'
            - $ref: '#/components/schemas/EmbeddedTransferTransactionDTO'
