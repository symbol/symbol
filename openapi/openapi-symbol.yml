components:
  schemas:
    Address:
      type: string
      description: |
        Represents a unique account address in Base32 format. The first character indicates the network
        (`T` for testnet, `N` for mainnet). Addresses are 39 characters long, Base32-encoded,
        and include an embedded 3-byte checksum. The node validates this checksum, so an address
        with even a single altered character will be rejected.
      minLength: 39
      maxLength: 39
      pattern: ^[A-Z2-7]{39}$
      examples:
        - TADP6C2GVEG654OP5LZI32P2GYJSCMEGQBYB7QY
        - NCHEST3QRQS4JZGOO64TH7NFJ2A63YA7TPM5PXI
    Order:
      type: string
      description: |
        Indicates how to sort the results:
        - `asc`: ascending
        - `desc`: descending
      enum:
        - asc
        - desc
      default: desc
    AccountOrderByEnum:
      type: string
      description: |
        Account sort field:
        - `id`: sort by internal identifier.
        - `balance`: sort by mosaic balance.
      enum:
        - id
        - balance
    MosaicId:
      type: string
      description: |
        Unique [mosaic](https://docs.symbol.dev/concepts/mosaic.html) identifier.
        A 64-bit unsigned integer derived from the creator's address and a registration nonce,
        encoded as a 16-character hexadecimal string.
      format: hex
      minLength: 16
      maxLength: 16
      pattern: ^[0-9a-fA-F]{16}$
      examples:
        - 0DC67FBE1CAD29E3
    ObjectId:
      type: string
      description: |
        Unique identifier of the object in the node's database (MongoDB ObjectId).
        Used as the ``offset`` parameter value for cursor-based pagination.
      minLength: 24
      maxLength: 24
      pattern: ^[0-9a-fA-F]{24}$
      examples:
        - 5E62690AB46E5565E8C0B5B5
    StateVersion:
      type: integer
      description: |
        Version of the on-chain state serialization format. Incremented when the storage
        schema of the entity changes (e.g. new fields are added), allowing the node to
        deserialize entries written under earlier formats.
      examples:
        - 1
    AddressHex:
      type: string
      description: |
        Address encoded as a 48-character hexadecimal string (24 bytes).
        The REST API returns addresses in this format. For Base32-encoded addresses (39 chars) see ``Address``.
      format: hex
      minLength: 48
      maxLength: 48
      pattern: ^[0-9a-fA-F]{48}$
      examples:
        - 68723C817A9F613C879E498D757D9E6967E222BA6F9721B2
        - 68903FE829718D144A8FDA46EB52E2E874B13D6198AD8528
    Height:
      type: string
      description: |
        Height of a block in the blockchain. Starts at 1 and increments by one per block.
        Represented as a string to preserve precision, since the value is an unsigned 64-bit integer.
      pattern: ^[1-9][0-9]*$
      examples:
        - '1'
        - '17592'
    PublicKey:
      type: string
      description: 256-bit public key encoded as a hexadecimal string (64 hex characters).
      format: hex
      minLength: 64
      maxLength: 64
      pattern: ^[0-9a-fA-F]{64}$
      examples:
        - AC1A6E1D8DE5B17D2C6B1293F1CAD3829EEACF38D09311BB3C8E5A880092DE26
    AccountTypeEnum:
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
      description: |
        Indicates the [harvesting](https://docs.symbol.dev/concepts/harvesting.html) delegation role
        of the account. When an account enables
        [remote](https://docs.symbol.dev/concepts/harvesting.html#remote-harvesting) or
        [delegated](https://docs.symbol.dev/concepts/harvesting.html#delegated-harvesting) harvesting,
        it links to a remote proxy account that signs blocks on its behalf. This field reflects which
        side of that relationship the account is on:
        - `0`: **Unlinked.** The account has no harvesting delegation relationship.
        - `1`: **Main.** Balance-holding account (harvester) that is linked to a remote proxy account.
          Importance score is calculated from this account's balance and activity.
        - `2`: **Remote.** Proxy account that signs blocks on behalf of a linked main account.
          It holds no funds; its sole purpose is to keep the main account's private key off the node.
        - `3`: **Remote unlinked.** An account that was previously used as a remote proxy
          but is currently not linked to any main account.
      examples:
        - 0
    AccountLinkPublicKeyDTO:
      type: object
      description: Public key linked to the account for a supplemental role (linked, node, or VRF).
      required:
        - publicKey
      properties:
        publicKey:
          $ref: '#/components/schemas/PublicKey'
    FinalizationEpoch:
      type: integer
      format: int64
      description: |
        [Finalization epoch](https://docs.symbol.dev/concepts/block.html#finalization) is a sequential
        integer. Each epoch groups a set of blocks for finalization voting; the interval is defined
        by the `votingSetGrouping` network property (e.g. 1440 blocks, ~12h on mainnet).
      minimum: 1
      maximum: 9223372036854776000
      examples:
        - 1
    AccountLinkVotingKeyDTO:
      type: object
      description: Voting key linked to the account, valid for a range of finalization epochs.
      required:
        - publicKey
        - startEpoch
        - endEpoch
      properties:
        publicKey:
          $ref: '#/components/schemas/PublicKey'
        startEpoch:
          $ref: '#/components/schemas/FinalizationEpoch'
          description: First finalization epoch for which this key is valid.
        endEpoch:
          $ref: '#/components/schemas/FinalizationEpoch'
          description: Last finalization epoch for which this key is valid.
    AccountLinkVotingKeysDTO:
      type: object
      description: Set of voting keys linked to the account for finalization.
      required:
        - publicKeys
      properties:
        publicKeys:
          type: array
          description: Array of voting key link entries.
          items:
            $ref: '#/components/schemas/AccountLinkVotingKeyDTO'
    SupplementalPublicKeysDTO:
      type: object
      description: |
        Supplemental public keys linked to the account for delegated harvesting, node linking,
        VRF key derivation, and finalization voting.
      properties:
        linked:
          $ref: '#/components/schemas/AccountLinkPublicKeyDTO'
        node:
          $ref: '#/components/schemas/AccountLinkPublicKeyDTO'
        vrf:
          $ref: '#/components/schemas/AccountLinkPublicKeyDTO'
        voting:
          $ref: '#/components/schemas/AccountLinkVotingKeysDTO'
    Amount:
      type: string
      description: |
        Absolute amount expressed in the mosaic's smallest (atomic) unit, with no decimal point.
        For example, an amount of `123456789` for a mosaic with divisibility 6 represents
        `123.456789` whole units. Encoded as a string to preserve precision, since the value
        is an unsigned 64-bit integer.
      examples:
        - '123456789'
    UInt32:
      type: integer
      description: |
        Unsigned 32-bit integer.
        Represented as integer since it fits in JSON number precision.
      examples:
        - 0
        - 1
        - 2222212828
    Importance:
      type: string
      description: |
        [Importance score](https://docs.symbol.dev/concepts/consensus-algorithm.html#importance-score)
        of an account, representing the probability of being selected to harvest the next block under
        the [PoS+](https://docs.symbol.dev/concepts/consensus-algorithm.html) consensus algorithm.
        The score is derived from three factors: stake, transaction activity, and node operation.
        Only accounts holding at least the minimum harvesting balance (`minHarvesterBalance` network
        property) receive a non-zero score. Decimal value between 0 and 1 (inclusive).
        Minimum: 0. Maximum: 1.
      pattern: ^(0|1|0\.[0-9]+|1\.0*)$
      examples:
        - '0'
        - '0.010263666447108395'
    ActivityBucketDTO:
      type: object
      required:
        - startHeight
        - totalFeesPaid
        - beneficiaryCount
        - rawScore
      description: |
        Supplementary data stored for [importance](https://docs.symbol.dev/concepts/consensus-algorithm.html#importance-calculation)
        recalculation under the PoS+ consensus algorithm. At the end of each importance period
        (defined by the `importanceGrouping` network property) the working bucket is finalized, existing buckets are shifted,
        and a new working bucket is created. Each bucket influences at most five importance recalculations.
      properties:
        startHeight:
          $ref: '#/components/schemas/Height'
          description: Block height at which this bucket's observation period started.
        totalFeesPaid:
          $ref: '#/components/schemas/Amount'
          description: |
            Total transaction fees (in smallest/atomic units) paid by the account during this bucket's period.
            Used to compute the
            [Transaction Score (T)](https://docs.symbol.dev/concepts/consensus-algorithm.html#partial-scores)
            component of the PoS+ importance calculation.
        beneficiaryCount:
          $ref: '#/components/schemas/UInt32'
          description: |
            Number of times the account was designated as a node fee beneficiary during this bucket's
            period. Used to compute the
            [Node Score (N)](https://docs.symbol.dev/concepts/consensus-algorithm.html#partial-scores)
            component. Accounts that operate nodes accumulate a higher count, increasing their importance.
        rawScore:
          $ref: '#/components/schemas/Importance'
          description: |
            Importance score calculated for this single bucket period, before averaging across buckets.
            The final effective importance of the account is derived from the scores of the most recent
            buckets (the smaller of the previous two period scores is used as the harvesting probability).
    Mosaic:
      type: object
      description: |
        An instance of a [mosaic](https://docs.symbol.dev/concepts/mosaic.html) held by an account
        or transferred in a transaction. The amount is always expressed in the mosaic's smallest
        (atomic) unit. For example, if the mosaic has a divisibility of 6, an amount of `1000000`
        represents `1.000000` whole units.
      required:
        - id
        - amount
      properties:
        id:
          $ref: '#/components/schemas/MosaicId'
        amount:
          $ref: '#/components/schemas/Amount'
      examples:
        - id: 0DC67FBE1CAD29E3
          amount: '1000000'
    AccountDTO:
      type: object
      description: |
        Account state on the blockchain. Contains the public key, address, balances,
        importance score, and supplemental keys used for delegated harvesting and finalization.
      required:
        - version
        - address
        - addressHeight
        - publicKey
        - publicKeyHeight
        - accountType
        - supplementalPublicKeys
        - activityBuckets
        - mosaics
        - importance
        - importanceHeight
      properties:
        version:
          $ref: '#/components/schemas/StateVersion'
        address:
          $ref: '#/components/schemas/AddressHex'
        addressHeight:
          $ref: '#/components/schemas/Height'
          description: Height of the blockchain when the address was first published.
        publicKey:
          $ref: '#/components/schemas/PublicKey'
        publicKeyHeight:
          $ref: '#/components/schemas/Height'
          description: Height of the blockchain when the public key was first published.
        accountType:
          $ref: '#/components/schemas/AccountTypeEnum'
        supplementalPublicKeys:
          $ref: '#/components/schemas/SupplementalPublicKeysDTO'
        activityBuckets:
          type: array
          description: Activity buckets used for importance score calculation.
          items:
            $ref: '#/components/schemas/ActivityBucketDTO'
        mosaics:
          type: array
          description: Mosaic units owned by the account.
          items:
            $ref: '#/components/schemas/Mosaic'
        importance:
          $ref: '#/components/schemas/Importance'
        importanceHeight:
          $ref: '#/components/schemas/Height'
          description: Height at which the importance was last recalculated.
    AccountInfoDTO:
      type: object
      description: Account information including an internal resource identifier and the full account state.
      required:
        - id
        - account
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        account:
          $ref: '#/components/schemas/AccountDTO'
    Pagination:
      type: object
      description: |
        Pagination metadata returned with paginated list responses. Indicates the current page
        and the number of entries per page.
      required:
        - pageNumber
        - pageSize
      properties:
        pageNumber:
          type: integer
          description: Current page number.
          minimum: 1
        pageSize:
          type: integer
          description: Number of entries per page.
          minimum: 10
          maximum: 100
    AccountPage:
      type: object
      description: Paginated list of account information objects.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: Array of account information objects.
          items:
            $ref: '#/components/schemas/AccountInfoDTO'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ModelError:
      type: object
      description: |
        Error response body returned for 4xx responses.
        Contains an error code identifier and a human-readable message.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: |
            Error type identifier. Common values:
            - `InvalidContent`: malformed request body or unparsable content (HTTP 400).
            - `ResourceNotFound`: requested resource does not exist (HTTP 404).
            - `InvalidArgument`: required arguments missing or unacceptable (HTTP 409).
        message:
          type: string
          description: Human-readable error description. May include the invalid value or resource identifier.
    accountIds:
      type: object
      description: |
        Request body for batch account lookup. Provide either ``publicKeys`` or ``addresses``, not both.
        At least one must be non-empty.
      properties:
        publicKeys:
          type: array
          description: Array of account public keys.
          items:
            $ref: '#/components/schemas/PublicKey'
        addresses:
          type: array
          description: Array of account addresses.
          items:
            $ref: '#/components/schemas/Address'
    MerkleTreeRaw:
      type: string
      format: hex
      description: |
        Serialized Patricia Merkle tree in compact hex format, as returned by the server.
        Used for [state proofs](https://docs.symbol.dev/concepts/data-validation.html) to verify
        entity state (account, mosaic, metadata, etc.) without downloading the full ledger.
        See [Symbol Technical Reference](https://symbol.github.io/symbol-technicalref/main.pdf)
        chapter 4.3 for the tree structure specification.
      examples:
        - 00008080DA9B4AF63BE985715EA635AF98E3CF3B0A22F9A2BE1C7DD40B79948AA63E36586E5D2E9D0C089C1C64BC0D42A11ADBD1CD6CDB4B7C294062F55113525A64AE3CFF3F04A7F2A487B42EA89323C4408F82415223ACFEC7DFA7924EFC31A70778AB17A00C3EAFF635F01BB3B474F0AF1BE99FBDA85EEFB209CC7BD158D3540DE3A3F2D1
    MerkleTreeNodeTypeEnum:
      type: integer
      enum:
        - 0
        - 255
      description: |
        Type of [Merkle tree](https://docs.symbol.dev/concepts/data-validation.html) node used in
        state proofs:
        - `0`: Branch node (internal node with child links).
        - `255`: Leaf node (terminal node with value).
      examples:
        - 0
        - 255
    Hash256:
      type: string
      description: 256-bit hash encoded as a 64-character hexadecimal string.
      format: hex
      minLength: 64
      maxLength: 64
      pattern: ^[0-9a-fA-F]{64}$
      examples:
        - C8FC3FB54FDDFBCE0E8C71224990124E4EEC5AD5D30E592EDFA9524669A23810
    MerkleTreeBranchLinkDTO:
      type: object
      description: |
        Child link in a [Merkle tree branch](https://docs.symbol.dev/concepts/data-validation.html)
        node. Each link points to a child node (branch or leaf) via its hash.
      required:
        - bit
        - link
      properties:
        bit:
          description: Nibble index (0 to 15) identifying this child slot (hex).
          type: string
        link:
          description: Hash of the child node.
          $ref: '#/components/schemas/Hash256'
    MerkleTreeBranchDTO:
      type: object
      description: |
        Internal node of a [Patricia Merkle tree](https://docs.symbol.dev/concepts/data-validation.html)
        used in state proofs. A branch has up to 16 child links (one per nibble 0 to F) and a path prefix.
      required:
        - type
        - path
        - encodedPath
        - nibbleCount
        - linkMask
        - links
        - branchHash
      properties:
        type:
          description: Node type (always branch).
          $ref: '#/components/schemas/MerkleTreeNodeTypeEnum'
        path:
          description: Path prefix (hex) from root to this branch.
          type: string
        encodedPath:
          description: Compact-encoded path.
          type: string
        nibbleCount:
          description: Number of nibbles in the path.
          type: integer
        linkMask:
          description: Bitmask indicating which nibble slots (0 to 15) have child links.
          type: string
        links:
          description: Child links (max 16, one per nibble).
          type: array
          items:
            $ref: '#/components/schemas/MerkleTreeBranchLinkDTO'
        branchHash:
          description: Hash of the branch node.
          $ref: '#/components/schemas/Hash256'
    MerkleTreeLeafDTO:
      type: object
      description: |
        Terminal node of a [Patricia Merkle tree](https://docs.symbol.dev/concepts/data-validation.html)
        used in state proofs. A leaf stores the final path and the associated value (entity state hash).
      required:
        - type
        - path
        - encodedPath
        - nibbleCount
        - value
        - leafHash
      properties:
        type:
          description: Node type (always leaf).
          $ref: '#/components/schemas/MerkleTreeNodeTypeEnum'
        path:
          description: Full path (hex) from root to this leaf.
          type: string
        encodedPath:
          description: Compact-encoded path.
          type: string
        nibbleCount:
          description: Number of nibbles in the path.
          type: integer
        value:
          description: Leaf value (SHA3-256 hash of the entity state).
          type: string
        leafHash:
          description: Hash of the leaf node.
          $ref: '#/components/schemas/Hash256'
    MerkleStateInfoDTO:
      type: object
      description: |
        The Merkle path information clients can use to prove the state of the given entity.
      required:
        - raw
        - tree
      properties:
        raw:
          $ref: '#/components/schemas/MerkleTreeRaw'
        tree:
          description: Merkle tree parsed from Merkle tree raw.
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/MerkleTreeBranchDTO'
              - $ref: '#/components/schemas/MerkleTreeLeafDTO'
    BlockOrderByEnum:
      type: string
      description: |
        Block sort field:
        - `id`: sort by internal identifier.
        - `height`: sort by block height.
      enum:
        - id
        - height
    Timestamp:
      type: string
      description: |
        Network timestamp in **milliseconds** since the creation of the nemesis (first) block.
        Used for block timestamps, transaction deadlines, and time synchronization.

        **Finding the nemesis block time:** The ``epochAdjustment`` field returned by the
        [``/network/properties``] endpoint gives the nemesis block creation time in seconds since the
        [UNIX epoch](https://en.wikipedia.org/wiki/Unix_time). For Symbol MAINNET this is
        always ``1615853185`` (15 March 2021, 00:06:25 UTC).

        **Converting to real time:** Add this timestamp (ms) to ``epochAdjustment × 1000`` (ms), then use standard date functions.
        Note: ``epochAdjustment`` may be returned as a string like ``"1615853185s"``; use the numeric part.
      examples:
        - '108303181802'
    BlockMetaDTO:
      type: object
      description: Block metadata including hash, total fee, generation hash, and transaction/statement counts.
      required:
        - hash
        - totalFee
        - generationHash
        - stateHashSubCacheMerkleRoots
        - totalTransactionsCount
        - transactionsCount
        - statementsCount
      properties:
        hash:
          $ref: '#/components/schemas/Hash256'
        totalFee:
          $ref: '#/components/schemas/Amount'
          description: Sum (in smallest/atomic units) of all transaction fees included in the block.
        generationHash:
          $ref: '#/components/schemas/Hash256'
        stateHashSubCacheMerkleRoots:
          type: array
          description: Merkle roots of each sub-cache at this block height.
          items:
            $ref: '#/components/schemas/Hash256'
        totalTransactionsCount:
          type: integer
          description: |
            Total number of [transactions](https://docs.symbol.dev/concepts/transaction.html)
            confirmed in this block, including *embedded* transactions
            (i.e. transactions contained within aggregate transactions).
          examples:
            - 1
        transactionsCount:
          type: integer
          description: |
            Number of [transactions](https://docs.symbol.dev/concepts/transaction.html)
            confirmed in this block. This does not count *embedded* transactions
            (i.e. transactions contained within aggregate transactions).
          examples:
            - 1
        statementsCount:
          type: integer
          description: |
            Number of statements (of any kind) present in this block.
            Bear in mind that some of them (like
            [resolution statements](https://docs.symbol.dev/concepts/receipt.html#resolution-statement))
            are triggered by transactions present in the block, but in general,
            [transaction statements](https://docs.symbol.dev/concepts/receipt.html#transaction-statement)
            are not.
          examples:
            - 1
    SizePrefixedEntityDTO:
      type: object
      description: |
        Size-prefixed entity base. Adds the `size` field indicating the total byte length
        of the serialized entity. Used by BlockDTO and TransactionDTO.
        In Symbol's binary format, entities are prefixed with their size for efficient parsing.
      required:
        - size
      properties:
        size:
          $ref: '#/components/schemas/UInt32'
          description: |
            Total size of the serialized entity in bytes. Includes the full binary payload,
            including the 4-byte size field itself.
    Signature:
      type: string
      description: |
        64-byte Ed25519 signature (128 hex characters). Generated by the signer using their private key
        over the serialized entity payload. Can be verified with the signer's public key (`signerPublicKey`).
        Used for blocks, transactions, and cosignatures.
      format: hex
      examples:
        - 4B408BBEDF25F2AC8E0E44A6E51E3CCBA03885902055F75EB9FF50433532CA44BF9175FDA7502EEE2FC1617126E453A2BD692BAFDAAF06BC8EDEBA7961B3730D
    VerifiableEntityDTO:
      type: object
      description: |
        Verifiable entity base. Adds the `signature` field proving the entity was signed
        by the account identified in `signerPublicKey` (EntityDTO). Used by BlockDTO and TransactionDTO.
        The signature covers the serialized entity payload and can be verified using the signer's public key.
      required:
        - signature
      properties:
        signature:
          $ref: '#/components/schemas/Signature'
    NetworkTypeEnum:
      type: integer
      enum:
        - 104
        - 152
      description: |
        Network type:
        - `0x68` (104 decimal): Main network.
        - `0x98` (152 decimal): Test network.
      examples:
        - 152
    EntityDTO:
      type: object
      description: |
        Base entity fields shared by blocks, transactions, and other on-chain entities.
        Extended by VerifiableEntityDTO (signature) and SizePrefixedEntityDTO (size).
        Used in BlockDTO, TransactionDTO, and EmbeddedTransactionDTO.
      required:
        - signerPublicKey
        - version
        - network
        - type
      properties:
        signerPublicKey:
          $ref: '#/components/schemas/PublicKey'
          description: Public key of the account that signed the entity (e.g. block harvester, transaction signer).
        version:
          type: integer
          description: Entity version. Indicates the schema variant for serialization and validation.
        network:
          $ref: '#/components/schemas/NetworkTypeEnum'
          description: Network type (mainnet or testnet). Ensures the entity targets the correct network.
        type:
          type: integer
          description: Entity type identifier (e.g. transaction type code, block type). Determines the entity schema.
    Difficulty:
      type: string
      description: |
        Block difficulty. Determines how hard it is to harvest a new block, based on previous blocks.
        The initial difficulty is 100'000'000'000'000 (1e14) and remains at this level as long as blocks
        are generated every ``blockGenerationTargetTime`` seconds (network property).
        When block generation times deviate from the target, the difficulty is adjusted dynamically
        in the range of 10'000'000'000'000 (1e13) to 100'000'000'000'000'000 (1e15) to maintain
        the target block creation rate. See the
        [Technical Reference](https://symbol.github.io/symbol-technicalref/main.pdf) section 8.1.
        Represented as a string to preserve precision (unsigned 64-bit integer).
      examples:
        - '100000000000000'
        - '26453656336676'
    ProofGamma:
      type: string
      format: hex
      description: |
        32-byte (64 hex characters) VRF proof gamma. Part of the block's
        [generation hash proof](https://docs.symbol.dev/concepts/block.html#header) (VrfProof).
        The gamma value is the first component of the VRF output; it is combined with
        ``proofScalar`` and ``proofVerificationHash`` to form the complete verifiable proof.
      examples:
        - 8D49594A96C31EC6C64305FB2CCB47AA7A4AC0A4F614442BB3684D2BF41F274E
    ProofVerificationHash:
      type: string
      format: hex
      description: |
        16-byte (32 hex characters) VRF proof verification hash. Part of the block's
        [generation hash proof](https://docs.symbol.dev/concepts/block.html#header) (VrfProof),
        together with ``proofGamma`` and ``proofScalar``.
        The harvester generates this proof using its VRF private key; the verification hash
        allows anyone with the VRF public key to verify that the proof was correctly computed
        without revealing the private key.
      examples:
        - 82FB583BFE3EE78805784D078F2547AE
    ProofScalar:
      type: string
      format: hex
      description: |
        32-byte (64 hex characters) VRF proof scalar. Part of the block's
        [generation hash proof](https://docs.symbol.dev/concepts/block.html#header) (VrfProof).
        The scalar proves that the gamma value was correctly derived from the VRF input
        without revealing the harvester's private key.
      examples:
        - 480175C83739B22C53EAECAA7E7F3B245F1DFAFA6B3AE5C1D0129502FCBAAD0C
    BlockFeeMultiplier:
      type: integer
      minimum: 0
      maximum: 4294967295
      description: |
        Fee multiplier applied to the size of a transaction to obtain its fee, in
        [absolute units](https://docs.symbol.dev/concepts/mosaic.html#divisibility).
        Set by the harvester when creating a block; stored in the block header.

        The effective fee for a transaction is:

        ``effectiveFee = transaction.size × block.feeMultiplier``

        Node owners can configure the fee multiplier to any non-negative value (including zero).
        For transaction senders, the median fee multiplier over recent blocks is available
        via ``/network/fees/transaction``; using ``medianFeeMultiplier`` or higher
        improves chances of inclusion. See the [fees documentation](https://docs.symbol.dev/concepts/fees.html).
      examples:
        - 0
        - 100
        - 10000
    BlockDTO:
      type: object
      description: |
        Block header data. Contains the height, timestamp, difficulty, VRF proof,
        hashes linking to the previous block, transactions, receipts, and state,
        as well as the beneficiary address and fee multiplier.
        The harvester is identified by `signerPublicKey`; `beneficiaryAddress` is the optional reward recipient.
      allOf:
        - $ref: '#/components/schemas/SizePrefixedEntityDTO'
        - $ref: '#/components/schemas/VerifiableEntityDTO'
        - $ref: '#/components/schemas/EntityDTO'
        - type: object
          required:
            - height
            - timestamp
            - difficulty
            - proofGamma
            - proofVerificationHash
            - proofScalar
            - previousBlockHash
            - transactionsHash
            - receiptsHash
            - stateHash
            - beneficiaryAddress
            - feeMultiplier
          properties:
            height:
              $ref: '#/components/schemas/Height'
            timestamp:
              $ref: '#/components/schemas/Timestamp'
            difficulty:
              $ref: '#/components/schemas/Difficulty'
            proofGamma:
              $ref: '#/components/schemas/ProofGamma'
            proofVerificationHash:
              $ref: '#/components/schemas/ProofVerificationHash'
            proofScalar:
              $ref: '#/components/schemas/ProofScalar'
            previousBlockHash:
              $ref: '#/components/schemas/Hash256'
            transactionsHash:
              $ref: '#/components/schemas/Hash256'
              description: Merkle root hash of the transactions in this block.
            receiptsHash:
              $ref: '#/components/schemas/Hash256'
              description: Merkle root hash of the receipts generated by this block.
            stateHash:
              $ref: '#/components/schemas/Hash256'
              description: Hash of the global chain state at this block.
            beneficiaryAddress:
              $ref: '#/components/schemas/AddressHex'
              description: |
                Address of the optional beneficiary designated by the harvester. Returned as 48-character hex (24 bytes).
            feeMultiplier:
              $ref: '#/components/schemas/BlockFeeMultiplier'
    UInt64:
      type: string
      description: |
        Unsigned 64-bit integer represented as a decimal string. Encoded as a string to preserve precision.
      examples:
        - '123456'
    ImportanceBlockDTO:
      type: object
      description: |
        Importance block extending the regular block header with additional fields
        related to importance recalculation and finalization voting eligibility.
      allOf:
        - $ref: '#/components/schemas/BlockDTO'
        - type: object
          required:
            - votingEligibleAccountsCount
            - harvestingEligibleAccountsCount
            - totalVotingBalance
            - previousImportanceBlockHash
          properties:
            votingEligibleAccountsCount:
              $ref: '#/components/schemas/UInt32'
              description: Number of accounts eligible for finalization voting at this block.
            harvestingEligibleAccountsCount:
              $ref: '#/components/schemas/UInt64'
              description: Number of accounts eligible for harvesting at this block.
            totalVotingBalance:
              $ref: '#/components/schemas/Amount'
              description: Total balance (in smallest/atomic units) eligible for finalization voting.
            previousImportanceBlockHash:
              $ref: '#/components/schemas/Hash256'
              description: Hash of the previous importance block.
    BlockInfoDTO:
      type: object
      description: Block information including an internal resource identifier, block metadata, and the full block header.
      required:
        - id
        - meta
        - block
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        meta:
          $ref: '#/components/schemas/BlockMetaDTO'
        block:
          anyOf:
            - $ref: '#/components/schemas/BlockDTO'
            - $ref: '#/components/schemas/ImportanceBlockDTO'
    BlockPage:
      type: object
      description: Paginated list of block information objects.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: Array of block information objects.
          items:
            $ref: '#/components/schemas/BlockInfoDTO'
        pagination:
          $ref: '#/components/schemas/Pagination'
    PositionEnum:
      type: string
      description: |
        Position relative to the proofHash being evaluated:
        - `left`: the item hash is concatenated before the proofHash.
        - `right`: the item hash is concatenated after the proofHash.
      enum:
        - left
        - right
    MerklePathItemDTO:
      type: object
      description: |
        A single node in the Merkle proof path. Each item contains a hash and its position
        (left or right) relative to the proofHash being evaluated.
      properties:
        position:
          $ref: '#/components/schemas/PositionEnum'
        hash:
          $ref: '#/components/schemas/Hash256'
          description: Sibling node hash used when recalculating the Merkle root.
    MerkleProofInfoDTO:
      type: object
      description: Merkle proof information containing the path items needed to recalculate the Merkle root.
      properties:
        merklePath:
          type: array
          description: List of complementary Merkle path items needed to recalculate the Merkle root.
          items:
            $ref: '#/components/schemas/MerklePathItemDTO'
    Score:
      type: string
      description: |
        64-bit part of the full 128-bit chain score. The full score is
        ``(scoreHigh << 64) + scoreLow``. Each block adds ``difficulty − time elapsed since previous block``;
        the chain score is the sum. During synchronization, nodes select the chain with the highest score.
      examples:
        - 1683298087010368300
    FinalizationPoint:
      type: integer
      format: int64
      description: |
        Finalization point within an epoch. Each [epoch](https://docs.symbol.dev/concepts/block.html#finalization)
        is divided into multiple points; blocks are finalized at specific points.
      examples:
        - 0
    FinalizedBlockDTO:
      type: object
      description: |
        A block that has been finalized. It is made permanent and irreversible. Contains the
        finalization epoch, point, block height, and hash.
      required:
        - finalizationEpoch
        - finalizationPoint
        - height
        - hash
      properties:
        finalizationEpoch:
          $ref: '#/components/schemas/FinalizationEpoch'
        finalizationPoint:
          $ref: '#/components/schemas/FinalizationPoint'
        height:
          $ref: '#/components/schemas/Height'
        hash:
          $ref: '#/components/schemas/Hash256'
    ChainInfoDTO:
      type: object
      description: |
        Chain state: block height, chain score, and the latest finalized block (most recent
        block made permanent; it will never be rolled back).
        The chain score is the sum of all block scores in the chain; each block contributes
        ``difficulty − time elapsed since previous block``. Higher score = better chain.
        Used during synchronization to select the canonical chain when forks exist.
      required:
        - height
        - scoreHigh
        - scoreLow
        - latestFinalizedBlock
      properties:
        height:
          $ref: '#/components/schemas/Height'
        scoreHigh:
          description: |
            High 64 bits of the 128-bit chain score. The full score is
            ``(scoreHigh << 64) + scoreLow``. Split because JSON has no native 128-bit integer;
            the sum of millions of block scores (difficulty ~1e13 to 1e15) exceeds 64 bits.
          $ref: '#/components/schemas/Score'
        scoreLow:
          description: Low 64 bits of the 128-bit chain score.
          $ref: '#/components/schemas/Score'
        latestFinalizedBlock:
          description: |
            The most recent block that has been made permanent and will never be rolled back.
            See [finalization](https://docs.symbol.dev/concepts/block.html#finalization).
          $ref: '#/components/schemas/FinalizedBlockDTO'
    StageEnum:
      type: integer
      enum:
        - 0
        - 1
        - 2
      description: |
        Finalization message stage
        ([docs](https://docs.symbol.dev/concepts/block.html#finalization)):
        - `0`: Prevote: voters indicate which block hash they support.
        - `1`: Precommit: voters commit to the block after supermajority prevote.
        - `2`: Count: tally of votes (internal use).
      examples:
        - 0
    ParentPublicKeySignaturePair:
      type: object
      description: Public key and BLS signature pair from a voter.
      required:
        - parentPublicKey
        - signature
      properties:
        parentPublicKey:
          $ref: '#/components/schemas/PublicKey'
        signature:
          $ref: '#/components/schemas/Signature'
    BmTreeSignature:
      type: object
      description: |
        Two-level Bellare-Miner (Bm) tree signature structure: root and bottom pairs, each containing
        a BLS (Boneh, Lynn and Shacham) public key and signature. Used in finalization voting to verify
        that signers are authentic.
      required:
        - root
        - bottom
      properties:
        root:
          $ref: '#/components/schemas/ParentPublicKeySignaturePair'
        bottom:
          $ref: '#/components/schemas/ParentPublicKeySignaturePair'
    MessageGroup:
      type: object
      required:
        - stage
        - height
        - hashes
        - signatures
      properties:
        stage:
          description: Finalization stage (prevote, precommit, or count).
          $ref: '#/components/schemas/StageEnum'
        height:
          description: Block height corresponding to the first hash.
          $ref: '#/components/schemas/Height'
        hashes:
          type: array
          description: |
            Block hashes voted for at this stage. Ordered by height; the first hash corresponds to ``height``,
            subsequent hashes to consecutive block heights.
          items:
            $ref: '#/components/schemas/Hash256'
        signatures:
          type: array
          description: |
            BLS aggregate signatures from the finalizer set attesting to the votes.
            Each entry contains ``root`` and ``bottom`` of the Bm tree.
          items:
            $ref: '#/components/schemas/BmTreeSignature'
    FinalizationProofDTO:
      type: object
      description: |
        Cryptographic proof that a block was finalized. Contains the finalized block identity
        (epoch, point, height, hash) and message groups (prevote, precommit, count) with BLS signatures.
      required:
        - version
        - finalizationEpoch
        - finalizationPoint
        - height
        - hash
        - messageGroups
      properties:
        version:
          type: integer
          description: |
            Proof format version. Incremented when the binary structure of the finalization proof changes.
        finalizationEpoch:
          $ref: '#/components/schemas/FinalizationEpoch'
        finalizationPoint:
          $ref: '#/components/schemas/FinalizationPoint'
        height:
          $ref: '#/components/schemas/Height'
        hash:
          $ref: '#/components/schemas/Hash256'
        messageGroups:
          type: array
          description: |
            Message groups from the finalization voting process: prevote, precommit, and count stages.
            Each group contains block hashes and BLS signatures from the finalizers attesting to the vote.
          items:
            $ref: '#/components/schemas/MessageGroup'
    NetworkTypeDTO:
      type: object
      description: Network type and a short human-readable description.
      required:
        - name
        - description
      properties:
        name:
          type: string
          description: Network name (mainnet or testnet).
          enum:
            - mainnet
            - testnet
          examples:
            - testnet
        description:
          type: string
          description: A short text describing the network.
          examples:
            - Symbol Mainnet
    RentalFeesDTO:
      type: object
      description: |
        Estimated effective rental fees for on-chain resources: root namespace (per block),
        child namespace, and mosaic creation. All amounts are in **network currency** and expressed
        in **smallest (atomic) units**.
      required:
        - effectiveRootNamespaceRentalFeePerBlock
        - effectiveChildNamespaceRentalFee
        - effectiveMosaicRentalFee
      properties:
        effectiveRootNamespaceRentalFeePerBlock:
          $ref: '#/components/schemas/Amount'
          description: Estimated effective rental fee to register/extend a namespace per block.
          examples:
            - 200
        effectiveChildNamespaceRentalFee:
          $ref: '#/components/schemas/Amount'
          description: Estimated effective rental fee to create a subnamespace.
          examples:
            - 10000000
        effectiveMosaicRentalFee:
          $ref: '#/components/schemas/Amount'
          description: Estimated effective rental fee to create a mosaic.
          examples:
            - 50000000
    TransactionFeesDTO:
      type: object
      description: |
        Fee multiplier statistics over the last ``numBlocksTransactionFeeStats`` blocks:
        average, median, highest, lowest, and minimum on the connected node.
        All values are absolute (smallest units).
      required:
        - averageFeeMultiplier
        - medianFeeMultiplier
        - highestFeeMultiplier
        - lowestFeeMultiplier
        - minFeeMultiplier
      properties:
        averageFeeMultiplier:
          $ref: '#/components/schemas/BlockFeeMultiplier'
          description: Average fee multiplier over the last ``numBlocksTransactionFeeStats`` blocks on the current network.
          examples:
            - 103
        medianFeeMultiplier:
          $ref: '#/components/schemas/BlockFeeMultiplier'
          description: Median fee multiplier over the last ``numBlocksTransactionFeeStats`` blocks on the current network.
          examples:
            - 100
        highestFeeMultiplier:
          $ref: '#/components/schemas/BlockFeeMultiplier'
          description: Highest fee multiplier over the last ``numBlocksTransactionFeeStats`` blocks on the current network.
          examples:
            - 1136
        lowestFeeMultiplier:
          $ref: '#/components/schemas/BlockFeeMultiplier'
          description: Lowest fee multiplier over the last ``numBlocksTransactionFeeStats`` blocks on the current network.
          examples:
            - 0
        minFeeMultiplier:
          $ref: '#/components/schemas/BlockFeeMultiplier'
          description: Minimal fee multiplier on the current connected node.
          examples:
            - 10
    NodeIdentityEqualityStrategy:
      type: string
      description: |
        Node equality strategy. Defines if the identifier for the node must be its public key or host.
      enum:
        - host
        - public-key
    NetworkPropertiesDTO:
      type: object
      description: Network related configuration properties.
      properties:
        identifier:
          type: string
          description: Network identifier.
          examples:
            - mainnet
        nodeEqualityStrategy:
          $ref: '#/components/schemas/NodeIdentityEqualityStrategy'
          examples:
            - host
        nemesisSignerPublicKey:
          $ref: '#/components/schemas/PublicKey'
          examples:
            - BE0B4CF546B7B4F4BBFCFF9F574FDA527C07A53D3FC76F8BB7DB746F8E8E0A9F
        generationHashSeed:
          $ref: '#/components/schemas/Hash256'
          examples:
            - 57F7DA205008026C776CB6AED843393F04CD458E0AA2D9F1D5F31A402072B2D6
        epochAdjustment:
          type: string
          description: Nemesis epoch time adjustment.
          examples:
            - 1615853185s
    ChainPropertiesDTO:
      type: object
      description: Chain related configuration properties.
      properties:
        enableVerifiableState:
          type: boolean
          description: Set to true if block chain should calculate state hashes so that state is fully verifiable at each block.
          examples:
            - true
        enableVerifiableReceipts:
          type: boolean
          description: Set to true if block chain should calculate receipts so that state changes are fully verifiable at each block.
          examples:
            - true
        currencyMosaicId:
          type: string
          description: Mosaic id used as primary chain currency.
          examples:
            - 0x6BED'913F'A202'23F8
        harvestingMosaicId:
          type: string
          description: Mosaic id used to provide harvesting ability.
          examples:
            - 0x6BED'913F'A202'23F8
        blockGenerationTargetTime:
          type: string
          description: Targeted time between blocks.
          examples:
            - 30s
        blockTimeSmoothingFactor:
          type: string
          description: A higher value makes the network more biased.
          examples:
            - '3000'
        blockFinalizationInterval:
          type: string
          description: Number of blocks between successive finalization attempts.
          examples:
            - 30
        importanceGrouping:
          type: string
          description: Number of blocks that should be treated as a group for importance purposes.
          examples:
            - '720'
        importanceActivityPercentage:
          type: string
          description: Percentage of importance resulting from fee generation and beneficiary usage.
          examples:
            - '5'
        maxRollbackBlocks:
          type: string
          description: Maximum number of blocks that can be rolled back.
          examples:
            - '0'
        maxDifficultyBlocks:
          type: string
          description: Maximum number of blocks to use in a difficulty calculation.
          examples:
            - '60'
        defaultDynamicFeeMultiplier:
          type: string
          description: Default multiplier to use for dynamic fees.
          examples:
            - '100'
        maxTransactionLifetime:
          type: string
          description: Maximum lifetime a transaction can have before it expires.
          examples:
            - 6h
        maxBlockFutureTime:
          type: string
          description: Maximum future time of a block that can be accepted.
          examples:
            - 300ms
        initialCurrencyAtomicUnits:
          type: string
          description: Initial currency atomic units available in the network.
          examples:
            - 7'842'928'625'000'000
        maxMosaicAtomicUnits:
          type: string
          description: Maximum atomic units (total-supply * 10 ^ divisibility) of a mosaic allowed in the network.
          examples:
            - 8'999'999'999'000'000
        totalChainImportance:
          type: string
          description: Total whole importance units available in the network.
          examples:
            - 7'842'928'625'000'000
        minHarvesterBalance:
          type: string
          description: Minimum number of harvesting mosaic atomic units needed for an account to be eligible for harvesting.
          examples:
            - 10'000'000'000
        maxHarvesterBalance:
          type: string
          description: Maximum number of harvesting mosaic atomic units needed for an account to be eligible for harvesting.
          examples:
            - 50'000'000'000'000
        minVoterBalance:
          type: string
          description: Minimum number of harvesting mosaic atomic units needed for an account to be eligible for voting.
          examples:
            - 3'000'000'000'000
        votingSetGrouping:
          type: string
          description: Number of blocks per finalization epoch (defines epoch duration for voting).
          examples:
            - '1440'
        maxVotingKeysPerAccount:
          type: string
          description: Maximum number of voting keys that can be registered at once per account.
          examples:
            - '3'
        minVotingKeyLifetime:
          type: string
          description: Minimum number of finalization rounds for which voting key can be registered.
          examples:
            - '112'
        maxVotingKeyLifetime:
          type: string
          description: Maximum number of finalization rounds for which voting key can be registered.
          examples:
            - '360'
        harvestBeneficiaryPercentage:
          type: string
          description: Percentage of the harvested fee that is collected by the beneficiary account.
          examples:
            - '25'
        harvestNetworkPercentage:
          type: string
          description: Percentage of the harvested fee that is collected by the network.
          examples:
            - '5'
        harvestNetworkFeeSinkAddressV1:
          $ref: '#/components/schemas/Address'
          description: Legacy (V1) address (in Base32 format) of the harvest network fee sink account. May be absent on newer networks.
          examples:
            - NBUTOBVT5JQDCV6UEPCPFHWWOAOPOCLA5AY5FLI
        harvestNetworkFeeSinkAddress:
          $ref: '#/components/schemas/Address'
          description: Address (in Base32 format) of the harvest network fee sink account.
          examples:
            - NAVORTEX3IPBAUWQBBI3I3BDIOS4AVHPZLCFC7Y
        blockPruneInterval:
          type: string
          description: Number of blocks between cache pruning.
          examples:
            - '360'
        maxTransactionsPerBlock:
          type: string
          description: Maximum number of transactions per block.
          examples:
            - 6'000
    AccountKeyLinkNetworkPropertiesDTO:
      type: object
      properties:
        dummy:
          type: string
          description: to trigger plugin load
    AggregateNetworkPropertiesDTO:
      type: object
      properties:
        maxTransactionsPerAggregate:
          type: string
          description: Maximum number of transactions per aggregate.
          examples:
            - '100'
        maxCosignaturesPerAggregate:
          type: string
          description: Maximum number of cosignatures per aggregate.
          examples:
            - '25'
        enableStrictCosignatureCheck:
          type: boolean
          description: |
            Set to true if cosignatures must exactly match component signers. Set to
            false if cosignatures should be validated externally.
          examples:
            - false
        enableBondedAggregateSupport:
          type: boolean
          description: Set to true if bonded aggregates should be allowed. Set to false if bonded aggregates should be rejected.
          examples:
            - true
        maxBondedTransactionLifetime:
          type: string
          description: Maximum lifetime a bonded transaction can have before it expires.
          examples:
            - 48h
    HashLockNetworkPropertiesDTO:
      type: object
      properties:
        lockedFundsPerAggregate:
          type: string
          description: Amount that has to be locked per aggregate in partial cache.
          examples:
            - 10'000'000
        maxHashLockDuration:
          type: string
          description: Maximum number of blocks for which a hash lock can exist.
          examples:
            - 2d
    SecretLockNetworkPropertiesDTO:
      type: object
