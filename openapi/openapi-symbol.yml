    ForkHeightsDTO:
      type: object
      description: |
        Block heights at which protocol changes (hard forks) took effect. Used during
        synchronization to apply correct validation rules for each block range.
      properties:
        totalVotingBalanceCalculationFix:
          type: string
          description: |
            The block height from which Symbol correctly calculates the total voting
            balance for finalization by including only the stake of accounts with
            active voting keys registered for the current finalization epoch.
            More: https://hackmd.io/@syndicate/postmortem-140921.
          examples:
            - 528'000
        treasuryReissuance:
          type: string
          description: |
            The block height of the Cyprus hard fork that implemented treasury reissuance according to the governance decision.
            More: https://hackmd.io/@syndicate/governance.
          examples:
            - 689'761
        strictAggregateTransactionHash:
          type: string
          description: |
            The block height from which nodes enforce strict validation of aggregate transaction hashes.
            Hashes must be computed from unpadded embedded transactions using the correct
            Merkle tree algorithm; legacy/buggy hash formats are rejected.
            More: https://hackmd.io/@syndicate/postmortem-251022.
          examples:
            - 1'690'500
        skipSecretLockUniquenessChecks:
          type: string
          description: |
            Comma-separated list of block heights at which secret-lock uniqueness checks must be skipped
            during synchronization to reproduce historical (incorrect) chain behavior.
            More: https://thesymbolsyndicate.notion.site/april-2024-secret-locks-e3afb825d2ac4a029f88f74dfe6f02d8?pvs=74.
          examples:
            - 3'191'538
        skipSecretLockExpirations:
          type: string
          description: |
            Comma-separated list of block heights at which secret-lock expiration processing must
            be skipped during synchronization to reproduce historical (incorrect) chain behavior.
            More: https://thesymbolsyndicate.notion.site/april-2024-secret-locks-e3afb825d2ac4a029f88f74dfe6f02d8?pvs=74.
          examples:
            - 3'197'860, 3'197'866
        forceSecretLockExpirations:
          type: string
          description: |
            Comma-separated list of block heights at which secret-lock expiration processing must
            be forcibly executed during synchronization to reproduce historical (incorrect) chain behavior.
            More: https://thesymbolsyndicate.notion.site/april-2024-secret-locks-e3afb825d2ac4a029f88f74dfe6f02d8?pvs=74.
          examples:
            - 3'197'458, 3'197'781
        uniqueAggregateTransactionHash:
          type: string
          description: |
            The block height from which Aggregate V3 transactions become mandatory and payloadSize is included
            in the aggregate transaction hash calculation, ensuring unique transaction hashes.
            More: https://thesymbolsyndicate.notion.site/post-mortem-october-25.
          examples:
            - 4'759'100
    NetworkConfigurationDTO:
      type: object
      description: |
        Full network configuration: network identity, chain parameters, plugin settings,
        and fork heights. Combines data from catapult-server config files (network, chain, plugins).
      required:
        - network
        - chain
        - plugins
        - forkHeights
      properties:
        network:
          $ref: '#/components/schemas/NetworkPropertiesDTO'
        chain:
          $ref: '#/components/schemas/ChainPropertiesDTO'
        plugins:
          $ref: '#/components/schemas/PluginsPropertiesDTO'
        forkHeights:
          $ref: '#/components/schemas/ForkHeightsDTO'
        treasuryReissuanceTransactionSignatures:
          type: array
          items:
            type: string
          description: |
            Multisignature approvals authorizing the network treasury reissuance event for the specified fork height.
            More: https://hackmd.io/@syndicate/governance.
          examples:
            - - 0BBEADD37539444D75C09A245102D2B883267925398504623835DCD625290DEE4FA2371341050C49C001DEDD1C9FE241EA4A...
              - 89447704270E8B2F8EED19526587DB58870D90A02ACEF8AE2A54311DEB95C227201CD39662A0229D5746FFB84074EA6C7DD9...
        corruptAggregateTransactionHashes:
          type: array
          items:
            type: string
          description: |
            List of aggregate transaction hashes that were known to be invalid due to a bug and must be remapped to corrected hashes.
            More: https://hackmd.io/@syndicate/postmortem-251022.
          examples:
            - - 26FF5E7174DEEF3147DB25C37C7AE9905157ACBA2D233D40D1F77A65B60D59BC = 3A2F78C2E7B10FF84EB33BF1DD0FD61951F8E3E...
              - 30FA71E6D1E34DF1E430A07E1B0817BED9A4ED6B0245B7471B0557380A700E1B = AE377EAB7F1970DEC21FF305C39EBDD3ECE413B...
    NetworkInflationDTO:
      type: object
      description: |
        One entry in the inflation schedule: block height from which a reward amount applies, and the reward amount.
      required:
        - startHeight
        - rewardAmount
      properties:
        startHeight:
          $ref: '#/components/schemas/Height'
          description: Block height at which this reward amount becomes active.
          examples:
            - 10
        rewardAmount:
          $ref: '#/components/schemas/Amount'
          description: Inflation reward per block in smallest (atomic) units of the network currency.
          examples:
            - 20500000
    NodeStatusEnum:
      type: string
      description: Operational status of a service (e.g. API node or database).
      enum:
        - up
        - down
    NodeHealthDTO:
      type: object
      description: Status of API node and database services (up/down).
      required:
        - apiNode
        - db
      properties:
        apiNode:
          $ref: '#/components/schemas/NodeStatusEnum'
          description: API node service status.
        db:
          $ref: '#/components/schemas/NodeStatusEnum'
          description: MongoDB service status.
    NodeHealthInfoDTO:
      type: object
      description: |
        Health status of the node: reachability of the API node and database services
        from the REST server.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/NodeHealthDTO'
    RolesTypeEnum:
      type: integer
      description: |
        Bitmask of roles the node provides.
        Individual flags:
        - ``0``: No roles.
        - ``1``: Peer node.
        - ``2``: API node.
        - ``4``: Voting node.
        - ``64``: IPv4 compatible node.
        - ``128``: IPv6 compatible node.

        Flags are combined with bitwise OR. Examples:
        - ``1`` = Peer only.
        - ``2`` = API only.
        - ``3`` = Peer and API.
        - ``7`` = Peer, API and Voting.
        - ``65`` = IPv4 and Peer.
      examples:
        - 7
    NodeInfoDTO:
      type: object
      description: |
        Identity and configuration of the connected node: version, public key, network
        generation hash, roles (peer/api/voting), host, port, and friendly name.
      required:
        - version
        - publicKey
        - networkGenerationHashSeed
        - roles
        - port
        - networkIdentifier
        - friendlyName
        - host
      properties:
        version:
          type: integer
          description: Version of the application.
          examples:
            - 16777993
        publicKey:
          $ref: '#/components/schemas/PublicKey'
        networkGenerationHashSeed:
          $ref: '#/components/schemas/Hash256'
        roles:
          $ref: '#/components/schemas/RolesTypeEnum'
        port:
          type: integer
          description: Port used for the communication.
          examples:
            - 7900
        networkIdentifier:
          $ref: '#/components/schemas/NetworkTypeEnum'
        friendlyName:
          type: string
          description: Node friendly name.
          examples:
            - api-node-0
        host:
          type: string
          description: Node IP address.
          examples:
            - 127.0.0.1
        nodePublicKey:
          $ref: '#/components/schemas/PublicKey'
    StorageInfoDTO:
      type: object
      description: |
        Storage statistics: number of blocks, transactions, and accounts stored by the node.
      required:
        - numBlocks
        - numTransactions
        - numAccounts
      properties:
        numBlocks:
          type: integer
          description: |
            Number of blocks stored. Under normal operation, this equals the chain height
            (see chain info). When the node is synchronizing with the network, both values
            are lower than the network chain height.
          examples:
            - 245053
        numTransactions:
          type: integer
          description: |
            Number of confirmed transactions stored, i.e. transactions included in blocks.
            Excludes unconfirmed transactions in the mempool. For aggregate transactions
            (e.g. multisig), each inner transaction counts as a separate document.
          examples:
            - 58590
        numAccounts:
          type: integer
          description: |
            Number of accounts with on-chain state, i.e. addresses that have participated
            in at least one confirmed transaction (e.g. as sender, recipient, or cosigner).
          examples:
            - 177
    CommunicationTimestampsDTO:
      type: object
      description: |
        Timestamps from the node's perspective for round-trip time calculation. Used when computing node time offset and
        transaction deadlines. The difference between them reflects node processing time and can vary with node load.
      properties:
        sendTimestamp:
          $ref: '#/components/schemas/Timestamp'
          description: Node's network time when it sent the response (milliseconds since nemesis block).
        receiveTimestamp:
          $ref: '#/components/schemas/Timestamp'
          description: |
            Node's network time when it received the client's request (milliseconds since nemesis block).
            Typically used when computing transaction deadlines.
      examples:
        - sendTimestamp: '108303181802'
          receiveTimestamp: '108303181850'
    NodeTimeDTO:
      type: object
      description: |
        Node time at request/response. Used to calculate transaction deadlines
        (deadline = node time + desired lifetime).
      required:
        - communicationTimestamps
      properties:
        communicationTimestamps:
          $ref: '#/components/schemas/CommunicationTimestampsDTO'
    DeploymentDTO:
      type: object
      description: |
        Deployment tool and version used to create/maintain the node; date of last upgrade.
      required:
        - deploymentTool
        - deploymentToolVersion
        - lastUpdatedDate
      properties:
        deploymentTool:
          type: string
          description: The tool used to create, maintain and deploy the node.
          examples:
            - symbol-shoestring
        deploymentToolVersion:
          type: string
          examples:
            - 1.0.6
          description: The version of the tool used to create, maintain and deploy the node.
        lastUpdatedDate:
          type: string
          examples:
            - '2025-06-02'
          description: When was the node last upgraded.
    ServerDTO:
      type: object
      description: |
        REST component version and deployment metadata.
      required:
        - restVersion
        - deployment
      properties:
        restVersion:
          type: string
          examples:
            - 1.0.14
          description: catapult-rest component version.
        deployment:
          $ref: '#/components/schemas/DeploymentDTO'
    ServerInfoDTO:
      type: object
      description: |
        Version and deployment information for the catapult-rest component running
        on this node.
      required:
        - serverInfo
      properties:
        serverInfo:
          $ref: '#/components/schemas/ServerDTO'
    UnlockedAccountDTO:
      type: object
      description: |
        Public keys of accounts with [harvesting](https://docs.symbol.dev/concepts/harvesting.html) unlocked.
        **Only accounts harvesting on the node you are querying** are returned. The scope is limited to this node, not the entire network.
      required:
        - unlockedAccount
      properties:
        unlockedAccount:
          type: array
          description: Public keys of accounts harvesting on this node.
          items:
            $ref: '#/components/schemas/PublicKey'
    NodeMetadataDTO:
      type: object
      description: |
        Key-value metadata set by the node operator (e.g. deployment tool, version,
        custom labels). Keys and values are strings.
      additionalProperties:
        type: string
        description: The value of a user-defined metadata key.
      examples:
        - deploymentTool: symbol-bootstrap
          version: 1.0.2
          nodeName: api-node-0
    transactionPayload:
      type: object
      properties:
        payload:
          type: string
          description: Transaction payload in hexadecimal format.
          example: 00112233445566778899AABBCCDDEEFF
    AnnounceTransactionInfoDTO:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    TransactionTypeEnum:
      type: integer
      enum:
        - 16716
        - 16963
        - 16707
        - 16972
        - 16705
        - 16961
        - 16717
        - 16973
        - 17229
        - 16718
        - 16974
        - 17230
        - 16708
        - 16964
        - 17220
        - 16725
        - 16712
        - 16722
        - 16978
        - 16720
        - 16976
        - 17232
        - 16721
        - 16977
        - 16724
      description: |
        Type of transaction:
        * 0x414C (16716 decimal) - AccountKeyLinkTransaction.
        * 0x4243 (16963 decimal) - VrfKeyLinkTransaction.
        * 0x4143 (16707 decimal) - VotingKeyLinkTransaction.
        * 0x424C (16972 decimal) - NodeKeyLinkTransaction.
        * 0x4141 (16705 decimal) - AggregateCompleteTransaction.
        * 0x4241 (16961 decimal) - AggregateBondedTransaction.
        * 0x414D (16717 decimal) - MosaicDefinitionTransaction.
        * 0x424D (16973 decimal) - MosaicSupplyChangeTransaction.
        * 0x434D (17229 decimal) - MosaicSupplyRevocationTransaction.
        * 0x414E (16718 decimal) - NamespaceRegistrationTransaction.
        * 0x424E (16974 decimal) - AddressAliasTransaction.
        * 0x434E (17230 decimal) - MosaicAliasTransaction.
        * 0x4144 (16708 decimal) - AccountMetadataTransaction.
        * 0x4244 (16964 decimal) - MosaicMetadataTransaction.
        * 0x4344 (17220 decimal) - NamespaceMetadataTransaction.
        * 0x4155 (16725 decimal) - MultisigAccountModificationTransaction.
        * 0x4148 (16712 decimal) - HashLockTransaction.
        * 0x4152 (16722 decimal) - SecretLockTransaction.
        * 0x4252 (16978 decimal) - SecretProofTransaction.
        * 0x4150 (16720 decimal) - AccountAddressRestrictionTransaction.
        * 0x4250 (16976 decimal) - AccountMosaicRestrictionTransaction.
        * 0x4350 (17232 decimal) - AccountOperationRestrictionTransaction.
        * 0x4151 (16721 decimal) - MosaicGlobalRestrictionTransaction.
        * 0x4251 (16977 decimal) - MosaicAddressRestrictionTransaction.
        * 0x4154 (16724 decimal) - TransferTransaction.
    TransactionMetaDTO:
      type: object
      required:
        - height
        - hash
        - merkleComponentHash
        - index
      properties:
        height:
          $ref: '#/components/schemas/Height'
        hash:
          $ref: '#/components/schemas/Hash256'
        merkleComponentHash:
          $ref: '#/components/schemas/Hash256'
        index:
          type: integer
          description: Transaction index within the block.
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        feeMultiplier:
          $ref: '#/components/schemas/BlockFeeMultiplier'
    EmbeddedTransactionMetaDTO:
      type: object
